     放在 IIFE 内部：主文件同一个 <script> 里已经有 MATS 等同名变量，
     放到全局会重复声明直接报错。 */
  const TYPE_EN = { M: 'M', B: 'B', S: 'S' };
  const BOM_TREE = {
    code: '10000', name: '电子挂钟', type: 'M', given: true, qty: '×1',
    children: [
      { code: '11000', name: '机芯', type: 'B', slot: true, qty: '×1' },
      { code: '12000', name: '钟盘', type: 'M', slot: true, qty: '×1', children: [
        { code: '12100', name: '长针', type: 'M', slot: true, qty: '×1', children: [
          { code: '12310', name: '铝材', type: 'B', slot: true, qty: '合计 20 g', shared: 1 } ] },
        { code: '12200', name: '短针', type: 'M', slot: true, qty: '×1', children: [
          { code: '12310', name: '铝材', type: 'B', slot: true, qty: '合计 20 g', shared: 2 } ] },
        { code: '12300', name: '秒针', type: 'M', slot: true, qty: '×1', children: [
          { code: '12310', name: '铝材', type: 'B', slot: true, qty: '合计 20 g', shared: 3 } ] },
        { code: '12400', name: '盘面', type: 'M', slot: true, qty: '×1', children: [
          { code: '12410', name: '盘体', type: 'S', slot: true, qty: '×1', children: [
            { code: '12411', name: '塑料①', type: 'B', slot: true, qty: '0.5 kg', shared: 1 } ] },
          { code: '12420', name: '字膜', type: 'M', slot: true, qty: '×4', children: [
            { code: '12421', name: '薄膜', type: 'B', slot: true, qty: '0.05 m' } ] }
        ] }
      ] },
      { code: '13000', name: '钟框', type: 'S', slot: true, qty: '×1', children: [
        { code: '12411', name: '塑料②', type: 'B', slot: true, qty: '0.5 kg', shared: 2 } ] },
      { code: '14000', name: '电池', type: 'B', slot: true, qty: '×2' }
    ]
  };
  /* 物料主数据（与主文件 const MATS 同一份口径） */
  const MATS = [
    { code: '11000', name: '机芯', type: 'B' },
    { code: '12000', name: '钟盘', type: 'M' },
    { code: '12100', name: '长针', type: 'M' },
    { code: '12200', name: '短针', type: 'M' },
    { code: '12300', name: '秒针', type: 'M' },
    { code: '12310', name: '铝材', type: 'B' },
    { code: '12400', name: '盘面', type: 'M' },
    { code: '12410', name: '盘体', type: 'S' },
    { code: '12411', name: '塑料', type: 'B' },
    { code: '12420', name: '字膜', type: 'M' },
    { code: '12421', name: '薄膜', type: 'B' },
    { code: '13000', name: '钟框', type: 'S' },
    { code: '14000', name: '电池', type: 'B' }
  ];
  const MAT = {};
  MATS.forEach(function (m) { MAT[m.code] = m; });

  /* 每个料码需要几张卡 = 它在树里出现几次（铝材 3、塑料 2，其余 1）。
     卡池里**一个料码只摆一张卡**，卡上的「还需 N 处」＝这个料码还要放几次：
     每拖入一处就减 1，减到 0 这张卡置灰。所以"三个铝材合成一张、拖一次少一个次数"。
     用量总和 == 空槽总数，按类型也刚好配平（B 8 / M 6 / S 2），不会出现
     "槽还空着、这个料的次数却用光了"。 */
  const SLOTS_PER_CODE = {};
  (function countSlots(n) {
    if (n.slot) SLOTS_PER_CODE[n.code] = (SLOTS_PER_CODE[n.code] || 0) + 1;
    (n.children || []).forEach(countSlots);
  })(BOM_TREE);
  const TOTAL_SLOTS = Object.keys(SLOTS_PER_CODE).reduce(function (a, k) { return a + SLOTS_PER_CODE[k]; }, 0);
  const TOTAL_USES = TOTAL_SLOTS;
  const CARD_CODES = Object.keys(SLOTS_PER_CODE).sort();
  function buildCards() {
    const codes = CARD_CODES.slice();
    for (let i = codes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = codes[i]; codes[i] = codes[j]; codes[j] = t;
    }
    return codes.map(function (code) { return { code: code, used: 0 }; });
  }
  let poolCards = [];

  /* ---------- 布局：在演示图那套几何上压紧 ----------
     演示图用 SPX 130 / SPY 148 / NW 120 / NH 76；
     这里用 SPX 128 / SPY 110 / NW 118 / NH 78 —— 列距基本不变（9 列叶子仍排得下），
     行距压掉 38px×3 层，整张图从 642px 高降到 504px，才能和右边的卡池同屏。
     叶子按 DFS 顺序占列；父件 x 取子件平均 → 同层同列自然共线 */
  const SPX = 128, SPY = 110, NW = 118, NH = 78, PAD = 26;
  let leafSeq = 0, maxDepth = 0;
  (function layout(n, depth) {
    n.depth = depth;
    if (depth > maxDepth) maxDepth = depth;
    const kids = n.children || [];
    if (kids.length === 0) {
      n.x = leafSeq++;
    } else {
      kids.forEach(function (c) { layout(c, depth + 1); });
      n.x = kids.reduce(function (s, c) { return s + c.x; }, 0) / kids.length;
    }
  })(BOM_TREE, 0);
  const pxOf = function (n) { return PAD + n.x * SPX; };
  const pyOf = function (n) { return PAD + n.depth * SPY; };
  const STAGE_W = PAD * 2 + (leafSeq - 1) * SPX + NW;
  const STAGE_H = PAD * 2 + maxDepth * SPY + NH;

  const SLOT_TOTAL = TOTAL_SLOTS;
  let done = 0, wrong = 0;
  let sel = null;          /* 当前选中的卡（料码） */
  let selSlot = null;      /* 当前选中的"已填格子"——用于把放好的物料换位置 */
  let drag = null;

  /* ---------- 计时与评分 ---------- */
  const FAST = 70, SLOW = 240, SPD_MAX = 50, SPD_MIN = 10, PEN_EACH = 2, PEN_CAP = 20;
  let t0 = null, clockTimer = null;
  function elapsed() { return t0 === null ? 0 : (Date.now() - t0) / 1000; }
  function fmtT(s) {
    return s < 60 ? s.toFixed(1) + ' 秒'
                  : Math.floor(s / 60) + ' 分 ' + String(Math.round(s % 60)).padStart(2, '0') + ' 秒';
  }
  function tick() {
    const el = document.getElementById('bomClock');
    if (el) el.textContent = t0 === null ? '—' : fmtT(elapsed());
    const w = document.getElementById('bomClockWrap');
    if (w) w.classList.toggle('on', t0 !== null);
  }
  function clockStart() {
    if (t0 !== null) return;
    t0 = Date.now();
    clockTimer = setInterval(tick, 200);
    tick();
  }
  function clockStop() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }
  function clockReset() { clockStop(); t0 = null; tick(); }
  function speedScore(s) {
    if (s <= FAST) return SPD_MAX;
    if (s >= SLOW) return SPD_MIN;
    return SPD_MAX - (SPD_MAX - SPD_MIN) * (s - FAST) / (SLOW - FAST);
  }
  function starOf(total) { return total >= 90 ? 5 : total >= 80 ? 4 : total >= 70 ? 3 : total >= 60 ? 2 : 1; }
  /* 反馈条：平时空着（CSS :empty 不占位），出现后 1.8 秒淡出，
     这样它不会长期占掉纵向空间，也就不会把图挤出屏幕。 */
  let tipTimer = null;
  function tip(html, cls) {
    if (!tipEl) return;
    tipEl.className = 'bom-tip' + (cls ? ' ' + cls : '');
    tipEl.innerHTML = html;
    /* 强制一次重排，让 transition 生效 */
    void tipEl.offsetWidth;
    tipEl.classList.add('on');
    if (tipTimer) clearTimeout(tipTimer);
    tipTimer = setTimeout(function () {
      tipEl.classList.remove('on');
      setTimeout(function () { if (!tipEl.classList.contains('on')) tipEl.innerHTML = ''; }, 220);
    }, 1800);
  }

  /* ---------- 渲染 BOM 图 ----------
     given 节点（成品）：名称 + 料码；
     空槽：**框的颜色＝需要的物料类型**（M 蓝 / B 橙 / S 绿）作为提示，
           但不写类型字母、不写零件名，只有一个「拖入」占位；
     填入后只显示**物料名称**（不带料码），并且仍然可以拖动/点选调整位置。 */
  let slotSeq = 0;
  function nodeHTML(n) {
    const pos = 'left:' + pxOf(n) + 'px;top:' + pyOf(n) + 'px;';
    const cls = 'bom-node ' + (n.given ? 'root' : n.type.toLowerCase());
    const tag = '<span class="bn-tag">' + TYPE_EN[n.type] + '</span>';
    if (!n.slot) {
      return '<div class="' + cls + ' given" style="' + pos + '" data-code="' + n.code + '">' + tag +
               '<span class="bn-name">' + n.name + '</span>' +
               '<span class="bn-sub">' + n.code + '</span>' +
             '</div>';
    }
    slotSeq++;
    /* 空槽带类型类（只是给边框上色），但不带类型字母；
       data-want 是"这一格要什么类型"，data-answer 是标准答案料码（结算用） */
    return '<button class="' + cls + ' slot" style="' + pos + '" data-slot="' + slotSeq + '"' +
             ' data-answer="' + n.code + '" data-want="' + n.type + '"' +
             ' title="把物料卡拖到这里">' +
             '<span class="bn-sub"></span>' +
             '<span class="bn-ph">拖入</span>' +
           '</button>';
  }
  /* 连线：子件顶部 → 父件底部（肘形折线 + 箭头），跟演示图一样 */
  function edgeD(child, parent) {
    const cx = pxOf(child) + NW / 2;
    const cyTop = pyOf(child);
    const px = (parent.given ? pxOf(parent) + 136 / 2 : pxOf(parent) + NW / 2);   /* 根节点宽 136，见 CSS */
    const pyBot = pyOf(parent) + NH;
    const midY = (cyTop + pyBot) / 2;
    return 'M ' + cx + ' ' + cyTop + ' V ' + midY + ' H ' + px + ' V ' + pyBot;
  }
  function renderTree() {
    slotSeq = 0;
    stageEl.style.width = STAGE_W + 'px';
    stageEl.style.height = STAGE_H + 'px';
    linesEl.setAttribute('width', STAGE_W);
    linesEl.setAttribute('height', STAGE_H);
    linesEl.setAttribute('viewBox', '0 0 ' + STAGE_W + ' ' + STAGE_H);
    /* 先画连线，再铺节点（节点盖在连线上，跟演示图一致）。
       连线只算一次、不随重开变化，所以清掉旧节点即可，svg 留着不用重建。 */
    if (!linesEl.dataset.drawn) {
      let paths = '<defs><marker id="bomArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" ' +
        'orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"></path></marker></defs>';
      /* 倒序画：让靠父件的那段竖线压在水平的汇流线之上，观感与演示图一致 */
      const ds = [];
      (function collect(n) {
        (n.children || []).forEach(function (c) { ds.push(edgeD(c, n)); collect(c); });
      })(BOM_TREE);
      ds.reverse().forEach(function (d) {
        paths += '<path d="' + d + '" fill="none" stroke="#9aa3b2" stroke-width="1.8" marker-end="url(#bomArrow)"></path>';
      });
      linesEl.innerHTML = paths;
      linesEl.dataset.drawn = '1';
    }
    stageEl.querySelectorAll('.bom-node').forEach(function (el) { el.remove(); });
    const nodes = [];
    (function walk(n) { nodes.push(nodeHTML(n)); (n.children || []).forEach(walk); })(BOM_TREE);
    stageEl.insertAdjacentHTML('beforeend', nodes.join(''));
  }

  /* ---------- 卡池 ----------
     **一个料码一张卡**：卡上的「还需 N 处」就是这个料还要放几次，每放一处减 1，
     减到 0 整张卡置灰（不再可拖）。铝材就只有一张卡、连着放三次。 */
  function leftOf(code) {
    const c = poolCards.filter(function (x) { return x.code === code; })[0];
    if (!c) return 0;
    return Math.max(0, (SLOTS_PER_CODE[code] || 1) - c.used);
  }
  function isDepleted(code) { return leftOf(code) <= 0; }
  function poolHTML() {
    return poolCards.map(function (c) {
      const m = MAT[c.code], t = m.type, total = SLOTS_PER_CODE[c.code] || 1;
      const left = Math.max(0, total - c.used);
      const need = total > 1 ? '<span class="bc-need">还需 ' + left + ' 处</span>' : '';
      const count = total > 1 ? '<span class="bc-cnt">' + left + ' / ' + total + '</span>' : '';
      return '<div class="bom-card ' + t.toLowerCase() + (left <= 0 ? ' used' : '') + '"' +
               ' data-code="' + c.code + '"' +
               ' title="' + m.name + '：本局要用 ' + total + ' 处' +
               (total > 1 ? '，还剩 ' + left + ' 处' : '') + '">' + need +
               '<div class="bc-n">' + m.name + '</div>' + count + '</div>';
    }).join('');
  }
  function cards() { return Array.prototype.slice.call(poolEl.querySelectorAll('.bom-card')); }
  function slots() { return Array.prototype.slice.call(stageEl.querySelectorAll('.bom-node.slot')); }
  function openSlots() { return slots().filter(function (s) { return !s.classList.contains('filled'); }); }
  function filledSlots() { return slots().filter(function (s) { return s.classList.contains('filled'); }); }
  function selType() { return sel && MAT[sel] ? MAT[sel].type : null; }
  /* 某个槽"要的是哪种料"：空槽看图上给的答案，已填的看里面放的是什么 ——
     两种都能拿来做类型提示（选中卡/选中已填格子时高亮可去的位置） */
  function slotType(s) {
    return s.dataset.want;
  }
  function refreshHints() {
    const t = selSlot ? slotType(selSlot) : (sel ? selType() : null);
    slots().forEach(function (s) {
      s.classList.toggle('hint', !!t && s !== selSlot && slotType(s) === t);
    });
  }
  function paint() {
    cards().forEach(function (c) { c.classList.toggle('sel', !c.classList.contains('used') && c.dataset.code === sel); });
    slots().forEach(function (s) { s.classList.toggle('sel', s === selSlot); });
    refreshHints();
  }
  /* 选中一张卡就清掉格子选中，反之亦然 —— 两个选中态互斥 */
  function selectCard(code) { selSlot = null; sel = code; paint(); }
  function selectSlot(s) { selSlot = s; sel = null; paint(); }

  /* ---------- 状态同步 ---------- */
  function sync() {
    document.getElementById('bomScore').textContent = done;
    document.getElementById('bomDone').textContent = done;
    document.getElementById('bomWrong').textContent = wrong;
    tick();
  }

  /* ---------- 标准 BOM 对照表（结算页用） ---------- */
  const REF_ROWS = (function () {
    const rows = [];
    (function walk(n, d) {
      if (n.slot) rows.push({ d: d, name: n.name, code: n.code, qty: n.qty, type: n.type });
      (n.children || []).forEach(function (c) { walk(c, d + 1); });
    })(BOM_TREE, 0);
    return rows;
  })();

  /* ---------- 判定：只看类型 —— 任意"类型相符"的空槽都算对（一对多） ---------- */
  function place(slotEl, code) {
    if (!slotEl || !code || slotEl.classList.contains('filled')) return false;
    clockStart();
    const m = MAT[code];
    if (m.type === slotEl.dataset.want) {
      SFX.ok();
      done++;
      /* 计一次用量：卡上的「还需 N 处」减 1，减到 0 整张卡置灰 */
      const card = poolCards.filter(function (c) { return c.code === code; })[0];
      if (card) card.used++;
      paintSlot(slotEl, code);                      /* 统一由 paintSlot 写格子状态 */
      slotEl.classList.add('good');
      setTimeout(function () { slotEl.classList.remove('good'); }, 420);
      const left = leftOf(code);
      tip('✓ <b>' + m.name + '</b> 放进去了' +
        (left > 0 ? '　—— 这个料还要放 <b>' + left + '</b> 处，同一张卡继续拖'
                  : '　—— 这个料的用量已经放完，卡片已置灰'), 'ok');
      /* 放完就清掉卡的选中态：避免"旧卡还选着"导致下一次点格子被误当成再放一次 */
      sel = null; selSlot = null;
      renderPool(); paint(); sync();
      if (done >= SLOT_TOTAL) finish();
      return true;
    }
    SFX.no();
    wrong++;
    slotEl.classList.add('bad');
    setTimeout(function () { slotEl.classList.remove('bad'); }, 440);
    tip('✗ 这个位置不是放 <b>' + m.name + '</b> 的地方，换一张试试。', 'no');
    sync();
    return false;
  }

  function renderPool() {
    poolEl.innerHTML = poolHTML();
    const hint = document.getElementById('bomPoolHint');
    if (hint) {
      const leftUses = poolCards.reduce(function (a, c) {
        return a + Math.max(0, (SLOTS_PER_CODE[c.code] || 1) - c.used);
      }, 0);
      hint.textContent = '剩 ' + leftUses + ' / ' + TOTAL_USES + ' 处　·　铝材 1 张卡放 3 处、塑料 1 张放 2 处';
    }
    paint();
  }

  function finish() {
    clockStop();
    const sec = elapsed();
    const acc = SPD_MAX * done / SLOT_TOTAL;
    const spd = speedScore(sec);
    const pen = Math.min(PEN_CAP, wrong * PEN_EACH);
    const total = Math.max(0, Math.round(acc + spd - pen));
    const st = starOf(total);
    const verdict = sec <= FAST && wrong === 0
      ? '又快又准，BOM 结构掌握得很牢。'
      : total >= 90 ? '几乎满分了，就差那么一点小失误。'
      : total >= 80 ? '整体不错，再快一点就是满分节奏。'
      : total >= 65 ? '结构基本对了，把速度提上来分数会明显好看。'
      : '先把层级和类型练熟，速度自然跟着上来。';
    document.getElementById('bomRes').innerHTML =
      '<div class="br-line"><b>' + done + ' / ' + SLOT_TOTAL + ' 全部填完</b>　' +
        '<span class="br-stars">' + '★'.repeat(st) + '☆'.repeat(5 - st) + '</span>　' +
        '综合 <span class="br-total">' + total + '</span> 分</div>' +
      '<div class="br-brk">' +
        '<span>用时 <b>' + fmtT(sec) + '</b></span>' +
        '<span>放错 <b>' + wrong + '</b> 次</span>' +
        '<span>准确分 <b>' + acc.toFixed(0) + '</b> / 50</span>' +
        '<span>速度分 <b>' + spd.toFixed(0) + '</b> / 50（' + FAST + ' 秒以内满分）</span>' +
        '<span>失误扣分 <b>' + (wrong ? '−' + (wrong * PEN_EACH) : '0') + '</b></span>' +
      '</div>' +
      '<div>' + verdict + '</div>' +
      '<div style="margin-top:6px"><b>两个容易忽略的地方</b>：<b>铝材 12310</b> 在长针、短针、秒针下面各出现一次' +
      '（同一种料、同一个料码，用量已按合计 20 g 给）；<b>塑料 12411</b> 既做盘体又做钟框 —— ' +
      '同一个料码可以供多个父件，这正是 BOM 里最容易看漏的一环。</div>' +
      '<div class="br-ref"><b>标准 BOM 对照</b>（同样的位置，ERP 里记的是这个料码与用量）：' +
        '<table>' + REF_ROWS.map(function (r) {
          return '<tr><td class="rname" style="padding-left:' + (r.d * 20) + 'px">' + r.name + '</td>' +
            '<td class="rcode">' + r.code + '</td>' +
            '<td class="rcode">' + r.qty + '</td>' +
            '<td class="rtype ' + r.type.toLowerCase() + '">' + TYPE_EN[r.type] + '</td></tr>';
        }).join('') + '</table></div>';
    document.getElementById('bomRes').classList.add('show');
    tip('全部填完 ✓　用时 ' + fmtT(sec) + '　综合 ' + total + ' 分', 'ok');
  }

  /* ---------- 发牌（重开） ---------- */
  function deal() {
    done = 0; wrong = 0; sel = null;
    clockReset();
    const mx = document.getElementById('bomScoreMax'), tt = document.getElementById('bomTotal');
    if (mx) mx.textContent = '/ ' + SLOT_TOTAL;
    if (tt) tt.textContent = SLOT_TOTAL;
    renderTree();
    poolCards = buildCards();
    document.getElementById('bomRes').classList.remove('show');
    sel = poolCards.length ? poolCards[0].code : null;
    renderPool();
    /* 开局不再刷一大段说明（占地方）；要交代的规则都在面板标题和卡片上写着 */
    sync();
  }

  /* ---------- 鼠标 / 触屏拖拽 ----------
     两个来源都能拖：
       · 卡池里的卡 → 拖进空槽才算"放置"
       · 已经放进图里的格子 → 拖到别的格子 = 换位置（拖到已填格子上则两者互换） */
  function zf() { return window.__FITZ__ || 1; }
  function beginDrag(srcEl, code, e, fromSlot) {
    const r = srcEl.getBoundingClientRect(), z = zf();
    const ghost = srcEl.cloneNode(true);
    ghost.classList.add('bom-ghost');
    ghost.style.width = (r.width / z) + 'px';
    ghost.style.left = (r.left / z) + 'px';
    ghost.style.top = (r.top / z) + 'px';
    document.body.appendChild(ghost);
    drag = { code: code, el: srcEl, ghost: ghost, moved: false, from: fromSlot || null,
             dx: (e.clientX - r.left) / z, dy: (e.clientY - r.top) / z };
    srcEl.classList.add('dragging');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }
  function endDrag() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if (drag.el) drag.el.classList.remove('dragging');
    slots().forEach(function (x) { x.classList.remove('over'); });
    drag = null;
  }
  poolEl.addEventListener('pointerdown', function (e) {
    const card = e.target && e.target.closest ? e.target.closest('.bom-card') : null;
    if (!card || isDepleted(card.dataset.code)) return;      /* 用量已放完的卡不能拖 */
    e.preventDefault();
    selectCard(card.dataset.code);
    beginDrag(card, card.dataset.code, e, null);
  });
  /* 已填格子也能拖：按下时先记下它，拖动则换位，不拖动就是"选中" */
  stageEl.addEventListener('pointerdown', function (e) {
    const s = e.target && e.target.closest ? e.target.closest('.bom-node.slot') : null;
    if (!s || !s.classList.contains('filled')) return;
    e.preventDefault();
    const code = s.dataset.placed;
    selectSlot(s);
    beginDrag(s, code, e, s);
  });
  function slotUnder(x, y) {
    let hit = null;
    slots().forEach(function (s) {
      const r = s.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = s;
    });
    return hit;
  }
  function onMove(e) {
    if (!drag) return;
    drag.moved = true;
    const z = zf();
    drag.ghost.style.left = (e.clientX / z - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY / z - drag.dy) + 'px';
    const s = slotUnder(e.clientX, e.clientY);
    slots().forEach(function (x2) { x2.classList.toggle('over', x2 === s && x2 !== drag.from); });
  }
  function onUp(e) {
    if (!drag) return;
    const from = drag.from, moved = drag.moved, code = drag.code;
    endDrag();
    if (!moved) return;                       /* 只是点了一下：当选中，不判定 */
    const s = slotUnder(e.clientX, e.clientY);
    if (!s || s === from) return;
    if (from) moveToSlot(from, s);            /* 图里换位置 */
    else place(s, code);                      /* 从卡池放进来 */
  }

  /* 把已填格子里的物料换到另一个格子；目标是空槽就搬过去，已填就互换 */
  function swapSlots(a, b) {
    const ca = a.dataset.placed, cb = b.dataset.placed;
    paintSlot(a, cb);
    paintSlot(b, ca);
  }
  function paintSlot(el, code) {
    if (!code) {
      el.classList.remove('filled', 'sel');
      delete el.dataset.placed;
      delete el.dataset.type;
      el.querySelector('.bn-sub').textContent = '';
      el.querySelector('.bn-ph').style.display = '';
      return;
    }
    el.classList.add('filled');
    el.dataset.placed = code;
    el.dataset.type = MAT[code].type;
    el.querySelector('.bn-sub').textContent = MAT[code].name;
    el.querySelector('.bn-ph').style.display = 'none';
  }
  function moveToSlot(from, to) {
    const a = from.dataset.placed, b = to.dataset.placed;
    if (!a) return;
    if (b) {                                  /* 两个都填着：同类型就互换，否则不动 */
      if (MAT[a].type !== MAT[b].type) {
        SFX.no();
        wrong++;
        to.classList.add('bad');
        setTimeout(function () { to.classList.remove('bad'); }, 440);
        tip('✗ <b>' + MAT[a].name + '</b> 和 <b>' + MAT[b].name + '</b> 类型不同，不能互换位置。', 'no');
        sync();
        return;
      }
      SFX.ok();
      swapSlots(from, to);
      tip('↔ <b>' + MAT[a].name + '</b> 与 <b>' + MAT[b].name + '</b> 换了个位置', 'ok');
    } else {                                  /* 搬到空槽 */
      SFX.ok();
      paintSlot(from, null);
      paintSlot(to, a);
      tip('↔ <b>' + MAT[a].name + '</b> 挪到了新的位置', 'ok');
    }
    /* 换完清掉所有选中态，下一次点击就是"选格子"，不会又被当成放置 */
    sel = null; selSlot = null;
    paint();
    sync();
  }

  /* ---------- 键盘：←→ 选卡；点空槽填入 ---------- */
  document.addEventListener('keydown', function (e) {
    const active = document.querySelector('.view.active');
    if (active && active.id !== 'bomView') return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      /* 只在还没用掉的卡之间移动 */
      const list = cards().filter(function (c) { return !isDepleted(c.dataset.code); });
      if (!list.length) return;
      const codes = list.map(function (c) { return c.dataset.code; });
      const i = codes.indexOf(sel);
      const step = (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 1;
      selectCard(codes[(i + step + codes.length) % codes.length]);
      return;
    }
    if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') {
      /* 选中了图里的格子：按 Enter 就把它挪到第一个空槽（同类型优先） */
      if (selSlot) {
        e.preventDefault();
        const target = openSlots().filter(function (s) { return slotType(s) === slotType(selSlot); })[0];
        if (target) moveToSlot(selSlot, target);
        return;
      }
      if (!sel) return;
      e.preventDefault();
      const list = openSlots();
      const target = list.filter(function (s) { return s.dataset.answer === sel; })[0]
                  || list.filter(function (s) { return slotType(s) === MAT[sel].type; })[0];
      if (target) place(target, sel);
    }
  });
  /* 点格子：
     · 选着卡 → 放进这一格
     · 选着图里另一个格子 → 两者互换 / 挪过去
     · 什么都没选 → 选中这一格（已填的可以再拖走） */
  stageEl.addEventListener('click', function (e) {
    const s = e.target && e.target.closest ? e.target.closest('.bom-node.slot') : null;
    if (!s) return;
    if (sel) { place(s, sel); return; }
    if (selSlot && selSlot !== s) { moveToSlot(selSlot, s); return; }
    if (s.classList.contains('filled')) {
      if (selSlot === s) { selSlot = null; paint(); } else { selectSlot(s); }
    }
  });

  document.getElementById('bomReset').addEventListener('click', deal);
  deal();
})();
/* BOM-BUILD-JS-END */

/* ============ 7. 物料分类拖拽小游戏（同页视图切换） ============ */
const gameItems = flatList.slice();
const TYPE_NAMES = { M: '自制件（本厂加工 / 装配生产）', B: '采购件（向供应商采购）', S: '委外件（本厂发料给委外商加工后收回）' };
const ZONE_TITLES = { M: '自制件', B: '采购件', S: '委外件' };
const GAME_TOTAL = 10;   // 每局固定 10 个物料
const WAIT_OK = 2;       // 答对后停留秒数
const WAIT_NO = 3;       // 答错后停留秒数（原来 4 秒，课堂上偏拖，收到 3 秒）

let gameScore = 0, gameTotal = 0, gameCorrect = 0, gameWrong = 0;
let mistakes = [];       // 本局答错明细：{name, code, chose, correct}
let currentItem = null, lastItem = null, gameLocked = false, roundQueue = [];
let dragState = null, dragGhost = null;
let waitTimer = null, waitLeft = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 一局的题目数：固定 10 个，物料不够时取全部 */
function roundSize() { return Math.min(GAME_TOTAL, gameItems.length); }

/* 生成一局 10 个互不相同的物料，且至少包含 1 个委外件(S) */
function buildRoundQueue() {
  const n = roundSize();
  const sItems = gameItems.filter(function (it) { return it.type === 'S'; });
  const picked = [];
  if (sItems.length) picked.push(sItems[Math.floor(Math.random() * sItems.length)]);
  const taken = picked.map(function (it) { return it.code; });
  const rest = shuffle(gameItems.filter(function (it) { return taken.indexOf(it.code) < 0; }).slice())
    .slice(0, Math.max(0, n - picked.length));
  const q = shuffle(picked.concat(rest));
  // 避免新一局第一个物料与上一局最后一个相同
  if (lastItem && q.length > 1 && q[0].code === lastItem.code) {
    const j = 1 + Math.floor(Math.random() * (q.length - 1));
    const t = q[0]; q[0] = q[j]; q[j] = t;
  }
  return q;
}

function updateGameStats() {
  document.getElementById('gameScore').textContent = gameScore;
  document.getElementById('gameAnswered').textContent = gameTotal;
  document.getElementById('gameCorrect').textContent = gameCorrect;
  document.getElementById('gameWrong').textContent = gameWrong;
}

/* ---------- 答完一题后的停留倒计时（看答案的时间，可随时跳过） ---------- */
function clearWait() {
  if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
  waitLeft = 0;
}
function renderWait() {
  const el = document.getElementById('fbWait');
  if (el) el.textContent = waitLeft > 0 ? '（' + waitLeft + ' 秒后自动进入下一个 · 按空格可立即继续）' : '';
}
function scheduleNext(secs) {
  clearWait();
  waitLeft = secs;
  renderWait();
  document.getElementById('gameFeedback').classList.add('can-skip');
  waitTimer = setInterval(function () {
    waitLeft--;
    if (waitLeft <= 0) { clearWait(); nextMaterial(); return; }
    renderWait();
  }, 1000);
}
/* 看答案期间按空格 / 点一下反馈文字，立刻进入下一个 */
function skipWait() {
  if (!waitTimer) return;
  clearWait();
  nextMaterial();
}

/* ---------- 正确答案标记 ---------- */
function clearAnswerMarks() {
  document.querySelectorAll('.zone.answer').forEach(function (z) { z.classList.remove('answer'); });
  document.querySelectorAll('.zone .zone-tag').forEach(function (t) { t.remove(); });
}
function markAnswer(type, text) {
  const z = document.querySelector('.zone[data-type="' + type + '"]');
  if (!z) return;
  z.classList.add('answer');
  const tag = document.createElement('span');
  tag.className = 'zone-tag';
  tag.textContent = text;
  z.insertBefore(tag, z.firstChild);
}

/* 抽下一个物料；抽完就出成绩 */
function nextMaterial() {
  clearWait();
  const fb0 = document.getElementById('gameFeedback');
  fb0.classList.remove('can-skip');
  const card = document.getElementById('matCard');
  card.classList.remove('ok', 'no');
  document.querySelectorAll('.zone').forEach(function (z) { z.classList.remove('wrong', 'over'); });
  clearAnswerMarks();
  if (roundQueue.length === 0) {
    document.getElementById('matName').textContent = '✓ 全部完成';
    card.classList.add('locked');
    setTimeout(showGameResult, 500);
    return;
  }
  currentItem = roundQueue.pop();
  lastItem = currentItem;
  gameLocked = false;
  document.getElementById('matName').textContent = currentItem.name;
  fb0.className = 'game-feedback';
  fb0.textContent = '';
}

function refreshZones() {
  ['M', 'B', 'S'].forEach(function (t) {
    const box = document.getElementById('zoneItems-' + t);
    const n = box.querySelectorAll('.zi').length;
    document.getElementById('zoneCount-' + t).textContent = n;
    if (!n && !box.querySelector('.empty')) {
      box.innerHTML = '<span class="empty">拖到这里</span>';
    }
  });
}

/* 把物料放进分类箱；ok=false 表示这是答错后归位的，划掉以示区别 */
function placeInZone(type, item, ok) {
  const box = document.getElementById('zoneItems-' + type);
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const chip = document.createElement('span');
  chip.className = 'zi' + (ok ? '' : ' miss');
  chip.textContent = item.name;                    /* 只印物料名，不再带物料编码 */
  if (!ok) chip.title = '这一题答错了：它不是' + ZONE_TITLES[item.type] + '，正确分类就是本箱「' + ZONE_TITLES[item.type] + '」';
  box.appendChild(chip);
  refreshZones();
}

function clearZones() {
  ['M', 'B', 'S'].forEach(function (t) {
    document.getElementById('zoneItems-' + t).innerHTML = '<span class="empty">拖到这里</span>';
  });
  refreshZones();
}

function startRound() {
  clearWait();
  removeGhost();
  dragState = null;
  const wrap = document.querySelector('.dnd-source');
  if (wrap) wrap.classList.remove('empty');
  const card = document.getElementById('matCard');
  card.classList.remove('locked', 'ok', 'no', 'dragging');
  document.getElementById('gameResult').style.display = 'none';
  document.getElementById('gameQuestion').style.display = '';
  document.getElementById('gameReview').innerHTML = '';
  clearZones();
  clearAnswerMarks();
  document.querySelectorAll('.zone').forEach(function (z) { z.classList.remove('wrong', 'over'); });
  gameScore = 0; gameTotal = 0; gameCorrect = 0; gameWrong = 0;
  mistakes = [];
  lastItem = null;
  roundQueue = buildRoundQueue();
  updateGameStats();
  nextMaterial();
}

function showGameResult() {
  clearWait();
  document.getElementById('gameQuestion').style.display = 'none';
  document.getElementById('gameResult').style.display = '';
  document.getElementById('resultScore').textContent = gameScore;
  const n = roundSize();
  const msg = document.getElementById('resultMsg');
  if (gameScore === n) {
    msg.className = 'gr-msg full';
    msg.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg> 满分！' + n + ' 个物料全部分类正确';
  } else if (gameScore >= n * 0.7) {
    msg.className = 'gr-msg notfull';
    msg.textContent = '答对 ' + gameScore + ' / ' + n + ' 个，还有 ' + (n - gameScore) + ' 个要再看看';
  } else {
    msg.className = 'gr-msg notfull';
    msg.textContent = '答对 ' + gameScore + ' / ' + n + ' 个，下面逐条看看错在哪里';
  }
  const rev = document.getElementById('gameReview');
  if (!mistakes.length) {
    rev.innerHTML = '<div class="gr-none">没有错误，10 个物料全部分类正确 ✓</div>';
  } else {
    rev.innerHTML = '<div class="gr-rev-title">错误明细 · 共 ' + mistakes.length + ' 个</div>' +
      mistakes.map(function (m) {
        return '<div class="gr-rev-item">' +
          '<span class="gr-name">' + m.name + '</span>' +
          '<span class="rc">' + m.code + '</span>' +
          '<span class="gr-chose">你选了 <i>' + ZONE_TITLES[m.chose] + '</i></span>' +
          '<span class="gr-arrow">→</span>' +
          '<span class="gr-right">正确答案：<i>' + ZONE_TITLES[m.correct] + '</i></span>' +
          '</div>';
      }).join('');
  }
  updateGameStats();
}

/* ---------- 放置判定：一题只有一次机会，错了直接给答案 ---------- */
function tryPlace(type) {
  if (gameLocked || !currentItem) return;
  clearWait();
  const card = document.getElementById('matCard');
  const fb = document.getElementById('gameFeedback');
  const item = currentItem;
  const ok = (type === item.type);
  gameTotal++;
  gameLocked = true;
  currentItem = null;
  clearAnswerMarks();
  document.querySelectorAll('.zone').forEach(function (z) { z.classList.remove('wrong'); });

  if (ok) {
    SFX.ok();
    gameScore++; gameCorrect++;
    card.classList.add('ok');
    fb.className = 'game-feedback ok';
    fb.innerHTML = "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-4px;\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"/><path d=\"M22 4 12 14.01l-3-3\"/></svg>" + ' 正确！「' + item.name + '（' + item.code + '）」是 <b>' +
      TYPE_NAMES[item.type] + '</b><span class="fb-wait" id="fbWait"></span>';
    placeInZone(item.type, item, true);
    markAnswer(item.type, '✓ 正确');
    updateGameStats();
    scheduleNext(WAIT_OK);
  } else {
    SFX.no();
    gameWrong++;
    mistakes.push({ name: item.name, code: item.code, chose: type, correct: item.type });
    card.classList.add('no');
    const wz = document.querySelector('.zone[data-type="' + type + '"]');
    if (wz) wz.classList.add('wrong');
    fb.className = 'game-feedback no';
    fb.innerHTML = "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-4px;\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m15 9-6 6\"/><path d=\"m9 9 6 6\"/></svg>" + ' 「' + item.name + '」放错了：你选了 <b>' + ZONE_TITLES[type] +
      '</b>，正确答案是 <b>' + ZONE_TITLES[item.type] + '</b> —— ' + TYPE_NAMES[item.type] +
      '<span class="fb-wait" id="fbWait"></span>';
    placeInZone(item.type, item, false);
    markAnswer(item.type, '✓ 正确答案');
    updateGameStats();
    scheduleNext(WAIT_NO);
  }
}

/* ---------- 指针拖拽（鼠标 / 触摸通用） ---------- */
function removeGhost() {
  if (dragGhost && dragGhost.parentNode) dragGhost.parentNode.removeChild(dragGhost);
  dragGhost = null;
}
function zoneUnder(x, y) {
  let hit = null;
  document.querySelectorAll('.dnd-zones .zone').forEach(function (z) {
    const r = z.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = z;
  });
  return hit;
}
function setOver(zone) {
  document.querySelectorAll('.dnd-zones .zone').forEach(function (z) { z.classList.toggle('over', z === zone); });
}
function onDragMove(e) {
  if (!dragState) return;
  const x = e.clientX, y = e.clientY;
  dragState.moved = true;
  if (dragGhost) {
    dragGhost.style.left = ((x - dragState.dx) / ZF()) + 'px';
    dragGhost.style.top = ((y - dragState.dy) / ZF()) + 'px';
  }
  setOver(zoneUnder(x, y));
}
function onDragUp(e) {
  if (!dragState) return;
  const st = dragState;
  dragState = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragUp);
  document.removeEventListener('pointercancel', onDragUp);
  const x = e.clientX, y = e.clientY;
  const zone = st.moved ? zoneUnder(x, y) : null;
  setOver(null);
  removeGhost();
  document.getElementById('matCard').classList.remove('dragging');
  if (st.moved) {
    if (zone) tryPlace(zone.dataset.type);
    else {
      const fb = document.getElementById('gameFeedback');
      fb.className = 'game-feedback';
      fb.textContent = '把卡片拖到下面任意一个分类箱里再松手';
    }
  }
}
function bindDrag() {
  const card = document.getElementById('matCard');
  card.addEventListener('pointerdown', function (e) {
    if (gameLocked || !currentItem) return;
    e.preventDefault();
    const r = card.getBoundingClientRect();
    dragState = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
    dragGhost = card.cloneNode(true);
    dragGhost.removeAttribute('id');
    dragGhost.querySelectorAll('[id]').forEach(function (n) { n.removeAttribute('id'); });
    dragGhost.classList.add('drag-ghost');
    dragGhost.classList.remove('dragging');
    dragGhost.style.width = (r.width / ZF()) + 'px';
    dragGhost.style.left = (r.left / ZF()) + 'px';
    dragGhost.style.top = (r.top / ZF()) + 'px';
    document.body.appendChild(dragGhost);
    card.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragUp);
    document.addEventListener('pointercancel', onDragUp);
  });
}

/* 键盘：1/2/3 分别放入 委外件 / 自制件 / 采购件 */
document.addEventListener('keydown', function (e) {
  if (!document.getElementById('gameView').classList.contains('active')) return;
  /* 看答案期间：空格 / 回车立即进入下一个 */
  if ((e.key === ' ' || e.key === 'Enter') && waitTimer) { e.preventDefault(); skipWait(); return; }
  const map = { '1': 'M', '2': 'B', '3': 'S' };
  if (map[e.key]) { e.preventDefault(); tryPlace(map[e.key]); }
});

document.getElementById('gameReset').addEventListener('click', startRound);
document.getElementById('gameRestart').addEventListener('click', startRound);
document.getElementById('gameFeedback').addEventListener('click', skipWait);
bindDrag();
refreshZones();

/* ===================== 合并进来的两个子页面：顶部导航 + iframe 视图 =====================
   两个子页面各自是完整独立的 HTML，放在页面底部的 <template> 里；
   切到该页时才把内容塞进 iframe 的 srcdoc。这样三套 CSS / 脚本天然隔离，
   不会互相污染；而且页面状态在第一次打开后一直保留（切来切去不回档）。 */
function isSubView() {
  var a = document.querySelector('.view.active');
  return !!a && a.id === 'factoryView';
}
function ensureSubFrame(viewId) {
  var map = {
    demoView:    ['demoFrame',    'tpl-demo'],
    figView:     ['figFrame',     'tpl-fig'],
    factoryView: ['factoryFrame', 'tpl-factory']
  };
  var m = map[viewId];
  if (!m) return;
  var fr = document.getElementById(m[0]), tpl = document.getElementById(m[1]);
  if (!fr || !tpl || fr.dataset.built) return;
  fr.dataset.built = '1';
  /* template 解析会把 doctype / <html> / <head> / <body> 这些标签吃掉，这里补回来 */
  fr.srcdoc = '<!doctype html><html lang="zh-CN">' + tpl.innerHTML;
  fr.addEventListener('load', function () {
    /* 把键盘交给子页面：file:// 下跨源访问 contentWindow 可能被拦，所以两级兜底 */
    try { fr.focus(); } catch (e) {}
    try { fr.contentWindow.focus({ preventScroll: true }); } catch (e) {}
  }, { once: true });
}
/* 视图切换 */
function showView(id) {
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('#navBar .nb-tab').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-view') === id);
  });
  window.scrollTo(0, 0);
  ensureSubFrame(id);
  /* 分类小游戏是拖拽玩法，得保证分类箱的实时位置是准的（切回来时页面布局刚变过） */
  if (id === 'gameView' && typeof refreshZones === 'function') refreshZones();
}
document.querySelectorAll('#navBar .nb-tab').forEach(function (b) {
  b.addEventListener('click', function () { showView(b.getAttribute('data-view')); });
});

/* ===================== 跨机适配：把版面坐标宽度锁成 1280 =====================
   Windows 显示缩放 100% / 125% / 150% 会让浏览器的 CSS 像素宽度差很多
   （1920×1080 的屏：100% 时浏览器可用 1920px，150% 时只剩 1280px），
   同一份版面在不同机器上看起来就完全不是一回事。
   做法：按 window.innerWidth 反算一个 zoom 系数，让「版面坐标宽度」恒等于 DESIGN_W，
   于是不管对方怎么缩放，看到的构图一模一样，只是整体大小不同。
   两个 Chrome 实测的坑：
     · vh 单位不受 zoom 影响 —— iframe 高度必须用 JS 按版面坐标算，不能写 calc(100vh - 46px)
     · getBoundingClientRect() 返回缩放后的视觉值，而 offsetWidth / style.left 用的是版面值
       —— 两者混用的地方要 /ZF()（已改 refreshBoardScale / 描述框限高 / 拖拽替身三处） */
/* 基准宽度＝「本机浏览器最大化时的可用宽度」。取这个值的两个好处：
   ① 本机 zoom ≈ 1.00，观感和没开适配时完全一样，不用重新适应；
   ② 教室那台不管是 125% 还是 150%，版面坐标都是同一个 1900×983，
      构图和「一屏能看到多少内容」都跟本机一致，物理字号也一致。 */
var DESIGN_W = 1900;
function ZF() { return window.__FITZ__ || 1; }
function fitScale() {
  if (window.__FIT_OFF__ || location.search.indexOf('fit=0') >= 0) return 1;
  var z = (window.innerWidth || DESIGN_W) / DESIGN_W;
  /* 窗口特别窄/特别宽时不硬套，免得字小到看不清或糊满整屏 */
  return Math.max(0.5, Math.min(2.5, z));
}
function applyFit() {
  var z = fitScale();
  window.__FITZ__ = z;
  document.body.style.zoom = (z === 1) ? '' : String(z);
  /* iframe 高度用版面坐标算：渲染出来正好等于「窗口高 − 导航高」 */
  var avail = Math.max(240, window.innerHeight / z - 46 - 1);
  document.querySelectorAll('.subframe').forEach(function (f) { f.style.height = avail + 'px'; });
  var btn = document.getElementById('nbFit');
  if (btn) {
    btn.textContent = window.__FIT_OFF__ ? '缩放 关闭' : '缩放 ' + Math.round(z * 100) + '%';
    btn.classList.toggle('off', !!window.__FIT_OFF__);
  }
  if (typeof refreshBoardScale === 'function') refreshBoardScale();
}
document.getElementById('nbFit').addEventListener('click', function () {
  window.__FIT_OFF__ = !window.__FIT_OFF__;   /* 现场发现不对可以一键退回 100% */
  applyFit();
});
window.addEventListener('resize', function () { applyFit(); });
window.addEventListener('orientationchange', function () { applyFit(); });
applyFit();
setTimeout(applyFit, 80);      /* 首屏字体/滚动条量准之前多补两次 */
setTimeout(applyFit, 500);

/* ===================== ⑤ 仓库归类互动 =====================
   卡片清单取 flatList，正确答案取 WAREHOUSES —— 和流程演示共用同一份数据，
   以后物料清单改了，这里会自动跟着变，不会两边各说各话。
   拖拽用 pointer 事件（触屏也能用）；键盘：← → 选卡片，1 / 2 / 3 放进对应仓库。
   注意跨机适配：getBoundingClientRect 返回的是缩放后的视觉值，
   而 style.left / style.top 用版面值，所以右边这几个位置都要 / ZF()。 */
(function warehouseQuiz() {
  const poolEl = document.getElementById('whqPool');
  const dockEl = document.getElementById('whqDocks');
  if (!poolEl || !dockEl) return;

  const HOME = {};                       /* 编码 → 该进哪个仓 */
  WAREHOUSES.forEach(function (w) { w.items.forEach(function (c) { HOME[c] = w.id; }); });

  const DOCKS = [
    { id: 'raw',  code: '01', name: '原辅料仓' },
    { id: 'semi', code: '02', name: '半成品仓' },
    { id: 'fin',  code: '03', name: '成品仓'   }
  ];
  const TYPE_HINT = { M: '本厂加工出来的', B: '向供应商买回来的', S: '发料给委外商做回来的' };
  /* 这里原来还有一行常驻操作提示（拖拽 + ←→ 选卡 + 123 入仓）。
     课堂投影时上方多一行字会分散注意力，而键盘操作在各仓卡片上本来就有引导，所以整行去掉了：
     #whqTip 一开始是空的（.whq-tip:empty 直接不显示），只在放对 / 放错 / 结束时才出现一行判定反馈。 */

  let sel = null;
  let done = 0, wrong = 0;
  const miss = {};                       /* 同一张卡放过几次错 */
  const placed = {};

  /* ---------- 计时与评分 ----------
     计时从「第一次动手」开始，不是页面一打开就开始 —— 否则课前讲解的时间也算了进去。
     综合分 = 准确分 50 + 速度分 50 − 失误扣分：
       · 准确分：放对一张得 50/14
       · 速度分：FAST 秒以内满分，SLOW 秒封顶降到 SPD_MIN，中间线性
       · 失误扣分：每次放错 −2，最多扣 20 */
  const TOTAL = flatList.length;
  const FAST = 40, SLOW = 150, SPD_MAX = 50, SPD_MIN = 10, PEN_EACH = 2, PEN_CAP = 20;
  let t0 = null, clockTimer = null;
  function elapsed() { return t0 === null ? 0 : (Date.now() - t0) / 1000; }
  function fmtT(s) {
    return s < 60 ? s.toFixed(1) + ' 秒'
                  : Math.floor(s / 60) + ' 分 ' + String(Math.round(s % 60)).padStart(2, '0') + ' 秒';
  }
  function tick() {
    const s = elapsed();
    const el = document.getElementById('whqClock');
    if (el) el.textContent = t0 === null ? '—' : fmtT(s);
    const w = document.getElementById('whqClockWrap');
    if (w) w.classList.toggle('on', t0 !== null);
  }
  function clockStart() {
    if (t0 !== null) return;
    t0 = Date.now();
    clockTimer = setInterval(tick, 200);
    tick();
  }
  function clockStop() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }
  function clockReset() { clockStop(); t0 = null; tick(); }
  function speedScore(s) {
    if (s <= FAST) return SPD_MAX;
    if (s >= SLOW) return SPD_MIN;
    return SPD_MAX - (SPD_MAX - SPD_MIN) * (s - FAST) / (SLOW - FAST);
  }
  function starOf(total) {
    return total >= 90 ? 5 : total >= 80 ? 4 : total >= 70 ? 3 : total >= 60 ? 2 : 1;
  }

  /* ---------- 三个仓库：只留名字（大字），代号降级成左上角小角标 ---------- */
  dockEl.innerHTML = DOCKS.map(function (d) {
    return '<div class="whq-dock ' + d.id + '" data-wh="' + d.id + '">' +
             '<div class="whq-dh"><i>' + d.code + '</i><b>' + d.name + '</b></div>' +
             '<div class="whq-list" id="whqList-' + d.id + '"><span class="whq-empty">把卡片拖到这里</span></div>' +
           '</div>';
  }).join('');

  /* 判定反馈：元素只在放对 / 放错 / 结束时有内容，空的时候 CSS 不占位 */
  const tipEl = document.getElementById('whqTip');
  function tip(html, cls) { if (!tipEl) return; tipEl.className = 'whq-tip' + (cls ? ' ' + cls : ''); tipEl.innerHTML = html; }
  function sync() {
    document.getElementById('whqScore').textContent = done;
    document.getElementById('whqDone').textContent = done;
    document.getElementById('whqWrong').textContent = wrong;
    tick();
  }
  function whName(id) { return DOCKS.filter(function (d) { return d.id === id; })[0].name; }

  /* ---------- 发牌 ----------
     待分类卡只印物料名称（不再印物料代码 / 单位），名称居中放大，课堂上后排也看得清 */
  function cardHTML(code) {
    const n = nodes[code], t = n.type;
    return '<div class="whq-card ' + t.toLowerCase() + '" data-code="' + code + '" title="' + n.name + '">' +
             '<div class="whq-n">' + n.name + '</div>' +
           '</div>';
  }
  function deal() {
    done = 0; wrong = 0;
    clockReset();
    Object.keys(miss).forEach(function (k) { delete miss[k]; });
    Object.keys(placed).forEach(function (k) { delete placed[k]; });
    const codes = flatList.map(function (n) { return n.code; });
    for (let i = codes.length - 1; i > 0; i--) {         /* 洗牌：免得按 BOM 顺序一眼看穿 */
      const j = Math.floor(Math.random() * (i + 1));
      const t = codes[i]; codes[i] = codes[j]; codes[j] = t;
    }
    poolEl.innerHTML = codes.map(cardHTML).join('');
    DOCKS.forEach(function (d) {
      document.getElementById('whqList-' + d.id).innerHTML = '<span class="whq-empty">把卡片拖到这里</span>';
    });
    document.getElementById('whqRes').classList.remove('show');
    sel = codes[0];
    paint(); sync();
  }

  /* ---------- 键盘高亮 ---------- */
  function cards() { return Array.prototype.slice.call(poolEl.querySelectorAll('.whq-card')); }
  function paint() {
    cards().forEach(function (c) { c.classList.toggle('sel', c.dataset.code === sel); });
  }
  function move(dir) {
    const codes = cards().map(function (c) { return c.dataset.code; });
    if (!codes.length) return;
    let i = codes.indexOf(sel);
    i = i < 0 ? 0 : (i + dir + codes.length) % codes.length;
    sel = codes[i];
    paint();
  }

  /* ---------- 判定 ---------- */
  function put(code, whId) {
    if (!code || placed[code] || !HOME[code]) return;
    const dock = dockEl.querySelector('.whq-dock[data-wh="' + whId + '"]');
    const name = nodes[code].name;
    if (HOME[code] === whId) {
      SFX.ok();
      placed[code] = 1; done++;
      const card = poolEl.querySelector('.whq-card[data-code="' + code + '"]');
      if (card) card.remove();
      const list = document.getElementById('whqList-' + whId);
      const empty = list.querySelector('.whq-empty');
      if (empty) empty.remove();
      const chip = document.createElement('span');
      chip.className = 'whq-chip';
      chip.textContent = name;
      list.appendChild(chip);
      dock.classList.add('good');
      setTimeout(function () { dock.classList.remove('good'); }, 480);
      tip('✓ <b>' + name + '</b> 放对了 —— 进 ' + whName(whId), 'ok');
      const rest = cards();
      sel = rest.length ? rest[0].dataset.code : null;
      if (!rest.length) poolEl.innerHTML = '<span class="whq-none">（全部归类完毕）</span>';
      paint(); sync();
      if (done >= flatList.length) finish();
    } else {
      SFX.no();
      wrong++; miss[code] = (miss[code] || 0) + 1;
      dock.classList.add('bad');
      setTimeout(function () { dock.classList.remove('bad'); }, 420);
      if (miss[code] >= 3) {
        const extra = (code === '11000' || code === '14000')
          ? '（它是采购件，但属于<b>总装用组件</b>，验收后跟钟盘、钟框放同一个仓）' : '';
        tip('✗ <b>' + name + '</b> 不放这里。提示：它该进 <b>' + whName(HOME[code]) + '</b>' + extra, 'no');
      } else {
        tip('✗ <b>' + name + '</b> 不放这里 —— 再想想：它是<b>' + TYPE_HINT[nodes[code].type] +
            '</b>，最后是用在哪一步的？', 'no');
      }
      sync();
    }
  }

  function finish() {
    clockStop();
    const sec = elapsed();
    const acc = SPD_MAX * done / TOTAL;                 /* 准确分，满分 50 */
    const spd = speedScore(sec);                        /* 速度分，满分 50 */
    const pen = Math.min(PEN_CAP, wrong * PEN_EACH);
    const total = Math.max(0, Math.round(acc + spd - pen));
    const st = starOf(total);
    const verdict = sec <= FAST && wrong === 0
      ? '又快又准，仓库归属掌握得很牢。'
      : total >= 90 ? '几乎满分了，就差那么一点小失误。'
      : total >= 80 ? '整体不错，再快一点就是满分节奏。'
      : total >= 65 ? '判断基本对了，把速度提上来分数会明显好看。'
      : '先把归属判断练熟，速度自然跟着上来。';
    document.getElementById('whqRes').innerHTML =
      '<div class="whq-line"><b>' + done + ' / ' + TOTAL + ' 全部归类完成</b>　' +
        '<span class="whq-stars">' + '★'.repeat(st) + '☆'.repeat(5 - st) + '</span>　' +
        '综合 <span class="whq-total">' + total + '</span> 分</div>' +
      '<div class="whq-brk">' +
        '<span>用时 <b>' + fmtT(sec) + '</b></span>' +
        '<span>放错 <b>' + wrong + '</b> 次</span>' +
        '<span>准确分 <b>' + acc.toFixed(0) + '</b> / 50</span>' +
        '<span>速度分 <b>' + spd.toFixed(0) + '</b> / 50（' + FAST + ' 秒以内满分）</span>' +
        '<span>失误扣分 <b>' + (wrong ? '−' + (wrong * PEN_EACH) : '0') + '</b>' + (wrong * PEN_EACH > PEN_CAP ? '（封顶 −' + PEN_CAP + '）' : '') + '</span>' +
      '</div>' +
      '<div class="whq-verdict">' + verdict + '</div>' +
      '<div><b>两个容易错的地方</b>：<b>机芯 11000</b> 和 <b>电池 14000</b> 是<b>采购件</b>，' +
      '但它们是总装用组件，不进原辅料仓，而是跟钟盘、钟框一起放 <b>02 半成品仓</b>。</div>';
    document.getElementById('whqRes').classList.add('show');
    tip('全部归类完成 ✓　用时 ' + fmtT(sec) + '　综合 ' + total + ' 分', 'ok');
  }

  /* ---------- 鼠标 / 触屏拖拽 ---------- */
  function zf() { return window.__FITZ__ || 1; }
  let drag = null;
  poolEl.addEventListener('pointerdown', function (e) {
    const card = e.target && e.target.closest ? e.target.closest('.whq-card') : null;
    if (!card || !card.dataset.code) return;
    e.preventDefault();
    clockStart();
    sel = card.dataset.code; paint();
    const r = card.getBoundingClientRect(), z = zf();
    const ghost = card.cloneNode(true);
    ghost.classList.add('whq-ghost');
    ghost.style.width = (r.width / z) + 'px';
    ghost.style.left = (r.left / z) + 'px';
    ghost.style.top = (r.top / z) + 'px';
    document.body.appendChild(ghost);
    drag = { code: card.dataset.code, el: card, ghost: ghost, moved: false,
             dx: (e.clientX - r.left) / z, dy: (e.clientY - r.top) / z };
    card.classList.add('dragging');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
  function dockUnder(x, y) {
    let hit = null;
    dockEl.querySelectorAll('.whq-dock').forEach(function (d) {
      const r = d.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = d;
    });
    return hit;
  }
  function onMove(e) {
    if (!drag) return;
    drag.moved = true;
    const z = zf();
    drag.ghost.style.left = (e.clientX / z - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY / z - drag.dy) + 'px';
    const d = dockUnder(e.clientX, e.clientY);
    dockEl.querySelectorAll('.whq-dock').forEach(function (x) { x.classList.toggle('over', x === d); });
  }
  function onUp(e) {
    if (!drag) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    const code = drag.code, moved = drag.moved;
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if (drag.el) drag.el.classList.remove('dragging');
    drag = null;
    dockEl.querySelectorAll('.whq-dock').forEach(function (x) { x.classList.remove('over'); });
    if (!moved) return;                                   /* 只是点了一下：当选中，不判定 */
    const d = dockUnder(e.clientX, e.clientY);
    if (d) put(code, d.getAttribute('data-wh'));
  }

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('whView').classList.contains('active')) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    const map = { '1': 'raw', '2': 'semi', '3': 'fin' };
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); clockStart(); move(-1); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); clockStart(); move(1); return; }
    if (map[e.key] && sel) { e.preventDefault(); clockStart(); put(sel, map[e.key]); }
  });

  document.getElementById('whqReset').addEventListener('click', deal);
  deal();
})();

/* 进来先落在「① BOM 搭建」（讲课顺序的第一站）。

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootGames);
else bootGames();
</script>

  }
  .panel h3 .rt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
  .panel h3 i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--m-color); background: var(--m-bg); border-radius: 4px; padding: 1px 6px; }

  .whline { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; padding: 2px 0; color: #94a3b8; }
  .whline.has { color: var(--ink); }
  .whline .nm { flex: 1; }
  .whline .q { font-variant-numeric: tabular-nums; font-weight: 700; }
  .whgrp { margin-bottom: 8px; }
  .whgrp:last-child { margin-bottom: 0; }
  .whgrp .hd { font-size: 12.5px; font-weight: 800; color: #475569; margin-bottom: 2px; }

  table.lead { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.lead th {
    text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700;
    padding: 4px 6px; border-bottom: 1px solid var(--line); background: #f8fafc;
  }
  table.lead td { padding: 4px 6px; border-bottom: 1px solid #f1f5f9; }
  table.lead tr:last-child td { border-bottom: none; }
  table.lead .t { font-weight: 800; font-size: 11px; border-radius: 4px; padding: 0 5px; }
  table.lead .t.M { color: var(--m-color); background: var(--m-bg); }
  table.lead .t.B { color: var(--b-color); background: var(--b-bg); }
  table.lead .t.S { color: var(--s-color); background: var(--s-bg); }
  table.lead .cal { font-size: 11px; color: var(--muted); }
  table.lead .cal.wd { color: var(--m-color); font-weight: 700; }

  .bom { font-size: 12.5px; line-height: 1.9; font-family: Consolas, "Courier New", monospace; color: #334155; }
  .bom b { color: var(--ink); }

  .log { font-size: 12.5px; max-height: 232px; overflow-y: auto; }
  .keys { font-size: 13px; line-height: 1.95; color: #475569; }
  .keys kbd {
    display: inline-block; font-family: inherit; font-size: 11.5px; font-weight: 700;
    background: #f1f5f9; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 0 5px; color: var(--ink); margin: 0 1px;
  }
  .keys .muted { color: var(--muted); margin-top: 5px; line-height: 1.7; }
  .muted.small { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
  .log .l { padding: 3px 0; border-bottom: 1px dashed #eef2f7; display: flex; gap: 7px; }
  .log .l:last-child { border-bottom: none; }
  .log .d { flex: none; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .log .ok { color: var(--good); }
  .log .no { color: var(--bad); }
  .log .in { color: var(--b-color); }

  .run { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eef2f7; }
  .run:last-child { border-bottom: none; }
  .run .nm { flex: 1; }
  .run .bar { flex: none; width: 74px; height: 7px; background: #eef2f7; border-radius: 4px; overflow: hidden; }
  .run .bar i { display: block; height: 100%; background: var(--m-color); }
  .run .dd { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: #94a3b8; font-size: 13px; }

  /* ---------- 作业面板 ---------- */
  .sheet {
    position: absolute; background: rgba(255,255,255,.98); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 14px 40px rgba(15,23,42,.28); padding: 14px 16px;
    width: 430px; max-height: 560px; overflow-y: auto; display: none; z-index: 20;
  }
  .sheet.show { display: block; }
  .sheet .hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .sheet .hd .t { font-size: 18px; font-weight: 800; }
  .sheet .hd .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 19px; line-height: 1; border: none; background: none; padding: 0 4px; }
  .sheet .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .op {
    display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
    border: 2px solid var(--line); border-radius: 10px; background: #fff;
    padding: 8px 12px; margin-bottom: 7px; transition: .12s ease; color: var(--ink);
  }
  .op .r1 { display: flex; align-items: baseline; gap: 8px; }
  .op .r1 .n { font-size: 14.5px; font-weight: 800; }
  .op .r1 .tag { margin-left: auto; font-size: 11px; font-weight: 800; border-radius: 4px; padding: 1px 6px; }
  .op .r2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .op:hover:not(:disabled) { border-color: var(--m-color); transform: translateX(2px); }
  .op:disabled { cursor: not-allowed; background: #f8fafc; opacity: .78; }
  .op.locked { border-style: dashed; }
  .op.ok { border-color: #86efac; background: var(--s-bg); }
  .op.jit { border-color: var(--m-color); background: var(--m-bg); }
  .op.late { border-color: #fecaca; background: #fef2f2; }
  /* 键盘选中态：鼠标 hover 与方向键共用同一套高亮，投影时一眼能看出选了哪条 */
  .op.sel:not(:disabled) {
    border-color: #0f172a;
    box-shadow: 0 0 0 3px rgba(37,99,235,.38), 0 3px 12px rgba(15,23,42,.16);
    transform: translateX(3px);
  }
  .op.sel:not(:disabled) .r1 .n { text-decoration: underline; text-underline-offset: 3px; }
  .sheet .sh-key {
    font-size: 12.5px; color: var(--ink); background: #f8fafc; border: 1px dashed var(--line);
    border-radius: 8px; padding: 6px 9px; margin-top: 3px; text-align: center;
  }
  .sheet .sh-key b { color: var(--m-color); }
  .op .tag.on { background: #dcfce7; color: var(--good); }
  .op .tag.off { background: #fee2e2; color: var(--bad); }
  .op .tag.jit { background: #dbeafe; color: var(--m-color); }

  /* ---------- 结算 ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none;
    align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal.show { display: flex; }
  .modal .box {
    background: #fff; border-radius: 16px; padding: 24px 26px; max-width: 880px;
    width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .modal h2 { margin: 0 0 4px; font-size: 24px; }
  .modal .big { font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .modal .big b { font-size: 44px; font-weight: 800; color: var(--ink); }
  .modal .msg { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .modal .msg.good { color: var(--good); }
  .modal .msg.bad { color: var(--bad); }
  .modal table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
  .modal th { text-align: left; font-size: 11.5px; color: var(--muted); padding: 5px 7px; border-bottom: 1px solid var(--line); background: #f8fafc; }
  .modal td { padding: 5px 7px; border-bottom: 1px solid #f1f5f9; }
  .modal tr.crit td { background: #fff7ed; font-weight: 700; }
  .modal .sec { font-size: 14px; font-weight: 800; color: #334155; margin: 16px 0 6px; }
  .modal table.ded { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
  .modal table.ded td { padding: 5px 7px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  .modal table.ded td.k { font-weight: 800; white-space: nowrap; }
  .modal table.ded td.p { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
  .modal table.ded td.p.zero { color: #94a3b8; }
  .modal table.ded td.p.bad { color: var(--bad); }
  .modal table.ded tr.total td { border-top: 2px solid var(--line); border-bottom: none; font-size: 14px; }
  .sum {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
  }
  .sum .c {
    background: #f8fafc; border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 12px; font-size: 12.5px; color: var(--muted);
  }
  .sum .c b { display: block; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum .c.good b { color: var(--good); }
  .sum .c.warn b { color: var(--warn); }
  .sum .c.bad b { color: var(--bad); }
  #mPath, #mCal { font-size: 13.5px; line-height: 1.95; }
  #mPath .lk { display: inline-block; margin: 0 2px; }
  #mPath .arrow { color: #94a3b8; margin: 0 3px; }
  #mPath .brk { color: var(--bad); font-weight: 800; }
  #mCal .wk { display: inline-block; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12.5px; }

  /* 结算页 ⑤ 代价分析 */
  #mHarm .hh { font-size: 13.5px; margin: 6px 0 4px; }
  #mHarm table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
  #mHarm table td { padding: 5px 7px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  #mHarm table td.k { font-weight: 800; white-space: nowrap; }
  #mHarm table td.p { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
  #mHarm table tr.er td.p { color: var(--warn); }
  #mHarm table tr.lt td.p { color: var(--bad); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .two > div { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .two > div > b { font-size: 13.5px; }
  .two ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.75; color: #475569; }
  .two ul li { margin-bottom: 3px; }
  .two ul b { color: var(--ink); }
  .btn.result { background: #15803d; border-color: #15803d; }
  .btn.result:hover { background: #166534; }
  .btn.playing { background: #b45309; border-color: #b45309; color: #fff; }
  .btn.paused { background: #0f766e; border-color: #0f766e; color: #fff; }

  /* 自动演示字幕条：只留一行，尽量不挡画面 */
  .autobar {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px;
    max-width: 96%; background: rgba(15,23,42,.9); color: #fff;
    border-radius: 10px; padding: 7px 16px; z-index: 25;
    box-shadow: 0 8px 24px rgba(15,23,42,.36); border: 1px solid rgba(255,255,255,.14);
    display: none; align-items: center; gap: 10px; white-space: nowrap;
  }
  .autobar.show { display: flex; }
  .autobar .ab-tag { background: #f59e0b; color: #1f2937; font-weight: 800; border-radius: 5px; padding: 1px 8px; font-size: 12px; flex: none; }
  .autobar .ab-main { font-size: 16.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
  .autobar .ab-main em { font-style: normal; color: #fbbf24; }
  .autobar .ab-step { font-size: 12.5px; color: #94a3b8; flex: none; }

  /* 计划查询表 */
  .planchk { display: block; font-size: 13px; color: #475569; margin-bottom: 10px; cursor: pointer; }
  .planchk input { vertical-align: -2px; margin-right: 6px; }
  /* 头部固定、只有表体滚动，右上角关闭键永远可见 */
  .planbox { max-width: 1040px; padding: 0; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; }
  .planhead {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 16px 22px 13px; border-bottom: 1px solid var(--line); background: #fff;
  }
  .planhead h2 { margin: 0; font-size: 22px; }
  .planx {
    margin-left: auto; flex: none; width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: #f8fafc; color: #475569; cursor: pointer;
    font-family: inherit; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: .12s ease;
  }
  .planx:hover { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }
  .planbody { overflow-y: auto; padding: 0 22px 22px; }
  .planintro { font-size: 13.5px; color: #475569; margin: 14px 0 12px; line-height: 1.8; }
  /* 结算页同款：头部固定、正文滚动、右上角常驻关闭键 */
  .resbox { max-width: 920px; padding: 0; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; }
  .reshead h2 { font-size: 23px; }
  .scorechip {
    display: flex; align-items: baseline; gap: 6px; margin-left: 4px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff;
    border-radius: 9px; padding: 5px 14px; font-size: 13px;
  }
  .scorechip b { font-size: 24px; font-weight: 800; }
  .scorechip span { font-size: 13px; opacity: .85; }
  .resbox .msg { margin-top: 14px; }
  .planintro b { color: var(--ink); }
  #planTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  #planTable th { text-align: left; font-size: 11.5px; color: var(--muted); padding: 6px 7px; border-bottom: 1px solid var(--line); background: #f8fafc; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  #planTable td { padding: 5px 7px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  #planTable tr.now td { background: #eff6ff; }
  #planTable tr.done td { color: #64748b; }
  #planTable td.d { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #planTable td.wk { color: #b45309; }
  #planTable .st { font-size: 12px; white-space: nowrap; }
  #planTable .st.ok { color: var(--good); font-weight: 700; }
  #planTable .st.run { color: var(--m-color); font-weight: 700; }
  #planTable .st.er { color: var(--warn); font-weight: 700; }
  #planTable .st.lt { color: var(--bad); font-weight: 800; }

  .hint {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px;
    background: rgba(31,41,55,.9); color: #fff; border-radius: 10px; padding: 8px 16px;
    font-size: 14px; display: none; z-index: 15; max-width: 92%;
  }
  .hint.show { display: block; }
  .controls {
    position: absolute; left: 14px; bottom: 12px; background: rgba(255,255,255,.9);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 13px;
    font-size: 13.5px; color: #475569; pointer-events: none;
  }
  .controls b { color: var(--m-color); }

  /* ---------- 左上角「今日计划」浮牌 ----------
     倒排计划单是这场闯关的"课本答案"，放在左上角常驻，学生不用点开弹窗就能对照。
     位置固定在左上、避开顶部按钮条与右侧侧栏，不挡厂区里的建筑。 */
  .planpanel {
    position: absolute; left: 14px; top: 60px; width: 296px; z-index: 12;
    background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(15,23,42,.16); padding: 9px 12px 10px; pointer-events: none;
    max-height: 396px; overflow: hidden;
  }
  .planpanel .pp-h {
    display: flex; align-items: baseline; gap: 7px; font-size: 13px; color: var(--muted);
    padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px dashed var(--line);
  }
  .planpanel .pp-h b { font-size: 16px; color: var(--m-color); }
  .planpanel .pp-h em { font-style: normal; margin-left: auto; font-size: 12px; color: #94a3b8; }
  .planpanel .pp-item {
    display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; line-height: 1.5; color: #334155;
    padding: 3px 0; border-bottom: 1px solid #f1f5f9;
  }
  .planpanel .pp-item:last-child { border-bottom: none; }
  .planpanel .pp-item .pp-t { flex: none; font-weight: 800; font-size: 12px; border-radius: 5px; padding: 1px 6px; color: #fff; background: #64748b; }
  .planpanel .pp-item .pp-t.late { background: var(--bad); }
  .planpanel .pp-item .pp-t.today { background: var(--m-color); }
  .planpanel .pp-item .pp-t.done { background: var(--good); }
  .planpanel .pp-item .pp-n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .planpanel .pp-item .pp-s { flex: none; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .planpanel .pp-item.late .pp-n { color: var(--bad); font-weight: 700; }
  .planpanel .pp-more { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .planpanel .pp-empty { font-size: 12.5px; color: #64748b; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="map" width="1440" height="900"></canvas>
    <div class="topbar">
      <div class="chip date"><span class="k">日期</span><span class="v" id="hDate">—</span></div>
      <div class="chip due"><span class="k">距交期</span><span class="v" id="hDue">—</span></div>
      <div class="chip score"><span class="k">预计得分</span><span class="v" id="hScore">100</span></div>
      <div class="spacer"></div>
      <button class="btn" id="bNextDay">推进一天 ▶</button>
      <button class="btn ghost" id="bAuto">▶ 自动演示</button>
      <button class="btn ghost" id="bPlan">📋 计划查询</button>
      <button class="btn ghost" id="bReset">↻ 重来</button>
    </div>
    <!-- 左上角常驻：今日计划（倒排计划单里今天该动的作业） -->
    <div class="planpanel" id="planPanel"></div>
    <!-- 自动演示字幕条（只一行） -->
    <div class="autobar" id="autoBar">
      <span class="ab-tag">自动演示</span>
      <span class="ab-main" id="abMain">—</span>
      <span class="ab-step" id="abStep">0 / 17</span>
    </div>
    <div class="sheet" id="sheet">
      <div class="hd"><span class="t" id="shTitle">—</span><button class="x" id="shClose">×</button></div>
      <div class="sub" id="shSub">—</div>
      <div id="shOps"></div>
      <div class="sh-key" id="shKey"><b>↑</b> <b>↓</b> 选择作业　·　<b>Enter</b> / <b>Z</b> 执行选中的作业　·　<b>X</b> / <b>Shift</b> 关闭面板</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="controls">方向键 / WASD 移动　｜　走到建筑旁 <b>Enter / Z</b> 进入　·　<b>X / Shift</b> 退出　｜　<b>面板内 ↑ ↓ 选作业、Enter / Z 执行</b>　｜　<b>空格</b> 推进一天　｜　<b>P</b> 计划查询　｜　也可直接点建筑</div>
  </div>

  <div class="side">
    <div class="panel">
      <h3>操作说明</h3>
      <div class="keys">
        <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动负责人</div>
        <div>走到建筑旁 <kbd>Enter</kbd> / <kbd>Z</kbd> 进入　·　<kbd>X</kbd> / <kbd>Shift</kbd> 退出</div>
        <div><kbd>空格</kbd> 推进一天　·　<kbd>P</kbd> 计划查询</div>
        <div>作业面板里：<kbd>↑</kbd><kbd>↓</kbd> 选作业　·　<kbd>Enter</kbd> / <kbd>Z</kbd> 执行（前置未齐 / 已完成 / 进行中的会自动跳过）</div>
        <div>也可以直接<b>点建筑</b>让负责人走过去</div>
        <div class="muted">目标：<b>09-26</b> 前交出 400 台挂钟，且尽量别提前开工（早做＝占库存占资金）。</div>
      </div>
      <h3 style="margin-top:13px">BOM 结构</h3>
      <div class="bom" id="bomBox"></div>
    </div>

    <div class="panel">
      <h3>提前期速查 <span class="rt" id="calNote"></span></h3>
      <table class="lead" id="leadTable"></table>
      <div class="muted small"><b style="color:var(--m-color)">工作日</b>＝跳过周六日（自制件）；<b style="color:var(--b-color)">自然日</b>＝周末照算（采购 / 委外）。</div>
    </div>

    <div class="panel">
      <h3>在制 / 在途 <span class="rt" id="runCount">0</span></h3>
      <div id="runBox"><span class="empty">当前没有进行中的作业</span></div>
      <h3 style="margin-top:13px">库存</h3>
      <div id="invBox"></div>
    </div>

    <div class="panel">
      <h3>作业日志 <span class="rt" id="logCount">0</span></h3>
      <div class="log" id="logBox"><span class="empty">还没有作业</span></div>
    </div>
  </div>
</div>

<div class="modal" id="planModal">
  <div class="box planbox">
    <div class="planhead">
      <h2>📋 计划查询 —— 提前期倒排结果</h2>
      <button class="planx" id="planClose" title="关闭（Esc / X）">×</button>
    </div>
    <div class="planbody">
      <div class="planintro">

/* ==========================================================================

   领料 / 加工 / 送委外 / 装配 / 总装 / 发货，目标 2019-09-26 交货。
   本游戏刻意不模拟开单据 —— 它教的是**提前期倒排与两套日历**这件事本身。
   ========================================================================== */

/* ===== 1. 数据 ===== */
const BASE = new Date(2019, 8, 14);          // 开局日 2019-09-14（周六，正是铝材最晚下单日）
const DUE  = new Date(2019, 8, 26);          // 交期 2019-09-26（周四）
const DAY0 = 0;                              // 游戏第 0 天 = 09-12
const DUE_IDX = Math.round((DUE - BASE) / 86400000);   // 14

const MAT = {
  '10000': { name: '电子挂钟', type: 'M', unit: '个', lead: 3, cal: '工作日' },

  '12310': { name: '铝材',     type: 'B', unit: 'g',  lead: 4, cal: '自然日' },
  '12400': { name: '盘面',     type: 'M', unit: '个', lead: 1, cal: '工作日' },

  '13000': { name: '钟框',     type: 'S', unit: '个', lead: 2, cal: '自然日' },
  '14000': { name: '电池',     type: 'B', unit: '节', lead: 1, cal: '自然日' }

const WH = {

const WH_ITEMS = {

/* 厂区建筑：gx/gy 是等距网格上的左上角，w/d 是占地格数，h 是墙高（像素）

   2026 版布局：
     · 三个仓库（01 / 02 / 03）排在等距网格的**同一行**（gy 都是 9、gx 依次 +7）——
       等距投影里这就是"排成一排"：屏幕上是一条向右上方的斜线（y 逐级下降），
       比强行对齐成屏幕水平线自然得多。间距取 7 格，屋顶上伸出的烟囱也不会蹭到隔壁。
     · 原来分散的零件加工 / 装配 / 总装三个车间合并成一栋「生产车间」（site 仍是 shop1，
