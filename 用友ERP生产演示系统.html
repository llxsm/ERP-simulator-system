/* ============ 3. 渲染 BOM 结构树（SVG 连线 + HTML 节点） ============ */
const SPX = 130, SPY = 148, NW = 120, NH = 76, PAD = 28;
const wrap = document.getElementById('treeWrap');
const svg = document.getElementById('treeSvg');

const totalW = PAD * 2 + (leafCounter - 1) * SPX + NW;
const totalH = PAD * 2 + maxDepth * SPY + NH;
wrap.style.width = totalW + 'px';
wrap.style.height = totalH + 'px';
svg.setAttribute('width', totalW);
svg.setAttribute('height', totalH);
svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

function pxOf(n) { return PAD + n.x * SPX; }
function pyOf(n) { return PAD + n.depth * SPY; }

const NS = 'http://www.w3.org/2000/svg';
const edgeMap = {};   // "childCode->parentCode" -> path element

// 箭头标记
const defs = document.createElementNS(NS, 'defs');
defs.innerHTML =
  '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
  '<path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker>';
svg.appendChild(defs);

// 连线：子件顶部 -> 父件底部（物料向上流）
function addEdge(child, parent) {
  const cx = pxOf(child) + NW / 2;
  const cyTop = pyOf(child);
  const px = pxOf(parent) + NW / 2;
  const pyBot = pyOf(parent) + NH;
  const midY = (cyTop + pyBot) / 2;

  const d = `M ${cx} ${cyTop} V ${midY} H ${px} V ${pyBot}`;
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#9aa3b2');
  path.setAttribute('stroke-width', '1.8');
  path.setAttribute('marker-end', 'url(#arrow)');
  svg.appendChild(path);
  edgeMap[child.code + '->' + parent.code] = path;
}

// 递归连线
function drawEdges(node) {
  (node.children || []).forEach(c => {
    addEdge(c, node);
    drawEdges(c);
  });
}
drawEdges(BOM);

/* 单位用量文本：计数类（个/根/节）写 ×N，计量类写「N 单位」；
   共用件标「合计」，因为 ERP 源数据给的已是合并量 */
function qtyLabel(q, unit, isShared) {
  const v = Math.round(q * 100) / 100;
  const s = (unit === '个' || unit === '根' || unit === '节' || unit === '台') ? '×' + v : v + ' ' + unit;
  return isShared ? '合计 ' + s : s;
}

// 节点 DOM：按 BOM 出现次数渲染 —— 共用件（铝材 12310、塑料 12411）会各画两个，与物料图一致
(function renderTreeNodes(n) {
  const el = document.createElement('div');
  el.className = 'tnode ' + (n.type === 'M' ? 'm' : n.type === 'B' ? 'b' : 's');
  el.style.left = pxOf(n) + 'px';
  el.style.top = pyOf(n) + 'px';
  el.dataset.code = n.code;
  const qtyText = qtyLabel(n.qty, n.unit, n.shared);
  el.innerHTML =
    `<span class="ttype">${n.type}</span>` +
    `<span class="tname">${n.label || n.name}</span>` +
    `<span class="tcode">${n.code}</span>` +
    `<span class="tqty">${qtyText}</span>`;
  wrap.appendChild(el);
  (n.children || []).forEach(renderTreeNodes);
})(BOM);

/* ============ 4. 高亮「来源 → 去向」路径 ============ */
/* 共用件有两个父件（铝材 12310 同属长针/短针，塑料 12411 同属盘体/钟框），
   所以祖先链要按父件表向上走，不能再依赖单一的 node.parent */
function ancestorsOf(code) {
  const set = new Set();
  (function up(c) {
    (parentsOf[c] || []).forEach(p => { if (!set.has(p)) { set.add(p); up(p); } });
  })(code);
  return set;
}
function descendantsOf(code) {
  const set = new Set();
  (function walk(n) {
    (n.children || []).forEach(k => { set.add(k.code); walk(nodes[k.code]); });
  })(nodes[code]);
  return set;
}

function clearHighlight() {
  document.querySelectorAll('.tnode').forEach(e => e.classList.remove('dim', 'hl'));
  Object.values(edgeMap).forEach(p => p.classList.remove('dim', 'hl'));
  const d = document.getElementById('detail');
  d.style.display = 'none';
}

function highlight(code) {
  const up = ancestorsOf(code);
  const down = descendantsOf(code);
  const active = new Set([code, ...up, ...down]);

  document.querySelectorAll('.tnode').forEach(e => {
    const on = active.has(e.dataset.code);
    e.classList.toggle('dim', !on);
    e.classList.toggle('hl', e.dataset.code === code);
  });
  Object.entries(edgeMap).forEach(([key, p]) => {
    const [c, par] = key.split('->');
    const on = active.has(c) && active.has(par);
    p.classList.toggle('dim', !on);
    p.classList.toggle('hl', on);
  });

  // 详情面板
  const n = nodes[code];
  const info = flatList.filter(x => x.code === code)[0] || n;
  const d = document.getElementById('detail');
  const typeCls = n.type === 'M' ? 'd-m' : n.type === 'B' ? 'd-b' : 'd-s';
  const typeName = n.type === 'M' ? '自制件（本厂加工/装配）' : n.type === 'B' ? '采购件（向供应商采购）' : '委外件（本厂发料给委外商加工后收回）';
  const isCommon = (parentsOf[code] || []).length > 1;
  const qtyText = qtyLabel(info.qty, n.unit, isCommon);
  const shared = isCommon ? '（共用件，被 ' + parentsOf[code].length + ' 个父件使用，此处为合计用量）' : '';
  const parents = up.size ? [...up].map(c => nodes[c].name + '(' + c + ')').join('、') : '无（已是成品）';
  const kids = (n.children || []).length
    ? n.children.map(c => c.name + '(' + c.code + ')').join('、') : '无（原材料）';
  d.style.display = 'block';
  d.innerHTML =
    `<span class="d-title ${typeCls}">${n.name}（${n.code}）</span>` +
    ` <span class="tag ${n.type === 'M' ? 'm' : n.type === 'B' ? 'b' : 's'}">${n.type}</span> ${typeName}` +
    `<br>层级：第 ${n.depth} 层 &nbsp;|&nbsp; 单位用量：${qtyText}${shared}` +
    `<br>提前期：${n.lead} 天（${n.cal}）` +
    `<br>去向（组成）：${parents}` +
    `<br>来源（所需物料）：${kids}`;
}

// 绑定事件
document.querySelectorAll('.tnode').forEach(el => {
  el.addEventListener('mouseenter', () => highlight(el.dataset.code));
  el.addEventListener('mouseleave', clearHighlight);
  el.addEventListener('click', () => highlight(el.dataset.code));
});

// 按 BOM 多层展开毛需求(现有库存为 0,净需求 = 毛需求)
/* 按 BOM 出现对象递归（不能用 nodes[code]）：共用件在不同父件下用量不同，
   塑料 12411 在盘体下 0.5 kg、在钟框下 0.5 kg，必须各算各的；
   铝材 12310 是「合计 20 g/台」，标了 shared 只计一次 */
function explodeReq(code, mult) {
  const req = {};
  (function walk(node, m) {
    const need = m * node.qty;
    if (node.shared) {
      if (req[node.code] === undefined) req[node.code] = need;   // 合计用量只计一次
    } else {
      req[node.code] = (req[node.code] || 0) + need;
    }
    (node.children || []).forEach(k => walk(k, m * node.qty));
  })(nodes[code], mult);
  return req;
}

  if (n.unit === 'g' && v >= 1000) return (v / 1000) + ' kg';   // 8000 g → 8 kg，与 ERP 的千克口径一致
  return v + ' ' + n.unit;
}

const BOARD_W = 1000, BOARD_H = 520, gx = BOARD_W / 9, gy = BOARD_H / 10;
const bx = v => v * gx;
const by = v => v * gy;

let tokenLayer = null, pathLayer = null, busy = false, flying = false;
/* 演示代号：取消 / 跳转 / 重播时 +1，让还在跑的那一遍动画自己作废，
   否则被打断的旧动画跑完时会把本步的库存变动再加一遍。 */

let ANIM_SCALE = 1;   // 动画时长比例（自动化测试可调小）

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

/* 字号基准：随看板实际宽度线性放大。
   基准刻意保守（16px/1000px）——字太大反而会挤掉流向连线、互相遮挡。 */
const BS_BASE = 16;            // 流程图字号基准：画幅宽/1000 × 16
const MVS_BASE = 15;          // 物料看板（竖排详细版）字号基准
const MVS_BASE_ROW = 16.5;    // 物料看板（同屏横排版）字号基准：卡片更宽裕，再放大 10%
const DUO_MIN_W = 800;        // 同屏画幅的常用下限（够高时至少给这么大）
const DUO_FLOOR = 560;        // 同屏画幅的硬下限：屏幕矮的时候允许收到这里，再小就真看不清了
const DUO_MAX_W = 1500;       // 同屏画幅上限（4K 投影也不至于铺得过满）
const MV_LAYOUTS_FALLBACK = { w: 1000, h: 440, nodes: [], arcs: [], icon: 38, chips: 5, prefix: true, plus: true, tok: 1.75 };
/* aspect-ratio 需要 Chrome 88+；老内核（部分国产浏览器 / 旧 Chrome）不支持时
   高度会算成 0，两块看板会整个消失，所以这里用 JS 显式补高度。 */
function hasAspectRatio() {
  return !!(window.CSS && CSS.supports && CSS.supports('aspect-ratio', '1 / 1'));
}
function refreshBoardScale() {
  const cardEl = document.querySelector('.flow-demo');
  const board = document.getElementById('flowBoard');
  const mv = document.getElementById('mvBoard');
  const duoMode = document.body.classList.contains('focus-mode');
  const L = mvCurLayout();
  const ratio = BOARD_H / BOARD_W + L.h / L.w;   // 两块看板总高 ÷ 画幅宽
  if (!hasAspectRatio()) {
    if (board) board.style.height = (board.clientWidth * BOARD_H / BOARD_W) + 'px';
    if (mv) mv.style.height = (mv.clientWidth * L.h / L.w) + 'px';
  }
  if (cardEl && duoMode) {
    /* 同屏：按「两块看板总高 + 控件实测高度」反推画幅宽。
       chrome 是卡片里除两块看板以外的所有占用（内边距 + 控制条 + 外边距），
       直接实测而不是写死，控件换行时也能自动收敛。 */
    /* rect 是缩放后的视觉值，innerHeight/innerWidth 是没缩放的，offsetHeight 是版面值 ——
       混用前统一换算到版面坐标（ZF() = 跨机适配的缩放系数，没开适配时就是 1）。
       topGap 取「卡片当前在屏幕上的位置」就够了：同屏模式下它就在导航条下面。
       以前写成「文档偏移」（rect.top + scrollY），第一轮量到的是切换前的旧滚动位置，直接算出负数。 */
    const topGap = Math.max(0, cardEl.getBoundingClientRect().top / ZF());
    for (let pass = 0; pass < 4; pass++) {
      /* 进同屏后看板会从「竖排」换成「一行横排」，两块板的总高比例跟着变 ——
         每轮都重新取一次，否则第一轮拿旧比例算，画幅会明显偏小 */
      const Lc = mvCurLayout();
      const ratioNow = BOARD_H / BOARD_W + Lc.h / Lc.w;
      const chrome = cardEl.offsetHeight - (board ? board.offsetHeight : 0) - (mv ? mv.offsetHeight : 0);
      const availH = window.innerHeight / ZF() - topGap - chrome - 6;
      const availW = window.innerWidth / ZF() - 32;
      /* 先算「高度说了算」的尺寸，再夹上下限。
         下限不能死守 DUO_MIN_W：屏幕矮的时候（例如 1920×1080 的屏在 Windows 150% 缩放下，
         浏览器可用高只有 660 版面像素）硬撑 800 会让卡片比屏幕还高，
         「同屏演示」就变成上下都得滚动 —— 那就不叫同屏了。这时收到能放下的尺寸（下限 DUO_FLOOR）。 */
      const rawW = Math.floor(Math.min(availH / ratioNow, availW));
      const fit = Math.max(DUO_FLOOR, Math.min(DUO_MAX_W, rawW));
      const cur = parseFloat(cardEl.style.maxWidth || '0') || 0;
      if (Math.abs(cur - fit) < 2) break;
      cardEl.style.maxWidth = fit + 'px';
      void cardEl.offsetHeight;   // 强制回流，让下一轮量到真实高度
    }
  } else if (cardEl) {
    cardEl.style.maxWidth = '';   // 普通模式：占满页宽
  }
  const w = Math.max(360, (board && board.clientWidth) || BOARD_W);
  const bs = w / BOARD_W * BS_BASE;
  if (board) {
    board.classList.toggle('lbl-off', bs > 40);   // 字号过大时标签放不下，自动隐藏文字
    board.style.setProperty('--bs', bs.toFixed(2) + 'px');
  }
  /* 物料流动看板同比例缩放字号 */
  if (mv) {
    const mvs = Math.max(360, mv.clientWidth || L.w) / L.w * (mvIsRow() ? MVS_BASE_ROW : MVS_BASE);
    mv.style.setProperty('--mvs', mvs.toFixed(2) + 'px');
  }
}

function anchor(id, pin) {
  const c = CHK[id];
  switch (pin) {
    case 'T': return [c[0], c[1]];
    case 'B': return [c[0], c[1]];
    case 'L': return [c[0], c[1]];
    case 'R': return [c[0], c[1]];
    default: return c;
  }
}

function edgePoints(def) {
  if (!def.pts) return null;
  return def.pts.map(function (p) {
    if (typeof p === 'string') {
      const q = p.split(':');
      const pn = q[1].split(',');
      return [bx(parseFloat(pn[0])), by(parseFloat(pn[1]))];
    }
    return [bx(p[0]), by(p[1])];
  });
}

function pathD(pts) {
  return pts.map(function (p, i) { return (i ? 'L' : 'M') + ' ' + p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join(' ');
}

function markedLine(attr, cls, dash) {

    (function (nid) {

function setStage(idx) {
  const def = FLOW_STEPS[idx];
  const dept = def ? def.dept : '';
  const act = new Set();
  if (dept) {
    NODE_DEFS.forEach(function (nd) {
      if (dept.indexOf(nd.t) >= 0 || (nd.s && dept.indexOf(nd.s.split(' ')[0]) >= 0)) act.add(nd.id);
    });
  }
  if (idx === 0) NODE_DEFS.forEach(function (nd) { act.add(nd.id); });
  /* 步骤数会随课程需要调整（如采购流程合并），这里按比例推进「✓」，
     免得步数一少，末尾几个节点就永远等不到对勾 */
  const doneUpTo = idx * 20 / Math.max(1, FLOW_STEPS.length - 1);
  ['demand','order','fore','mps','mrp','pplan','mplan','pr','po','accept','out','ship','recv','pay','issue','done','fgin','sout','coll','grecv'].forEach(function (id, i) {
    const e = nodeEls[id];
    if (!e) return;
    e.classList.remove('active', 'done');
    if (idx === 0) return;
    if (act.has(id)) e.classList.add('active');
    else if (i < doneUpTo) e.classList.add('done');
  });
}

/* ---------- 飞行动画 ---------- */
function fly(def, tokens, reverse, scale) {
  return new Promise(function (resolve) {
    const pts = edgePoints(def);
    const d = pathD(pts);
    /* 这条 path 只用于 getPointAtLength 取样，必须显式设为「无填充 + 描边」，
       否则 SVG 默认黑色填充会被绘制成一大块黑块 */
    const tmp = el('path', {
      d: d, fill: 'none', stroke: '#cbd5e1',
      'stroke-width': 2, 'stroke-dasharray': '7 6', 'stroke-linecap': 'round'
    });
    (pathLayer || tokenLayer).appendChild(tmp);
    const len = tmp.getTotalLength();
    const k = scale || 1;   // 单次飞行缩放：合并步骤里环节多，按比例缩短每一段
    const dur = 880 * speedMult * ANIM_SCALE * k, stagger = 220 * speedMult * ANIM_SCALE * k;
    const items = tokens.map(function (t, i) {
      const g = el('g', {});
      /* 胶囊比原来扁一点（26→22）：字号不变，遮挡面积少三成 */
      const tx = Math.max(26, t.l.length * 9.4 + 12);
      const r = el('rect', { x: -tx, y: -11, width: tx * 2, height: 22, rx: 11, class: 'token ' + t.c });
      const txt = el('text', { x: 0, y: 5, 'text-anchor': 'middle', class: 'token-txt' }, t.l);
      g.appendChild(r); g.appendChild(txt);
      tokenLayer.appendChild(g);
      return { g: g, delay: i * stagger };
    });
    const kEl = edgeEls[def.id];
    if (kEl) kEl.classList.add('hot');
    const t0 = performance.now();
    let finished = false;
    /* 统一收尾：清理飞行 token 与取样 path。用 finished 做幂等保护，
       避免「帧循环完成」与「看门狗超时」两条路径重复清理。 */
    function cleanup() {
      if (finished) return;
      finished = true;
      items.forEach(function (t) { t.g.remove(); });
      tmp.remove();
      if (kEl) kEl.classList.remove('hot');
      resolve();
    }
    function frame(now) {
      if (finished) return;
      const e = now - t0;
      let allDone = true;
      items.forEach(function (t) {
        if (e < t.delay) { allDone = false; return; }
        const k = e >= t.delay + dur ? 1 : (e - t.delay) / dur;
        if (k < 1) allDone = false;
        const pt = tmp.getPointAtLength((reverse ? 1 - k : k) * len);
        t.g.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
        t.g.setAttribute('opacity', k >= 1 ? 0 : 1);
      });
      if (!allDone) requestAnimationFrame(frame);
      else cleanup();
    }
    /* 看门狗：万一某帧被浏览器节流/丢弃（例如后台标签页），
       也能保证 Promise 一定 settle，不会让演示永久卡死 */
    setTimeout(cleanup, dur + items.length * stagger + 2500);
    requestAnimationFrame(frame);
  });
}

let speedMult = 2.6;   // 演示速率倍率：默认「慢速」，数值越大动画越慢
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function animateStepTo(idx) {
  if (busy || flying || idx < 1 || idx >= FLOW_STEPS.length) return;
  const gen = ++animGen;   // 本遍动画的代号
  busy = true;
  updateNav();
  setStage(idx);
  paintStepHeader(idx);   // 标题与说明立刻切到本步，动画随后播放
  /* 物料流动看板与上方流程同步播放 */
  const mvDone = mvAnimateStep(idx);
  const plan = FLIGHT_PLAN[idx] || [];
  for (let i = 0; i < plan.length; i++) {
    if (gen !== animGen) return;   // 已被「重播 / 跳转 / 重置」取代，别再往下放
    const p = plan[i];
    const def = EDGES.find(x => x.id === p.e);
    if (!def) continue;
    flying = true;
    await fly(def, p.tok, p.flow === 'reverse', p.scale);
    flying = false;
    await sleep(110);
  }
  await mvDone.catch(function () {});
  if (gen !== animGen) return;     // 同上：作废的动画不许再改库存
  FLOW_STEPS[idx].moves.forEach(function (m) { inv[m.wh][m.code] = (inv[m.wh][m.code] || 0) + m.qty; });
  flowIdx = idx;
  if (typeof mvBuilt !== 'undefined' && mvBuilt) mvRenderNodes();
  renderFlow();
  busy = false;
  updateNav();
}

/* 只画「标题 / 环节 / 说明」这三样（不动库存与看板），
   这样步骤动画一开始就能把标题和说明切过去 —— 合并后的步骤要放好几秒，
   等动画结束才换标题会很别扭。 */
function paintStepHeader(i) {
  const s = FLOW_STEPS[i];
  if (!s) return;
  document.getElementById('flowTitle').textContent = s.title;
  document.getElementById('flowModule').textContent =
    '第 ' + i + ' / ' + (FLOW_STEPS.length - 1) + ' 步 · ' + s.module +
    (s.dept ? ' · ' + s.dept : '');
  const descEl = document.getElementById('flowDesc');
  descEl.innerHTML = s.desc;
  descEl.scrollTop = 0;
  /* 高度自适应：先去掉限高量出「不限高时的真实外框高度」再设回去。
     注意必须用 getBoundingClientRect().height（含边框），不能用 scrollHeight——
     scrollHeight 含内边距但不含边框，而全站是 box-sizing:border-box，
     用 scrollHeight 当 max-height 会让框比内容矮一个边框，最后一行被切掉并冒出滚动条。 */
  descEl.style.maxHeight = '';
  const descNeed = Math.ceil(descEl.getBoundingClientRect().height / ZF());
  descEl.style.maxHeight = Math.min(descNeed, Math.round(window.innerHeight / ZF() * 0.42)) + 'px';
}

function renderFlow() {
  paintStepHeader(flowIdx);
  const s = FLOW_STEPS[flowIdx];
  const bar = document.getElementById('flowBar');
  bar.style.width = (flowIdx / (FLOW_STEPS.length - 1) * 100) + '%';
  bar.className = flowIdx === FLOW_STEPS.length - 1 ? 'done' : '';

  document.getElementById('docTitle').innerHTML = s.docTitle + (s.dept ? '<span class="dept-chip">' + s.dept + '</span>' : '');
  document.getElementById('docNo').textContent = s.docNo;

  let html = '';
  if (s.docMeta && s.docMeta.length) {
    html += '<div class="doc-meta">' + s.docMeta.map(function (kv) { return '<span>' + kv[0] + '：<b>' + kv[1] + '</b></span>'; }).join('') + '</div>';
  }
  if (s.docRows) {
    html += '<table><thead><tr>' + s.docRows.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>'
      + s.docRows.body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('')
      + '</tbody></table>';
  }
  if (s.docNote) html += '<div class="doc-none">' + s.docNote + '</div>';
  if (!html) html = '<div class="doc-none">本环节不产生库存与单据变动，仅完成信息处理与计划编制。</div>';
  document.getElementById('docBody').innerHTML = html;

  // 仓库面板
  const delta = {};
  s.moves.forEach(function (m) { const k = m.wh + '|' + m.code; delta[k] = (delta[k] || 0) + m.qty; });

  const whHtml = WAREHOUSES.map(function (w) {
    const total = w.items.length;
    let filled = 0, rows = '';
    w.items.forEach(function (code) {
      const qty = inv[w.id][code] || 0;
      if (qty > 0) filled++;
      const k = w.id + '|' + code;
      const cls = delta[k] > 0 ? 'chg-up' : delta[k] < 0 ? 'chg-down' : '';
      const qtyText = qty === 0 ? '<span class="zero">0</span>' : fq(code, qty);
      rows += '<tr class="' + cls + '"><td>' + nodeName(code) + ' <span class="wcode">' + code + '</span></td>'
        + '<td style="text-align:right">' + qtyText + '</td></tr>';
    });
    return '<div class="wh ' + w.cls + '"><div class="wh-head"><span>' + w.name + '</span>'
      + '<span class="wh-code">' + w.code + ' · ' + filled + '/' + total + ' 齐套</span></div>'
      + '<div class="wh-bar"><i style="width:' + Math.round(filled / total * 100) + '%"></i></div>'
      + '<table><tbody>' + rows + '</tbody></table></div>';
  }).join('');

  const transit = [];
  if (flowIdx >= 10 && flowIdx < 11) transit.push('5 种采购件在途（供应商 → 本厂：原料进 01 仓，机芯/电池进 02 仓）');
  if (flowIdx >= 11 && flowIdx < 14) transit.push('塑料 2 种待发委外注塑（原辅料仓 → 宏达注塑）');
  if (flowIdx >= 17) transit.push('电子挂钟 ' + ORDER_QTY + ' 个已发运（03 成品仓 → ' + CUSTOMER + '）');
  const transitHtml = '<div class="wh transit"><div class="wh-head"><span>在途 / 待办</span><span class="wh-code">物流跟踪</span></div>'
    + '<div class="transit-list">' + (transit.length ? transit.map(function (x) { return '<div>' + x + '</div>'; }).join('')
      : '<div class="transit-empty">当前无在途物料</div>') + '</div></div>';

  document.getElementById('whGrid').innerHTML = whHtml + transitHtml;
}

function updateNav() {
  document.getElementById('flowPrev').disabled = busy || flying || flowIdx === 0;
  document.getElementById('flowNext').disabled = busy || flying || flowIdx === FLOW_STEPS.length - 1;
  const rp = document.getElementById('flowReplay');
  if (rp) rp.disabled = busy || flying || flowIdx === 0;   // 第 0 步没有可重播的动画
  document.getElementById('flowNext').textContent = flowIdx === FLOW_STEPS.length - 1 ? '已完成 ✓' : '下一步 ▶';
  document.querySelectorAll('#stepNav b').forEach(function (b, i) {
    b.classList.toggle('active', i === flowIdx);
    b.classList.toggle('done', i < flowIdx);
  });
}

function buildNav() {
  const nav = document.getElementById('stepNav');
  FLOW_STEPS.forEach(function (s, i) {
    const b = document.createElement('b');
    b.textContent = i + ' · ' + s.title.replace(/^[①-⑳]\s*/, '');
    b.title = s.title + '（' + s.module + '）';
    b.dataset.i = i;
    b.addEventListener('click', function () { jumpTo(i); });
    nav.appendChild(b);
  });
}

function goTo(idx) {
  stopPlay();
  animGen++;                 // 作废正在播放的那一遍
  busy = false; flying = false;
  flowIdx = Math.max(0, Math.min(FLOW_STEPS.length - 1, idx));
  initInv();
  for (let i = 1; i <= flowIdx; i++) {
    FLOW_STEPS[i].moves.forEach(function (m) { inv[m.wh][m.code] = (inv[m.wh][m.code] || 0) + m.qty; });
  }
  renderFlow();
  setStage(flowIdx);
  if (typeof mvBuilt !== 'undefined' && mvBuilt) mvSetStep(flowIdx);   // 建板前调用时跳过
  if (typeof mvBuilt !== 'undefined' && mvBuilt) mvRenderNodes();
  updateNav();
}

function jumpTo(i) {
  if (busy || flying) return;
  if (i === flowIdx + 1) { animateStepTo(flowIdx + 1); return; }
  goTo(i);
}

/* 点击节点跳转：与 jumpTo 的区别是「可以打断正在播放的动画」，
   课堂上讲到一半想跳到别的环节时不必等动画放完。 */
function clickToStep(i) {
  if (busy || flying) cancelAnim();
  if (i === flowIdx + 1) animateStepTo(flowIdx + 1);
  else if (i !== flowIdx) goTo(i);
}

/* 立即结束当前动画并清理画面，让 busy / flying 归位 */
function cancelAnim() {
  stopPlay();
  animGen++;                 // 作废正在播放的那一遍
  document.querySelectorAll('.board .token').forEach(function (t) { t.remove(); });
  document.querySelectorAll('#flowSvg > g:last-of-type > path').forEach(function (p) { p.remove(); });
  document.querySelectorAll('.board path.edge.hot').forEach(function (p) { p.classList.remove('hot'); });
  if (mvTokenLayer) { while (mvTokenLayer.firstChild) mvTokenLayer.removeChild(mvTokenLayer.firstChild); }
  Object.keys(mvArcEls).forEach(function (k) { mvArcEls[k].classList.remove('on'); });
  mvFlying = 0;
  busy = false;
  flying = false;
  updateNav();
}

/* 重新演示当前步骤（快捷键 R）。
   注意不能直接把本步再播一遍：本步的库存变动会被重复累加，
   所以先退回上一步的状态，再完整播一遍，播完状态与原来完全一致。 */
function replayStep() {
  if (flowIdx < 1) return;              // 第 0 步「演示准备」没有动画
  const target = flowIdx;
  if (busy || flying) cancelAnim();     // 正放着一半就先停下
  stopPlay();
  goTo(target - 1);                     // 回退：库存 / 高亮 / 物料看板一起退回去
  animateStepTo(target);                // 再把这一步完整演示一遍
}

/* 自动播放 */
function togglePlay() {
  if (playTimer) { stopPlay(); return; }
  if (flowIdx >= FLOW_STEPS.length - 1) goTo(0);
  const btn = document.getElementById('flowPlay');
  btn.classList.add('playing');
  btn.textContent = '⏸ 暂停';
  playTimer = setInterval(function () {
    if (busy || flying) return;
    if (flowIdx >= FLOW_STEPS.length - 1) { stopPlay(); return; }
    animateStepTo(flowIdx + 1);
  }, 520);
}
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  const btn = document.getElementById('flowPlay');
  if (btn) { btn.classList.remove('playing'); btn.textContent = '▶ 自动播放'; }
}

/* 全局快捷键：← → 切换步骤 · 空格播放/暂停 · 数字键跳转 · D 同屏演示 · R 重播本步 */
document.addEventListener('keydown', function (e) {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  /* 这些快捷键只在「① 生产流程演示」里生效；
     切到任何别的页签（分类游戏 / 仓库归类 / 物料图 / 厂区游戏）都让位，
     免得跟那边的 `1/2/3`、方向键抢键 */
  const actView = document.querySelector('.view.active');
  if (!actView || actView.id !== 'mainView') return;
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleDuo(); return; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); replayStep(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); if (!playTimer) animateStepTo(flowIdx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(flowIdx - 1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (/^[0-9]$/.test(e.key)) { jumpTo(parseInt(e.key, 10)); }
});

const MV_WORKING = { 3: ['fac'], 4: ['fac'], 8: ['fac'], 9: ['fac'], 10: ['out'], 11: ['fac'], 12: ['fac'] };

/* 步骤 → 物料流动（l 标签 / c 配色 / e 走的路径） */
const MV_FLOWS = {
  7:  [{ l: '到货', c: 'b', e: 'a_rev_raw' }, { l: '组件', c: 'm', e: 'a_rev_semi' }],
  8:  [{ l: '铝材 ' + fq('12310', MRP_REQ['12310']), c: 'b', e: 'a_raw_fac' },
       { l: '薄膜 ' + fq('12421', MRP_REQ['12421']), c: 'b', e: 'a_raw_fac' }],
  9:  [{ l: '长针', c: 'm', e: 'a_fac_semi' }, { l: '短针', c: 'm', e: 'a_fac_semi' },
       { l: '秒针', c: 'm', e: 'a_fac_semi' }, { l: '字膜', c: 'm', e: 'a_fac_semi' }],
  10: [{ l: '塑料', c: 'b', e: 'a_raw_out' }, { l: '盘体', c: 's', e: 'a_out_semi' }, { l: '钟框', c: 's', e: 'a_out_semi' }],
  11: [{ l: '盘体/字膜/针', c: 's', e: 'a_semi_fac' }, { l: '盘面/钟盘', c: 'm', e: 'a_fac_semi' }],
  12: [{ l: '机芯/电池/钟盘/钟框', c: 'm', e: 'a_semi_fac' }, { l: '电子挂钟', c: 'm', e: 'a_fac_fin' }],
  13: [{ l: '电子挂钟 ' + ORDER_QTY, c: 'm', e: 'a_fin_cust' }]
};

let mvBuilt = false, mvTokenLayer = null, mvArcEls = {}, mvNodeEls = {}, mvSvgEl = null;
let mvFlying = 0, mvPending = null;

function mvBuild() {
  const board = document.getElementById('mvBoard');
  if (!board || mvBuilt) return;
  const L = mvCurLayout();
  const svg = document.getElementById('mvSvg');
  mvSvgEl = svg;
  svg.setAttribute('viewBox', '0 0 ' + MV_W + ' ' + L.h);
  svg.setAttribute('preserveAspectRatio', 'none');
  if (board) board.classList.toggle('row', mvIsRow());

  L.arcs.forEach(function (a) {
    const p = el('path', { d: a.d, class: 'mv-arc' + (a.flat ? '' : ' demo') });
    svg.appendChild(p);
    mvArcEls[a.id] = p;
  });

  mvTokenLayer = el('g', {});
  svg.appendChild(mvTokenLayer);

  L.nodes.forEach(function (n) {
    const d = document.createElement('div');
    d.className = 'mv-node' + (n.cls ? ' ' + n.cls : '');
    d.dataset.mv = n.id;
    d.style.left = (n.x / MV_W * 100) + '%';
    d.style.top = (n.y / L.h * 100) + '%';
    d.style.width = (n.w / MV_W * 100) + '%';
    d.style.height = (n.h / L.h * 100) + '%';
    d.innerHTML =
      '<div class="mv-ic" style="width:' + L.icon + '%;height:' + L.icon + '%">' + MV_ICON[n.ic] + '</div>' +
      '<div class="mv-name">' + n.name + '</div>' +
      '<div class="mv-sub">' + n.sub + '</div>' +
      '<div class="mv-body"></div>';
    board.appendChild(d);
    mvNodeEls[n.id] = d;
  });

  mvBuilt = true;
}

/* 仓库卡片里显示物料明细；工厂/委外商显示当前在制 */
function mvRenderNodes() {
  if (!mvBuilt) return;
  const L = mvCurLayout();
  ['raw', 'semi', 'fin'].forEach(function (wid) {
    const el2 = mvNodeEls[wid];
    const box = el2.querySelector('.mv-body');
    const items = WAREHOUSES.filter(function (w) { return w.id === wid; })[0].items;
    const have = items.filter(function (c) { return (inv[wid][c] || 0) > 0; });
    el2.querySelector('.mv-sub').textContent =
      (L.prefix ? (wid === 'raw' ? '01 · ' : wid === 'semi' ? '02 · ' : '03 · ') : '') +
      have.length + '/' + items.length + ' 齐套';
    if (!have.length) { box.innerHTML = '<span class="mv-mat">（空）</span>'; return; }
    box.innerHTML = '<div class="mv-chips">' + have.slice(0, L.chips).map(function (c) {
      return '<span class="mv-chip">' + nodes[c].name + ' ' + fq(c, inv[wid][c]) + '</span>';
    }).join('') + (L.plus && have.length > L.chips ? '<span class="mv-chip">+' + (have.length - L.chips) + '</span>' : '') + '</div>';
  });
}

/* 高亮当前步骤涉及的节点 */
function mvSetStep(idx) {
  if (!mvBuilt) return;
  const on = MV_STEP_NODES[idx] || [];
  const work = MV_WORKING[idx] || [];
  MV_NODES.forEach(function (n) {
    const d = mvNodeEls[n.id];
    d.classList.toggle('active', on.indexOf(n.id) >= 0);
    d.classList.toggle('working', work.indexOf(n.id) >= 0);
  });
  Object.keys(mvArcEls).forEach(function (k) { mvArcEls[k].classList.remove('on'); });
}

/* 沿路径飞一个物料胶囊 */
function mvFly(arcId, tok) {
  return new Promise(function (resolve) {
    if (!mvBuilt || !mvArcEls[arcId]) { resolve(); return; }
    const arc = mvArcEls[arcId];
    arc.classList.add('on');
    let len = 0;
    try { len = arc.getTotalLength(); } catch (e) { len = 0; }
    if (!len) { resolve(); return; }
    /* 药丸尺寸跟着当前字号走：画幅变宽或切换布局后，字不会撑出药丸 */
    let base = 15;
    try { base = parseFloat(getComputedStyle(document.getElementById('mvBoard')).getPropertyValue('--mvs')) || 15; } catch (e) { base = 15; }
    /* 胶囊高度按字号走，但要封顶：面板用户坐标高度固定，
       4K 投影上字号很大时，不封顶的胶囊会顶出画幅被裁掉。 */
    const L0 = mvCurLayout();
    const th = Math.min(base * (L0.tok || 1.75), (L0.h || 440) * 0.15);
    const tx = Math.max(base * 2.2, tok.l.length * base * 0.78 + base * 0.6);
    const g = el('g', {});
    g.appendChild(el('rect', { x: -tx, y: -th / 2, width: tx * 2, height: th, rx: th / 2, class: 'mv-tok ' + tok.c }));
    g.appendChild(el('text', { x: 0, y: base * 0.35, 'text-anchor': 'middle', class: 'mv-tok-txt' }, tok.l));
    mvTokenLayer.appendChild(g);
    mvFlying++;
    const dur = 900 * speedMult, t0 = performance.now();
    let done = false;
    function finish() {
      if (done) return;
      done = true;
      g.remove();
      arc.classList.remove('on');
      mvFlying--;
      resolve();
    }
    (function frame(now) {
      const k = Math.min(1, (now - t0) / dur);
      let pt;
      try { pt = arc.getPointAtLength(k * len); } catch (e) { finish(); return; }
      g.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
      g.setAttribute('opacity', k >= 1 ? 0 : 1);
      if (k < 1) requestAnimationFrame(frame); else finish();
    })(performance.now());
    setTimeout(finish, dur + 2500);   // 看门狗
  });
}

/* 按步骤播放物料流动；返回 Promise 以便与上方动画串行 */
function mvAnimateStep(idx) {
  if (!mvBuilt) return Promise.resolve();
  mvSetStep(idx);
  const plan = MV_FLOWS[idx] || [];
  mvRenderNodes();
  const gen = animGen;
  let p = Promise.resolve();
  plan.forEach(function (f) {
    p = p.then(function () {
      if (gen !== animGen) return;   // 本遍已作废，别再往看板上飞
      return mvFly(f.e, { l: f.l, c: f.c });
    });
  });
  return p;
}

/* 库存变化后刷新卡片 */
function mvRefresh() { if (mvBuilt) mvRenderNodes(); }

/* 切换物料看板布局：同屏演示用横排紧凑版，普通模式用竖排详细版。
   节点/弧线都是重建的（旧元素直接移除），当前步骤高亮与库存明细会一并恢复。 */
function mvSetLayout(name) {
  if (name === mvLayoutName) return;
  mvLayoutName = name;
  if (!mvBuilt) return;
  Object.keys(mvNodeEls).forEach(function (k) { mvNodeEls[k].remove(); delete mvNodeEls[k]; });
  Object.keys(mvArcEls).forEach(function (k) { delete mvArcEls[k]; });
  const svg = document.getElementById('mvSvg');
  while (svg && svg.firstChild) svg.removeChild(svg.firstChild);
  mvTokenLayer = null;
  mvBuilt = false;
  mvBuild();
  mvSetStep(flowIdx);
  mvRenderNodes();
}

/* 模块数据声明完毕后再初始化看板（避免 const 的暂时性死区） */
mvBuild();
mvSetStep(flowIdx);
mvRenderNodes();

/* 模块数据与看板都就绪后再渲染初始状态 */
goTo(0);

/* ===== 独立成页：iframe 内部不再做跨机 zoom（外层导航统一缩放），ZF 恒为 1 ===== */
window.__FITZ__ = 1;
function ZF() { return 1; }
</script>

  o.push(`<line x1="${AX-36}" y1="${PADT}" x2="${W-8}" y2="${PADT}" stroke="${CRIT}" stroke-width="3.4"/>`);
  o.push(`<text x="${W-12}" y="${PADT-17}" font-size="20" font-weight="800" text-anchor="end" fill="${CRIT}">交期 2019-09-26（周四）</text>`);

  /* 树：父件竖线（长度 = 提前期）＋ 横脊 ＋ 子件短竖线 */
  (function tree(n){
    const col = PAINT[n.type].fg;
    const x = cx(n), yb = yBot(n);
    const kids = n.kids || [];
    const yEnd = kids.length ? (yTop(kids[0]) - 12) : yOff(off(n.start));

    o.push(`<path d="M ${x} ${yb} L ${x} ${yEnd}" fill="none" stroke="${col}" stroke-width="3.4"/>`);
    if (kids.length > 1) {
      const xs = kids.map(cx);
      o.push(`<path d="M ${Math.min(...xs)} ${yEnd} L ${Math.max(...xs)} ${yEnd}" fill="none" stroke="#8fa0b5" stroke-width="2.4"/>`);
      kids.forEach(k => o.push(`<path d="M ${cx(k)} ${yEnd} L ${cx(k)} ${yTop(k)}" fill="none" stroke="#8fa0b5" stroke-width="2.4"/>`));
    }
    o.push(`<rect x="${x-9}" y="${yEnd-9}" width="18" height="18" rx="3.5" fill="${col}"/>`);
    kids.forEach(tree);
  })(ROOT);

  /* 方框（中心压在完成期的时间轴线上） */
  (function draw(n){
    const col = PAINT[n.type].fg;
    const x = cx(n) - BOXW/2, y = yTop(n);
    o.push(`<rect x="${x}" y="${y}" width="${BOXW}" height="${BOXH}" rx="9" fill="#ffffff" stroke="${col}" stroke-width="3.4"/>`);
    /* 方框里只有物料名 —— 说读图方法的图例、小标题全部删掉，字号从 17.5px 一路放到 32px */
    o.push(`<text x="${cx(n)}" y="${y + BOXH/2 + 11}" font-size="${NAMEFS}" font-weight="800" text-anchor="middle" fill="${col}">${n.name}</text>`);
    (n.kids||[]).forEach(draw);
  })(ROOT);

  o.push(`</svg>`);
  document.getElementById('tree').innerHTML = o.join('');
})();





/* ============================ 明细表 ============================ */
(function table(){
  const head = ['层级','编码','名称','属性','提前期','口径','开工 / 下达期','开工期依据','完成期','单位用量','父件'];
  const body = ROWS.map(r => {
    const p = r.parentUid >= 0 ? ROWS[UID2IDX[r.parentUid]] : null;
    const pn = p ? `${p.code} ${p.name}` : '—';
    const isSrc = r.src.startsWith('源');
    return `<tr>
      <td>L${r.depth}</td>
      <td>${r.code}</td>
      <td>${r.name}</td>
      <td><span class="tag ${r.type}">${r.type} ${TYPE_NAME[r.type]}</span></td>
      <td><b>${r.lt}</b> 天${r.note ? `<br><span style="font-size:11px;color:var(--muted)">${r.note}</span>` : ''}</td>
      <td>${r.cal}</td>
      <td>${r.start}</td>
      <td class="${isSrc?'src-y':'src-n'}">${r.src}</td>
      <td>${r.due}</td>
      <td>${r.qty}</td>
      <td>${pn}</td>

    </tr>`;
  }).join('');
  document.getElementById('tbl').innerHTML =
    `<thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody>`;
})();
</script>
