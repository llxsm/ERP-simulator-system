<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用友ERP · 生产演示系统</title>
<style>
  :root {
    --m-color: #2563eb;        /* 自制件 M：蓝色 */
    --m-bg: #eff4ff;
    --b-color: #ea580c;        /* 采购件 B：橙色（与物料图一致） */
    --b-bg: #fff7ed;
    --s-color: #16a34a;        /* 委外件 S：绿色 */
    --s-bg: #f0fdf4;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --card: #ffffff;
    --bg: #f6f7f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Heiti SC", SimHei, "黑体", "Microsoft JhengHei", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.65;
  }

  /* 中文优先字体栈：故意不用 -apple-system / Segoe UI 打头——它们没有中文字形，
     中文会回退成宋体，投影时笔画细、发虚。这里按「Win10/11 微软雅黑 → macOS 苹方
     → 思源黑体 / 文泉驿（国产 Linux）→ 黑体 SimHei（Win7/XP 也有黑体，比宋体清楚）
     → 最后 sans-serif」排列，保证任何一台机器上都能选到一款无衬线中文字体。 */
  button, input, select, textarea, svg text {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Heiti SC", SimHei, "黑体", "Microsoft JhengHei", "Segoe UI", Roboto, Arial, sans-serif;
  }

  .page {
    max-width: 1340px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ===== 头部 ===== */
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    border-radius: 14px;
    padding: 26px 30px;
    margin-bottom: 20px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 32px;
    letter-spacing: 1px;
  }
  header p {
    margin: 0;
    font-size: 16px;
    opacity: .95;
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .stat {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 15px;
  }
  .stat b { font-size: 22px; margin-right: 5px; }

  /* ===== 卡片通用 ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 22px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 23px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card h2 .ic { width: 25px; height: 25px; color: var(--m-color); flex: none; }
  .card .sub { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
  .flow-demo .sub { font-size: 13px; margin-bottom: 8px; max-height: 1.5em; overflow: hidden; }

  /* ===== 视图切换 ===== */
  .view { display: none; }
  .view.active { display: block; }


  /* 返回链接 */
  .back-link { text-align: center; margin-bottom: 20px; }
  .back-btn { background: none; border: none; color: var(--m-color); font-size: 15px; cursor: pointer; padding: 0; font-family: inherit; }
  .back-btn:hover { text-decoration: underline; }

  /* ===== 物料分类小游戏 ===== */
  .game-top { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 22px; }
  .game-score { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; border-radius: 10px; padding: 9px 18px; font-size: 15px; }
  .game-score b { font-size: 26px; margin: 0 4px; }
  .game-count { color: var(--muted); font-size: 15px; }
  .game-count b { color: var(--ink); font-size: 18px; }

  .game-stage { text-align: center; }

  /* --- 拖拽专用样式 --- */
  .dnd-tip { font-size: 15px; color: var(--muted); margin-bottom: 16px; }
  .dnd-tip kbd {
    display: inline-block; min-width: 22px; padding: 1px 6px; margin: 0 2px;
    border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 5px;
    background: #f8fafc; font-family: inherit; font-size: 13px; font-weight: 700; color: #475569;
  }

  .dnd-source {
    display: flex; justify-content: center; align-items: center;
    min-height: 132px; margin-bottom: 14px;
  }
  .dnd-source.empty::after { content: '本局物料已全部分类完成'; color: var(--muted); font-size: 17px; }

  /* 待分类物料卡片
     注意：卡片配色对所有物料完全一致（中性灰蓝），不能用 M/B/S 的颜色，
     否则等于直接把答案写在卡面上。分类结果的颜色只在「拖对入箱」后出现。
     卡面只印物料名称（物料编码 / 单位 / 「拖动我」提示都已去掉），名称居中放大。 */
  .mat-card {
    position: relative; width: 300px; padding: 30px 22px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 2px solid #cbd5e1; border-radius: 16px;
    box-shadow: 0 4px 14px rgba(15,23,42,.12); cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: transform .12s ease, box-shadow .12s ease, opacity .18s ease, border-color .12s ease;
  }
  .mat-card:hover { transform: translateY(-3px); border-color: #94a3b8; box-shadow: 0 10px 24px rgba(15,23,42,.18); }
  .mat-card.dragging { cursor: grabbing; opacity: .95; transform: scale(1.04) rotate(-1.5deg); box-shadow: 0 16px 34px rgba(15,23,42,.28); }
  .mat-card.locked { cursor: default; }
  .mat-card .mc-name { display: block; font-size: 46px; font-weight: 800; color: var(--ink); line-height: 1.18; text-align: center; letter-spacing: 2px; }
  .mat-card.ok { border-color: var(--s-color); }      /* 拖对：绿框反馈 */
  .mat-card.no { border-color: #ef4444; animation: shake .38s ease; }   /* 拖错：红框 + 抖动 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    45% { transform: translateX(8px); }
    70% { transform: translateX(-5px); }
  }

  /* 跟随指针的拖拽替身 */
  .drag-ghost {
    position: fixed; z-index: 999; pointer-events: none; margin: 0;
    box-shadow: 0 18px 38px rgba(15,23,42,.3); transform: rotate(-2.5deg); opacity: .96;
  }

  /* 三个分类箱 */
  .dnd-zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: stretch; text-align: left; }
  @media (max-width: 720px) { .dnd-zones { grid-template-columns: 1fr; } }

  .zone {
    border: 4px solid #cbd5e1; border-radius: 14px; background: #fbfcfe;
    padding: 14px 16px 16px; min-height: 190px;
    display: flex; flex-direction: column; transition: .14s ease;
    box-shadow: 0 3px 12px rgba(15,23,42,.07);
  }
  .zone.m { border-color: #8fb3f5; background: linear-gradient(180deg, #f2f6ff, #fff 40%); }
  .zone.b { border-color: #f0b56b; background: linear-gradient(180deg, #fff7ec, #fff 40%); }
  .zone.s { border-color: #6fc98f; background: linear-gradient(180deg, #f1fdf5, #fff 40%); }
  /* 分类箱标题：只留「自制件 M」这样的大字，后面那行小字说明已去掉 */
  .zone-head { display: flex; align-items: center; justify-content: center; padding-bottom: 9px; border-bottom: 2px solid rgba(15,23,42,.07); margin-bottom: 10px; position: relative; }
  .zone-head b { font-size: clamp(26px, 2.1vw, 34px); font-weight: 800; letter-spacing: 1px; line-height: 1.15; }
  .zone-head b span { font-size: .62em; opacity: .85; margin-left: 2px; }
  .zone.m .zone-head b { color: var(--m-color); }
  .zone.b .zone-head b { color: var(--b-color); }
  .zone.s .zone-head b { color: var(--s-color); }
  .zone-head i { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 22px; font-weight: 800; color: var(--muted); }

  .zone.over { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(37,99,235,.20); }
  .zone.m.over { background: #e8f0ff; border-color: var(--m-color); }
  .zone.b.over { background: #fff3dd; border-color: var(--b-color); }
  .zone.s.over { background: #e6fbee; border-color: var(--s-color); }
  .zone.wrong { border-color: #dc2626; background: #fef2f2; animation: shake .38s ease; }
  .zone.hint { border-color: var(--s-color); background: #e6fbee; }
  /* 答错时把「正确答案」所在的分类箱标出来 */
  .zone { position: relative; }
  .zone.answer { border-color: #16a34a; background: #effdf4; box-shadow: 0 0 0 5px rgba(22,163,74,.20); }
  .zone-tag {
    position: absolute; top: -12px; right: 12px; font-size: 12px; font-weight: 800; color: #fff;
    background: #16a34a; border-radius: 20px; padding: 2px 10px; box-shadow: 0 2px 6px rgba(22,163,74,.35);
  }
  /* 答错后归位的物料：在正确箱子里用红字划掉，一眼能看出错的是哪几个 */
  .zone-items .zi.miss { border-color: #fecaca; background: #fff1f2; color: #b91c1c; text-decoration: line-through; }
  .zone-items .zi.miss::after { content: " ✗"; text-decoration: none; font-weight: 800; }
  .fb-wait { color: var(--muted); font-weight: 600; font-size: 15px; margin-left: 8px; }
  .game-feedback.can-skip { cursor: pointer; }
  /* 结果页：错误明细 */
  .gr-review { text-align: left; max-width: 760px; margin: 0 auto 22px; }
  .gr-rev-title { font-size: 15px; font-weight: 800; color: #b91c1c; margin-bottom: 8px; }
  .gr-rev-item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 15px;
    padding: 9px 13px; border: 1px solid #fecaca; background: #fff8f8; border-radius: 10px; margin-bottom: 6px;
  }
  .gr-rev-item .gr-name { font-weight: 800; }
  .gr-rev-item .rc { color: var(--muted); font-size: 13px; }
  .gr-rev-item .gr-chose i { font-style: normal; color: #b91c1c; font-weight: 800; }
  .gr-rev-item .gr-right i { font-style: normal; color: #15803d; font-weight: 800; }
  .gr-rev-item .gr-arrow { color: var(--muted); }
  .gr-none { font-size: 16px; color: #16a34a; font-weight: 700; text-align: center; margin-bottom: 20px; }

  .zone-items { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; flex: 1; }
  .zone-items .empty { color: #cbd5e1; font-size: 15px; }
  .zone-items .zi {
    font-size: 21px; font-weight: 800; padding: 5px 12px; border-radius: 9px;
    background: #fff; border: 2px solid var(--line); color: var(--ink);
    animation: popin .28s ease;
  }
  .zone.m .zone-items .zi { border-color: #bed2fb; color: var(--m-color); }
  .zone.b .zone-items .zi { border-color: #f7d9a8; color: var(--b-color); }
  .zone.s .zone-items .zi { border-color: #b3e8c5; color: var(--s-color); }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .game-feedback { font-size: 18px; font-weight: 700; min-height: 30px; margin-bottom: 16px; }
  .game-feedback.ok { color: #16a34a; }
  .game-feedback.no { color: #ef4444; }

  .game-action { font-size: 16px; padding: 10px 22px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; font-family: inherit; transition: .12s ease; }
  .game-action:hover { border-color: var(--m-color); color: var(--m-color); }
  .game-action.primary { background: var(--m-color); color: #fff; border-color: var(--m-color); }
  .game-action.primary:hover { background: #1d4ed8; color: #fff; }
  .game-action.gray { background: #f3f4f6; border-color: var(--line); }

  /* 结果页 */
  .gr-big { font-size: 20px; color: var(--muted); margin-bottom: 10px; }
  .gr-big b { font-size: 68px; font-weight: 800; color: var(--ink); margin: 0 4px; }
  .gr-big span { font-size: 22px; }
  .gr-msg { font-size: 20px; font-weight: 700; margin-bottom: 22px; min-height: 30px; }
  .gr-msg.full { color: #16a34a; }
  .gr-msg.notfull { color: var(--muted); }

  /* ===================== 合并进来的两个子页面：顶部导航 + iframe 视图 ===================== */
  #navBar {
    position: sticky; top: 0; z-index: 9999; height: 46px; box-sizing: border-box;
    display: flex; align-items: center; gap: 9px; padding: 0 14px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff;
    box-shadow: 0 2px 10px rgba(15,23,42,.22); font-size: 14px; white-space: nowrap;
  }
  body.focus-mode #navBar { display: none; }        /* 同屏演示时让位，把空间全给看板 */
  #navBar .nb-brand { font-weight: 800; font-size: 15px; margin-right: 10px; }
  #navBar .nb-tab {
    font-family: inherit; font-size: 13.5px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.45);
    border-radius: 999px; padding: 4px 13px; transition: background .12s ease;
  }
  #navBar .nb-tab:hover { background: rgba(255,255,255,.3); }
  #navBar .nb-tab.active { background: #fff; color: #1e3a8a; border-color: #fff; }
  /* 子页面要铺满，不能被 .page 的 1340px 版心和内边距框住 */
  .page#figView, .page#factoryView { max-width: none; margin: 0; padding: 0; }
  .subframe { display: block; width: 100%; height: calc(100vh - 46px); border: 0; background: #fff; }
  /* 跨机适配开关（样式跟页签一致，但不参与视图切换） */
  #navBar .nb-snd {
    font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.07); border: 1.5px dashed rgba(255,255,255,.55);
    border-radius: 999px; padding: 4px 11px; transition: background .12s ease; white-space: nowrap;
  }
  #navBar .nb-snd:hover { background: rgba(255,255,255,.22); }
  #navBar .nb-snd.off { opacity: .5; }
  #navBar .nb-fit {
    margin-left: auto;                             /* 页签靠左、缩放按钮靠右 */
    font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.07); border: 1.5px dashed rgba(255,255,255,.55);
    border-radius: 999px; padding: 4px 11px; transition: background .12s ease; white-space: nowrap;
  }
  #navBar .nb-fit:hover { background: rgba(255,255,255,.22); }
  #navBar .nb-fit.off { opacity: .5; }

  /* ===================== ⓪ BOM 搭建 ===================== */
  /* BOM-BUILD-CSS-START */
  /* 说明：:root 变量 / * / body 这些基础样式由主文件的 BASE_CSS 提供，
     这一块只放 BOM 页自己的规则，别再重复声明一遍。 */

  /* BOM 页是「左图 + 右卡池」的两栏，需要比其它游戏宽：按 DESIGN_W(1900) 留足 1840 */
  .page#bomView { max-width: 1840px; padding: 12px 16px 20px; }
  /* 单独打开这份文件时才会带 #navBar（46px 吸顶），内容不能紧贴它 */
  body > #navBar + .page#bomView { padding-top: 10px; }

  /* ===== 顶部导航（与其它独立文件一致：标题 + 音效 + 缩放） ===== */
  #navBar {
    position: sticky; top: 0; z-index: 9999; height: 46px;
    display: flex; align-items: center; gap: 9px; padding: 0 14px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff;
    box-shadow: 0 2px 10px rgba(15,23,42,.18);
  }
  #navBar .nb-brand { font-size: 15.5px; font-weight: 700; letter-spacing: .5px; margin-right: auto; white-space: nowrap; }
  #navBar .nb-snd, #navBar .nb-fit {
    font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.07); border: 1.5px dashed rgba(255,255,255,.55);
    border-radius: 999px; padding: 4px 11px; transition: background .12s ease; white-space: nowrap;
  }
  #navBar .nb-snd { margin-left: auto; }
  #navBar .nb-snd:hover, #navBar .nb-fit:hover { background: rgba(255,255,255,.22); }
  #navBar .nb-fit.off { opacity: .5; }

  /* ===== 头部：不占地方，只留一条状态行 ===== */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px 16px; margin-bottom: 0; }

  /* ===== 状态条（一行：得分 / 已填 / 放错 / 用时 / 重开） ===== */
  .bom-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .bom-score { font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #1e3a8a, #2563eb); border-radius: 10px; padding: 8px 16px; }
  .bom-score b { font-size: 22px; }
  .bom-count { font-size: 14px; color: var(--muted); }
  .bom-count b { font-size: 16px; color: var(--ink); }
  .bom-clock { font-size: 14px; color: var(--muted); }
  .bom-clock b { font-size: 18px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .bom-clock.on b { color: var(--m-color); }
  .bom-btn { margin-left: auto; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 9px; padding: 7px 16px; }
  .bom-btn:hover { border-color: var(--m-color); color: var(--m-color); }
  /* 反馈条：平时**空着不占位**（:empty 直接 display:none），
     只有放对/放错时才出现一行，显示完就淡出 —— 版面不会被它挤动。 */
  .bom-tip {
    font-size: 14px; line-height: 1.5; border-radius: 8px; padding: 6px 12px; margin-bottom: 8px;
    background: #f1f5f9; color: #334155; border-left: 4px solid var(--m-color);
    opacity: 0; transition: opacity .2s ease;
  }
  .bom-tip:empty { display: none; }
  .bom-tip.on { opacity: 1; }
  .bom-tip.ok { background: #f0fdf4; border-left-color: #16a34a; color: #14532d; font-weight: 700; }
  .bom-tip.no { background: #fef2f2; border-left-color: #dc2626; color: #7f1d1d; }

  /* ===== 布局：左边 BOM 分层图、右边物料卡池，力争同屏不滚动 =====
     图的横向需求靠压缩列距（SPX 128）+ 节点宽度降到 118px 解决；
     纵向靠压缩行距（SPY 110）+ 去掉大标题横幅腾出来。

     ⚠️ 这里**故意用容器查询（@container）而不是 @media**：
     整页有跨机 zoom（DESIGN_W=1900），@media 判断的是**未缩放的** innerWidth，
     在 1366 宽的机器上 zoom=0.72、版面其实有 1900px 宽，@media 却会判成"窄屏"而错误地竖排，
     结果内容被拉到 790px 高、超出一屏。容器查询量的是元素自己的宽度，与 zoom 无关。 */
  .bom-main { container-type: inline-size; }
  .bom-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(500px, 620px);
    gap: 14px; align-items: start;
  }
  @container (max-width: 1400px) {
    .bom-main { grid-template-columns: minmax(0, 1fr); }
  }

  .bom-panel { border: 1px solid var(--line); border-radius: 12px; background: #fcfdff; padding: 10px 12px 12px; }
  .bom-ph { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); padding-bottom: 6px; margin-bottom: 8px; border-bottom: 2px solid var(--line); }
  .bom-ph b { font-size: 17px; color: var(--ink); white-space: nowrap; flex: none; }
  .bom-ph em { font-style: normal; margin-left: auto; text-align: right; font-size: 12.5px; color: #94a3b8; }

  /* ---------- BOM 分层图 ----------
     画法与《电子挂钟ERP生产流程演示.html》一致：绝对定位节点 + SVG 肘形连线，
     连线从"子件顶部"画到"父件底部"（物料向上流），带箭头。
     节点尺寸比演示图收小了（118×78 对 120×76），列距 / 行距也压紧，
     目的是让整张图和右边的卡池能同屏放下；几何参数在 JS 里（SPX/SPY/NW/NH/PAD），
     改这里要同步改 CSS 的 .bom-node 尺寸。 */
  .bom-canvas { position: relative; overflow-x: auto; }
  .bom-stage { position: relative; }
  .bom-lines { position: absolute; left: 0; top: 0; pointer-events: none; }

  .bom-node {
    position: absolute; width: 118px; height: 78px;
    border: 2.5px solid var(--line); border-radius: 9px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5px 6px; text-align: center; box-shadow: 0 2px 8px rgba(15,23,42,.06);
  }
  .bom-node .bn-tag {
    position: absolute; top: -11px; right: -9px; font-size: 12px; font-weight: 800; color: #fff;
    border-radius: 999px; min-width: 22px; height: 22px; line-height: 22px; text-align: center;
    background: #94a3b8; box-shadow: 0 2px 6px rgba(15,23,42,.22);
  }
  .bom-node .bn-name { font-size: 17px; font-weight: 800; line-height: 1.2; }
  .bom-node .bn-sub { font-size: 12px; color: #9aa3b2; margin-top: 2px; }

  /* 根节点（成品）与子件配色 */
  .bom-node.root { border-color: #1e3a8a; background: linear-gradient(180deg, #eef4ff, #fff); width: 136px; }
  .bom-node.root .bn-name { font-size: 20px; }
  .bom-node.m { border-color: var(--m-color); }
  .bom-node.b { border-color: var(--b-color); }
  .bom-node.s { border-color: var(--s-color); }
  .bom-node.m .bn-tag { background: var(--m-color); }
  .bom-node.b .bn-tag { background: var(--b-color); }
  .bom-node.s .bn-tag { background: var(--s-color); }

  /* 已给的参照节点：灰一点的实底，读了就知道"这里不用填" */
  .bom-node.given { background: #fff; }
  .bom-node.given .bn-sub { color: #b6c0cd; }

  /* 待填空槽：**框的颜色＝这一格需要的物料类型**（M 蓝 / B 橙 / S 绿），
     但键面保持中性的浅底，让学生盯着颜色看类型、盯着位置看层级。
     选中一张卡时，类型相符的空槽会再提亮一圈（.hint）。 */
  .bom-node.slot {
    border-style: dashed; background: #f7f9fc;
    cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
  }
  .bom-node.slot.m { border-color: var(--m-color); }
  .bom-node.slot.b { border-color: var(--b-color); }
  .bom-node.slot.s { border-color: var(--s-color); }
  .bom-node.slot .bn-ph { font-size: 18px; font-weight: 800; color: #c3ccd8; line-height: 1.1; }
  .bom-node.slot.m .bn-ph { color: #a9c0ee; }
  .bom-node.slot.b .bn-ph { color: #eec5a5; }
  .bom-node.slot.s .bn-ph { color: #a8dcbb; }
  .bom-node.slot .bn-sub { min-height: 0; }
  .bom-node.slot:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15,23,42,.16); }
  .bom-node.slot.hint { box-shadow: 0 0 0 4px rgba(37,99,235,.28); background: #eef4ff; }
  .bom-node.slot.over { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 24px rgba(37,99,235,.34); }
  .bom-node.slot.good { border-style: solid; border-color: #16a34a; background: #f0fdf4; animation: bomPop .3s ease-out; }
  .bom-node.slot.bad { border-style: solid; border-color: #dc2626; background: #fef2f2; animation: bomShake .34s; }
  @keyframes bomPop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes bomShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* 填好之后：只显示物料名称；已填的格子仍可拖动/点选，方便改放位置 */
  .bom-node.slot.filled { border-style: solid; cursor: grab; }
  .bom-node.slot.filled.m { border-color: var(--m-color); background: var(--m-bg); }
  .bom-node.slot.filled.b { border-color: var(--b-color); background: var(--b-bg); }
  .bom-node.slot.filled.s { border-color: var(--s-color); background: var(--s-bg); }
  .bom-node.slot.filled:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15,23,42,.16); }
  .bom-node.slot.filled:active { cursor: grabbing; }
  .bom-node.slot.filled .bn-sub { color: var(--ink); font-weight: 800; font-size: 18px; line-height: 1.2; }
  .bom-node.slot.filled.sel { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.28); }
  .bom-node.slot.filled.dragging { opacity: .35; }

  /* ---------- 卡池：一个料码一张卡；窄容器里排 5 列，宽容器里排 3 列 ---------- */
  .bom-pool { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; align-content: start; }
  @container (max-width: 1400px) { .bom-pool { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .bom-card {
    position: relative; width: 100%; min-height: 70px; border: 3px solid var(--line); border-radius: 11px;
    background: #fff; padding: 6px 8px; cursor: grab; user-select: none; -webkit-user-select: none;
    touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center;
    transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease;
  }
  .bom-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15,23,42,.15); }
  .bom-card.sel { box-shadow: 0 0 0 4px rgba(37,99,235,.38); transform: translateY(-2px); }
  .bom-card.dragging { opacity: .3; }
  /* 用量放完：置灰、不可拖 */
  .bom-card.used { opacity: .38; filter: grayscale(.75); cursor: default; }
  .bom-card.used:hover { transform: none; box-shadow: none; }
  .bom-card .bc-n { font-size: 25px; font-weight: 800; line-height: 1.15; letter-spacing: 1px; white-space: nowrap; }
  .bom-card .bc-need {
    position: absolute; top: -9px; right: -7px; font-size: 12px; font-weight: 800; color: #fff;
    background: #f59e0b; border-radius: 999px; padding: 1px 7px; box-shadow: 0 2px 6px rgba(245,158,11,.4);
  }
  .bom-card.used .bc-need { background: #94a3b8; box-shadow: none; }
  /* 卡左下角的"还剩几次 / 共用几次"计数 */
  .bom-card .bc-cnt {
    position: absolute; left: 7px; bottom: 2px; font-size: 12px; font-weight: 800;
    color: #94a3b8; font-variant-numeric: tabular-nums;
  }
  .bom-card.m { border-color: var(--m-color); background: var(--m-bg); }
  .bom-card.b { border-color: var(--b-color); background: var(--b-bg); }
  .bom-card.s { border-color: var(--s-color); background: var(--s-bg); }
  .bom-card.m .bc-n { color: var(--m-color); }
  .bom-card.b .bc-n { color: var(--b-color); }
  .bom-card.s .bc-n { color: var(--s-color); }
  .bom-ghost { position: fixed; z-index: 9999; pointer-events: none; opacity: .93; box-shadow: 0 16px 34px rgba(15,23,42,.3); transform: rotate(-3deg); }

  /* ---------- 结算 ---------- */
  .bom-res { margin-top: 18px; border-radius: 12px; padding: 16px 20px; font-size: 15px; line-height: 1.75; background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; display: none; }
  .bom-res.show { display: block; }
  .bom-res .br-line { font-size: 15px; margin-bottom: 6px; }
  .bom-res .br-stars { font-size: 25px; letter-spacing: 3px; color: #f59e0b; vertical-align: -3px; }
  .bom-res .br-total { font-size: 27px; font-weight: 800; color: #15803d; }
  .bom-res .br-brk { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 14px; color: #334155; margin: 4px 0 8px; }
  .bom-res .br-brk b { font-size: 16px; color: #14532d; }
  .br-ref { margin-top: 12px; font-size: 14px; }
  .br-ref > b { display: block; margin-bottom: 6px; }
  .br-ref table { border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; width: 100%; max-width: 720px; }
  .br-ref td { padding: 4px 10px; border-bottom: 1px solid #e8f5ec; }
  .br-ref .rname { font-weight: 700; color: var(--ink); }
  .br-ref .rcode { color: var(--muted); font-variant-numeric: tabular-nums; width: 88px; }
  .br-ref .rtype { width: 34px; text-align: center; font-weight: 800; }
  .br-ref .rtype.m { color: var(--m-color); }
  .br-ref .rtype.b { color: var(--b-color); }
  .br-ref .rtype.s { color: var(--s-color); }
  /* BOM-BUILD-CSS-END */

  /* ===================== ⑤ 仓库归类互动 ===================== */
  .whq-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
  .whq-score { font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #1e3a8a, #2563eb); border-radius: 10px; padding: 9px 18px; }
  .whq-score b { font-size: 22px; }
  .whq-count { font-size: 14px; color: var(--muted); }
  .whq-count b { font-size: 16px; color: var(--ink); }
  .whq-clock { font-size: 14px; color: var(--muted); }
  .whq-clock b { font-size: 18px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .whq-clock.on b { color: var(--m-color); }
  .whq-res .whq-line { font-size: 15px; margin-bottom: 6px; }
  .whq-res .whq-stars { font-size: 25px; letter-spacing: 3px; color: #f59e0b; vertical-align: -3px; }
  .whq-res .whq-total { font-size: 27px; font-weight: 800; color: #15803d; }
  .whq-res .whq-brk { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 14px; color: #334155; margin: 4px 0 8px; }
  .whq-res .whq-brk b { font-size: 16px; color: #14532d; }
  .whq-res .whq-verdict { margin-bottom: 8px; }
  .whq-btn { margin-left: auto; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 9px; padding: 8px 18px; }
  .whq-btn:hover { border-color: var(--m-color); color: var(--m-color); }
  .whq-tip { font-size: 14px; line-height: 1.65; border-radius: 9px; padding: 10px 14px; margin-bottom: 16px; background: #f1f5f9; color: #334155; border-left: 4px solid var(--m-color); }
  .whq-tip:empty { display: none; }        /* 开局没有提示行，只有判定反馈才出现 */
  .whq-tip.ok { background: #f0fdf4; border-left-color: #16a34a; color: #14532d; font-weight: 700; }
  .whq-tip.no { background: #fef2f2; border-left-color: #dc2626; color: #7f1d1d; }
  .whq-tip kbd { font-family: inherit; font-weight: 800; background: #fff; border: 1.5px solid #cbd5e1; border-radius: 5px; padding: 0 6px; margin: 0 1px; }
  .whq-pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 104px; padding: 12px; border: 2px dashed var(--line); border-radius: 12px; background: #fafbfd; margin-bottom: 16px; }
  .whq-none { font-size: 14px; color: var(--muted); align-self: center; }
  /* 待分类卡：只印物料名称，居中 + 放大字号。
     边框保持按物料属性配色（M 蓝 / B 橙 / S 绿）—— 课堂投影下 2px 会被自适应缩放压细，
     所以加粗到 3.5px 并配一层同色浅底，远看也能一眼分出属性。 */
  .whq-card {
    width: 176px; min-height: 88px; border: 3.5px solid var(--line); border-radius: 12px;
    background: #fff; padding: 10px 12px; cursor: grab;
    transition: transform .12s ease, box-shadow .12s ease;
    user-select: none; -webkit-user-select: none; touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  .whq-card:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(15,23,42,.14); }
  .whq-card.sel { border-color: #0f172a; box-shadow: 0 0 0 4px rgba(37,99,235,.38); transform: translateY(-2px); }
  .whq-card.dragging { opacity: .28; }
  .whq-card.m { border-color: var(--m-color); background: var(--m-bg); }
  .whq-card.b { border-color: var(--b-color); background: var(--b-bg); }
  .whq-card.s { border-color: var(--s-color); background: var(--s-bg); }
  .whq-card.m .whq-n { color: var(--m-color); }
  .whq-card.b .whq-n { color: var(--b-color); }
  .whq-card.s .whq-n { color: var(--s-color); }
  .whq-n { font-size: 29px; font-weight: 800; line-height: 1.16; text-align: center; letter-spacing: 1px; white-space: nowrap; }
  .whq-ghost { position: fixed; z-index: 9999; pointer-events: none; opacity: .93; box-shadow: 0 16px 34px rgba(15,23,42,.3); transform: rotate(-3deg); }
  /* 三个仓库：边框加粗到 4px 并按仓库配色，投影时一眼分得清三个框；
     注意 over / good / bad 三条要放在配色之后，拖拽高亮才不会被配色盖掉 */
  .whq-docks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .whq-dock {
    border: 4px solid var(--line); border-radius: 14px; background: #fff;
    padding: 12px 14px; min-height: 200px;
    box-shadow: 0 3px 12px rgba(15,23,42,.07);
    transition: border-color .12s ease, background .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .whq-dock.raw  { border-color: #d9a05b; background: linear-gradient(180deg, #fffaf2, #fff 42%); }
  .whq-dock.semi { border-color: #7ea6e8; background: linear-gradient(180deg, #f5f8ff, #fff 42%); }
  .whq-dock.fin  { border-color: #b58ad4; background: linear-gradient(180deg, #fbf6ff, #fff 42%); }
  .whq-dock.over { border-color: var(--m-color); background: #f7faff; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(37,99,235,.22); }
  .whq-dock.good { border-color: #16a34a; background: #f0fdf4; box-shadow: 0 0 0 4px rgba(22,163,74,.20); }
  .whq-dock.bad { border-color: #dc2626; background: #fef2f2; animation: whqShake .34s; }
  @keyframes whqShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  /* 仓库名放大、只留名字：代号做成小角标，原来是「代号 + 名称 + 一句说明」横排，说明已去掉 */
  .whq-dh { position: relative; display: flex; align-items: center; justify-content: center; padding-bottom: 9px; border-bottom: 2px solid var(--line); margin-bottom: 11px; }
  .whq-dh b { font-size: clamp(26px, 2.1vw, 34px); line-height: 1.15; letter-spacing: 1px; }
  .whq-dh i {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    font-style: normal; font-size: 17px; font-weight: 800; border-radius: 8px;
    padding: 3px 10px; background: #e2e8f0; color: #334155;
  }
  .whq-dock.raw .whq-dh b { color: #b45309; }      /* 01 原辅料仓：琥珀 */
  .whq-dock.semi .whq-dh b { color: #1d4ed8; }     /* 02 半成品仓：蓝 */
  .whq-dock.fin .whq-dh b { color: #7e22ce; }      /* 03 成品仓：紫 */
  .whq-dock.raw .whq-dh i  { background: #fdf0dc; color: #92400e; }
  .whq-dock.semi .whq-dh i { background: #e4edff; color: #1d4ed8; }
  .whq-dock.fin .whq-dh i  { background: #f3e8fd; color: #7e22ce; }
  .whq-list { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }
  /* 已入仓的物料：投影时最该看清的就是"进了仓的这几张卡"，名字给到和待分类卡接近的字号 */
  .whq-chip {
    font-size: 27px; font-weight: 800; line-height: 1.2; border-radius: 10px;
    padding: 7px 16px; min-width: 82px; text-align: center;
    background: #f0fdf4; color: #14532d; border: 2.5px solid #86efac;
    animation: whqPop .22s ease-out;
  }
  @keyframes whqPop { from { transform: scale(.72); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .whq-empty { font-size: 15px; color: #94a3b8; }
  .whq-res { margin-top: 18px; border-radius: 12px; padding: 16px 20px; font-size: 15px; line-height: 1.75; background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; display: none; }
  .whq-res.show { display: block; }
  .whq-res b { font-size: 18px; }


/* ===== iframe 整版视图：外层不再留白，子页面自己占满（避免外层 + 内层双滚动条） ===== */
#factoryView, #demoView, #figView { padding: 0; max-width: none; margin: 0; }
</style>
</head>

  <!-- ================= 物料分类小游戏（同文件内的独立页面） ================= -->
<div class="page view" id="gameView">
  <header>
    <h1><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-6px;"><path d="M6 11h4"/><path d="M8 9v4"/><path d="M15 12h.01"/><path d="M18 10h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg> 属性辨识 · 这件料谁来做？</h1>
  </header>

/* ===================== 音效（Web Audio 现场合成，不外链音频文件） =====================
   两个卡牌游戏答对 / 答错各一套提示音，教室后排也要听得清楚：
     答对 → 上行大三和弦琶音「叮-咚-叮铃」，亮、脆、一路向上；
     答错 → 低频木鱼「咚-咚」+ 带颤音的下滑锯齿「嗡～」，闷、低、往下坠。

    var g = c.createGain();

    var comp = null;

    osc.frequency.setValueAtTime(o.f, t0);

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol, t0 + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);

    var c = ac(); if (!c) return;
    var dest = bus(c);
    var t0 = c.currentTime + at, n = Math.max(1, Math.round(c.sampleRate * dur));
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

    var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
    var g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(dest);

    on: true,

      osc.start(t0); osc.stop(t0 + 0.62);

var DESIGN_W = 1900;
function fitScale() {
  if (window.__FIT_OFF__ || location.search.indexOf('fit=0') >= 0) return 1;
  var z = (window.innerWidth || DESIGN_W) / DESIGN_W;
  return Math.max(0.5, Math.min(2.5, z));
}
function applyFit() {
  var z = fitScale();
  window.__FITZ__ = z;
  document.body.style.zoom = (z === 1) ? '' : String(z);
  var btn = document.getElementById('nbFit');
  if (btn) {
    btn.textContent = window.__FIT_OFF__ ? '缩放 关闭' : '缩放 ' + Math.round(z * 100) + '%';
    btn.classList.toggle('off', !!window.__FIT_OFF__);
  }
}
document.getElementById('nbFit').addEventListener('click', function () {
  window.__FIT_OFF__ = !window.__FIT_OFF__;
  applyFit();
});
