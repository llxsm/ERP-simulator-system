     · 生产车间占地收敛成 4×4：等距屋顶高度＝(w+d)×16px，进深越大屋顶越高，
       屋顶一高就会盖住旁边建筑的名称牌 —— 4×4 刚好又好认又不挡人。
   这个排法是几何搜索 + 逐像素轮廓交叠复核选出来的：任意两栋（含屋顶、名称牌、烟囱）互不遮挡，
   且负责人从出生点能走到每一个门口。 */
const BUILD = [
  { id: 'buy',   name: '采购部',           gx: 3,  gy: 3,  w: 3, d: 3, h: 60, c: '#93a7c4', roof: '#7d90ad', style: 'office', floors: 3 },
  { id: 'shop1', name: '生产车间',         gx: 16, gy: 15, w: 4, d: 4, h: 54, c: '#5f8fd0', roof: '#4a72ab', style: 'workshop', saw: 4, props: ['chimney', 'crates'] },
  { id: 'vendor',name: '委外商 · 宏达注塑', gx: 9,  gy: 3,  w: 4, d: 3, h: 52, c: '#7fb98a', roof: '#63a173', style: 'vendor', saw: 3, props: ['chimney', 'tanks'] },
  { id: 'w1',    name: '01 原辅料仓',       gx: 2,  gy: 9,  w: 3, d: 3, h: 50, c: '#d9a05b', roof: '#b8834a', style: 'warehouse', props: ['barrels'] },
  { id: 'w2',    name: '02 半成品仓',       gx: 9,  gy: 9,  w: 3, d: 3, h: 50, c: '#e0a860', roof: '#bd8a4c', style: 'warehouse', props: ['pallets'] },
  { id: 'w3',    name: '03 成品仓',         gx: 16, gy: 9,  w: 3, d: 3, h: 50, c: '#c19ad4', roof: '#a37fb8', style: 'warehouse', props: ['boxes'] },
  { id: 'dock',  name: '发货口 · 客户华美商贸', gx: 7, gy: 15, w: 4, d: 2, h: 38, c: '#bfae8f', roof: '#a08d6f', style: 'dock', props: ['containers'] }
];

/* 作业表：mat 决定提前期与口径；need 是开工前置；out 是完工产出
   need/out 里的 wh 可取值：raw/semi/fin（仓库）或 st:<建筑id>（该处现场待加工料） */
const OPS = [
  { id: 'buy_al', site: 'buy', mat: '12310', name: '下采购订单 · 铝材 8000 g',
    need: [], out: [{ to: 'raw', code: '12310', qty: 8000 }] },
  { id: 'buy_pl', site: 'buy', mat: '12411', name: '下采购订单 · 塑料 400 kg',
    need: [], out: [{ to: 'raw', code: '12411', qty: 400 }] },
  { id: 'buy_fm', site: 'buy', mat: '12421', name: '下采购订单 · 薄膜 80 m',
    need: [], out: [{ to: 'raw', code: '12421', qty: 80 }] },
  { id: 'buy_jx', site: 'buy', mat: '11000', name: '下采购订单 · 机芯 400 个',
    need: [], out: [{ to: 'semi', code: '11000', qty: 400 }] },
  { id: 'buy_dc', site: 'buy', mat: '14000', name: '下采购订单 · 电池 800 节',
    need: [], out: [{ to: 'semi', code: '14000', qty: 800 }] },

  { id: 'iss_al', site: 'w1', mat: null, days: 0, cal: '自然日',
    name: '领料 · 铝材 8000 g 送零件车间',
    need: [{ wh: 'raw', code: '12310', qty: 8000 }],
    out: [{ to: 'st:shop1', code: '12310', qty: 8000 }] },
  { id: 'iss_fm', site: 'w1', mat: null, days: 0, cal: '自然日',
    name: '领料 · 薄膜 80 m 送零件车间',
    need: [{ wh: 'raw', code: '12421', qty: 80 }],
    out: [{ to: 'st:shop1', code: '12421', qty: 80 }] },
  { id: 'iss_p1', site: 'w1', mat: null, days: 0, cal: '自然日',
    name: '发料 · 塑料 200 kg 给宏达注塑（做盘体）',
    need: [{ wh: 'raw', code: '12411', qty: 200 }],
    out: [{ to: 'st:vendor', code: '12411', qty: 200 }] },
  { id: 'iss_p2', site: 'w1', mat: null, days: 0, cal: '自然日',
    name: '发料 · 塑料 200 kg 给宏达注塑（做钟框）',
    need: [{ wh: 'raw', code: '12411', qty: 200 }],
    out: [{ to: 'st:vendor', code: '12411', qty: 200 }] },

  { id: 'mk_zs', site: 'shop1', mat: '12100', name: '加工长针 · 短针 · 秒针',
    need: [{ wh: 'st:shop1', code: '12310', qty: 8000, by: 'iss_al' }],
    out: [{ to: 'semi', code: '12100', qty: 400 }, { to: 'semi', code: '12200', qty: 400 },
          { to: 'semi', code: '12300', qty: 400 }] },
  { id: 'mk_zf', site: 'shop1', mat: '12420', name: '加工字膜',
    need: [{ wh: 'st:shop1', code: '12421', qty: 80, by: 'iss_fm' }],
    out: [{ to: 'semi', code: '12420', qty: 1600 }] },

  { id: 'out_pt', site: 'vendor', mat: '12410', name: '委外注塑 · 盘体',
    need: [{ wh: 'st:vendor', code: '12411', qty: 200, by: 'iss_p1' }],
    out: [{ to: 'semi', code: '12410', qty: 400 }] },
  { id: 'out_zk', site: 'vendor', mat: '13000', name: '委外注塑 · 钟框',
    need: [{ wh: 'st:vendor', code: '12411', qty: 200, by: 'iss_p2' }],
    out: [{ to: 'semi', code: '13000', qty: 400 }] },

  /* 三个车间合并成一栋「生产车间」(site 都是 shop1)：零件加工 / 装配 / 总装都在这里做 */
  { id: 'as_pm', site: 'shop1', mat: '12400', name: '装配盘面',
    need: [{ wh: 'semi', code: '12410', qty: 400 }, { wh: 'semi', code: '12420', qty: 1600 }],
    out: [{ to: 'semi', code: '12400', qty: 400 }] },
  { id: 'as_zp', site: 'shop1', mat: '12000', name: '装配钟盘',
    need: [{ wh: 'semi', code: '12100', qty: 400 }, { wh: 'semi', code: '12200', qty: 400 },
           { wh: 'semi', code: '12300', qty: 400 }, { wh: 'semi', code: '12400', qty: 400 }],
    out: [{ to: 'semi', code: '12000', qty: 400 }] },

  { id: 'asm', site: 'shop1', mat: '10000', name: '总装 · 电子挂钟 400 台',
    need: [{ wh: 'semi', code: '11000', qty: 400 }, { wh: 'semi', code: '14000', qty: 800 },
           { wh: 'semi', code: '12000', qty: 400 }, { wh: 'semi', code: '13000', qty: 400 }],
    out: [{ to: 'fin', code: '10000', qty: 400 }] },

  { id: 'ship', site: 'dock', mat: null, days: 0, cal: '自然日', name: '发货给客户 · 400 台',
    need: [{ wh: 'fin', code: '10000', qty: 400 }],
    out: [{ to: 'cust', code: '10000', qty: 400 }] }
];
const OP_BY_ID = {};
OPS.forEach(function (o) { OP_BY_ID[o.id] = o; });

/* 倒排：NEED_BY[物料] = 这个料最晚必须哪天到位；OP_JIT[作业] = 它最晚哪天开工。
   链子从成品往下推：挂钟必须 09-26 到位 → 总装最晚开工 = 09-23 → 机芯/电池/钟盘/钟框 必须 09-23 到位 → …
   难点是「一个料码供多个父件」时要取**最早**的那个需求日（塑料 12411 同时供盘体和钟框），
   而谁先被算到取决于遍历顺序 —— 所以这里迭代到不动点，不依赖顺序。 */
const OP_JIT = {};
const NEED_BY = {};
(function computeJit() {
  NEED_BY['10000'] = DUE_IDX;
  const setN = function (code, d, flag) {
    if (NEED_BY[code] === undefined || d < NEED_BY[code]) { NEED_BY[code] = d; flag.changed = true; }
  };
  const setJ = function (id, d, flag) {
    if (OP_JIT[id] === undefined || d < OP_JIT[id]) { OP_JIT[id] = d; flag.changed = true; }
  };
  let iter = 0;
  while (iter++ < 60) {
    const flag = { changed: false };
    OPS.forEach(function (o) {
      if (o.mat === null) return;                     // 领料 / 发料 / 发货：由使用者决定
      const due = NEED_BY[o.mat];
      if (due === undefined) return;
      const m = MAT[o.mat];
      const jit = backOff(due, m.lead, m.cal);
      setJ(o.id, jit, flag);
      o.need.forEach(function (n) {
        if (n.by) {
          /* 现场待加工料：生产它的领料/发料作业必须与使用者同一天完成 */
          setJ(n.by, jit, flag);
          const p = OP_BY_ID[n.by];
          if (p) p.need.forEach(function (pn) { setN(pn.code, jit, flag); });
        } else {
          setN(n.code, jit, flag);
        }
      });
    });
    if (NEED_BY['10000'] !== undefined) setJ('ship', NEED_BY['10000'], flag);
    if (!flag.changed) break;
  }
})();

/* ===== 2. 日历纯函数 ===== */
function dayToDate(i) { const d = new Date(BASE); d.setDate(d.getDate() + i); return d; }
function dateToDay(d) { return Math.round((d - BASE) / 86400000); }
function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
function fmtDate(i) {
  const d = dayToDate(i);
  const wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2, '0') + ' 周' + wk;
}
function fmtShort(i) {
  const d = dayToDate(i);
  return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* 从某天往「后」推 lead 天得到完成日 */
function forward(dayIdx, lead, cal) {
  let d = dayIdx, added = 0;
  if (lead <= 0) return dayIdx;
  while (added < lead) {
    d++;
    if (cal === '工作日' && isWeekend(dayToDate(d))) continue;
    added++;
  }
  return d;
}
/* 从某天往「前」推 lead 天得到最晚开工日（与 forward 互逆） */
function backOff(dayIdx, lead, cal) {
  if (lead <= 0) return dayIdx;
  let d = dayIdx, added = 0;
  while (added < lead) {
    d--;
    if (cal === '工作日' && isWeekend(dayToDate(d))) continue;
    added++;
  }
  return d;
}

/* ===== 3. 游戏状态与规则（纯逻辑，不碰 DOM） ===== */
function newGame() {
  return {
    day: 0,
    inv: { raw: {}, semi: {}, fin: {} },
    st: {},                 // 现场待加工料：st[建筑id][code] = qty
    cust: {},               // 客户已收
    running: [],            // {id, start, end}
    done: [],               // {id, start, end}
    log: [],
    finished: false,
    fail: false
  };
}
function g_qty(G, where, code) {
  if (where === 'cust') return G.cust[code] || 0;
  if (where.indexOf('st:') === 0) {
    const s = G.st[where.slice(3)] || {};
    return s[code] || 0;
  }
  return G.inv[where][code] || 0;
}
function g_add(G, where, code, qty) {
  if (where === 'cust') { G.cust[code] = (G.cust[code] || 0) + qty; return; }
  if (where.indexOf('st:') === 0) {
    const k = where.slice(3);
    G.st[k] = G.st[k] || {};
    G.st[k][code] = (G.st[k][code] || 0) + qty;
    return;
  }
  G.inv[where][code] = (G.inv[where][code] || 0) + qty;
}
/* 前置是否齐备 —— 返回缺什么 */
function g_missing(G, op) {
  const miss = [];
  op.need.forEach(function (n) {
    if (g_qty(G, n.wh, n.code) + 1e-9 < n.qty) {
      miss.push({ code: n.code, where: n.wh, need: n.qty, have: g_qty(G, n.wh, n.code) });
    }
  });
  return miss;
}
function g_isRunning(G, opId) { return G.running.some(function (r) { return r.id === opId; }); }
function g_isDone(G, opId) { return G.done.some(function (r) { return r.id === opId; }); }
/* 该作业现在能不能开工 */
function g_can(G, opId) {
  const op = OP_BY_ID[opId];
  if (!op || G.finished) return false;
  if (g_isDone(G, opId)) return false;
  if (g_isRunning(G, opId)) return false;
  return g_missing(G, op).length === 0;
}
/* 开工 */
function g_start(G, opId) {
  if (!g_can(G, opId)) return { ok: false, why: '前置未齐备或已做过' };
  const op = OP_BY_ID[opId];
  /* 扣前置 */
  op.need.forEach(function (n) { g_add(G, n.wh, n.code, -n.qty); });
  const days = (op.days !== undefined) ? op.days : MAT[op.mat].lead;
  const cal = op.cal || MAT[op.mat].cal;
  const end = forward(G.day, days, cal);
  const rec = { id: opId, start: G.day, end: end };
  if (days === 0) {
    op.out.forEach(function (o) { g_add(G, o.to, o.code, o.qty); });
    G.done.push(rec);
    G.log.push({ day: G.day, kind: 'done', text: op.name + '（即时完成）' });
  } else {
    G.running.push(rec);
    G.log.push({ day: G.day, kind: 'start', text: op.name + ' 开工，' + cal + ' ' + days + ' 天，预计 ' + fmtShort(end) + ' 完成' });
  }
  /* 交货即达成目标，本局结束 */
  if ((G.cust['10000'] || 0) >= 400) { G.finished = true; G.fail = false; }
  return { ok: true, rec: rec };
}
/* 推进一天：结算当天完成的作业 */
function g_nextDay(G) {
  if (G.finished) return [];
  G.day++;
  const msgs = [];
  const still = [];
  G.running.forEach(function (r) {
    if (r.end <= G.day) {
      const op = OP_BY_ID[r.id];
      op.out.forEach(function (o) { g_add(G, o.to, o.code, o.qty); });
      G.done.push(r);
      const txt = op.name + ' 完成 → ' + op.out.map(function (o) {
        return (o.to === 'cust' ? '客户' : o.to.indexOf('st:') === 0 ? '现场' : WH[o.to].name) +
          ' ' + MAT[o.code].name + ' ' + fq(o.code, o.qty);
      }).join('、');
      msgs.push(txt);
      G.log.push({ day: G.day, kind: 'done', text: txt });
    } else still.push(r);
  });
  G.running = still;
  /* 交期当天仍可发货；只有过了 09-26 还没交出去才算失败 */
  if ((G.cust['10000'] || 0) >= 400) G.finished = true;
  else if (G.day > DUE_IDX) { G.finished = true; G.fail = true; }
  return msgs;
}
/* 计分 */
function g_score(G) {
  const ship = G.done.filter(function (r) { return r.id === 'ship'; })[0];
  const shipped = (G.cust['10000'] || 0) >= 400;
  const lateBy = shipped ? Math.max(0, (ship ? ship.end : G.day) - DUE_IDX) : Math.max(1, G.day - DUE_IDX);
  let earlyPen = 0;
  const rows = [];
  OPS.forEach(function (o) {
    const rec = G.done.concat(G.running).filter(function (r) { return r.id === o.id; })[0];
    const jit = OP_JIT[o.id];
    let early = 0, late = 0;
    if (rec) {
      early = Math.max(0, jit - rec.start - 1);          // 提前 1 天不罚
      late = Math.max(0, rec.start - jit);
      earlyPen += early * 2;
    }
    rows.push({ op: o, jit: jit, start: rec ? rec.start : null, end: rec ? rec.end : null, early: early, late: late });
  });
  const earlyCap = Math.min(70, earlyPen);
  let score;
  if (shipped) {
    score = Math.max(0, Math.round(100 - lateBy * 25 - earlyCap));
  } else {
    /* 没交付属于硬伤：不论其它做得多好，分数封顶 35 */
    score = Math.min(35, Math.max(0, Math.round(100 - lateBy * 25 - earlyCap)));
  }
  return { score: score, shipped: shipped, lateBy: lateBy, earlyPen: earlyCap, rows: rows };
}
function fq(code, qty) {
  const m = MAT[code] || { unit: '' };
  const v = Math.round(qty * 100) / 100;
  if (m.unit === 'g' && v >= 1000) return (v / 1000) + ' kg';
  return v + ' ' + m.unit;
}
/* 实时「预计得分」：开局应是 100，只随「提前开工」与「超期」往下掉。
   注意不能用 g_score —— 那个在还没发货时会按"未交付"封顶，开局就会显示 35。 */
function g_liveScore(G) {
  const sc = g_score(G);
  if (sc.shipped) return sc.score;
  const over = Math.max(0, G.day - DUE_IDX);
  return Math.max(0, Math.round(100 - sc.earlyPen - over * 25));
}

/* ===== 4. 等距渲染 ===== */
const TW = 64, TH = 32, OX = 720, OY = 130;
const cvs = document.getElementById('map');
const ctx = cvs.getContext('2d');
const GRID_W = 28, GRID_H = 20;

function iso(gx, gy) { return { x: (gx - gy) * (TW / 2) + OX, y: (gx + gy) * (TH / 2) + OY }; }
function unIso(x, y) {
  const dx = x - OX, dy = y - OY;
  return { gx: (dx / (TW / 2) + dy / (TH / 2)) / 2, gy: (dy / (TH / 2) - dx / (TW / 2)) / 2 };
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r * f)));
  g = Math.max(0, Math.min(255, Math.round(g * f)));
  b = Math.max(0, Math.min(255, Math.round(b * f)));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* 建筑占地格集合 */
const BLOCK = {};
BUILD.forEach(function (b) {
  for (let x = b.gx; x < b.gx + b.w; x++) for (let y = b.gy; y < b.gy + b.d; y++) BLOCK[x + ',' + y] = b.id;
});
function buildAt(gx, gy) {
  const id = BLOCK[Math.floor(gx) + ',' + Math.floor(gy)];
  return id ? BUILD.filter(function (b) { return b.id === id; })[0] : null;
}
function walkable(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return false;
  return !BLOCK[Math.floor(gx) + ',' + Math.floor(gy)];
}
/* 建筑门口：占地正下方那格 */
function doorOf(b) { return { gx: b.gx + Math.floor(b.w / 2), gy: b.gy + b.d }; }

/* ---------- 绘图基元 ---------- */
function pt(gx, gy, dz) { const p = iso(gx, gy); return { x: p.x, y: p.y - (dz || 0) }; }
function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
/* 建筑脚下的铺装（在 drawGround 里统一画，避免近处建筑盖住远处的地面） */
function paving(gx, gy, w, d, color) {
  const g = 0.55;
  poly([pt(gx - g, gy - g), pt(gx + w + g, gy - g), pt(gx + w + g, gy + d + g), pt(gx - g, gy + d + g)], color);
}
/* 墙体：SE 面朝右下（右墙），SW 面朝左下（左墙），两面都可见 */
function walls(b) {
  const h = b.h;
  poly([pt(b.gx + b.w, b.gy, 0), pt(b.gx + b.w, b.gy + b.d, 0),
        pt(b.gx + b.w, b.gy + b.d, h), pt(b.gx + b.w, b.gy, h)], shade(b.c, 0.72), 'rgba(15,23,42,.22)');
  poly([pt(b.gx, b.gy + b.d, 0), pt(b.gx + b.w, b.gy + b.d, 0),
        pt(b.gx + b.w, b.gy + b.d, h), pt(b.gx, b.gy + b.d, h)], shade(b.c, 0.9), 'rgba(15,23,42,.22)');
}
/* 在 SE 面上贴片：gy ∈ [a,bb]，高度 ∈ [z0,z1] */
function onSE(b, a, bb, z0, z1, fill, stroke) {
  poly([pt(b.gx + b.w, a, z0), pt(b.gx + b.w, bb, z0), pt(b.gx + b.w, bb, z1), pt(b.gx + b.w, a, z1)], fill, stroke);
}
/* 在 SW 面上贴片：gx ∈ [a,bb]，高度 ∈ [z0,z1] */
function onSW(b, a, bb, z0, z1, fill, stroke) {
  poly([pt(a, b.gy + b.d, z0), pt(bb, b.gy + b.d, z0), pt(bb, b.gy + b.d, z1), pt(a, b.gy + b.d, z1)], fill, stroke);
}
/* 仓库卷帘门：宽门 + 横向条纹 */
function rollerDoor(b, a, bb, zTop) {
  onSW(b, a, bb, 0, zTop, '#8a93a1', 'rgba(15,23,42,.3)');
  for (let z = 3; z < zTop - 2; z += 4.5) {
    poly([pt(a, b.gy + b.d, z), pt(bb, b.gy + b.d, z), pt(bb, b.gy + b.d, z + 1.6), pt(a, b.gy + b.d, z + 1.6)],
         'rgba(255,255,255,.16)');
  }
  onSW(b, a, bb, zTop, zTop + 2.5, shade(b.roof, 0.8), 'rgba(15,23,42,.3)');
}
/* 车间双开大门 */
function bigDoor(b, a, bb, zTop) {
  onSW(b, a, bb, 0, zTop, '#3f4653', 'rgba(15,23,42,.35)');
  const mid = (a + bb) / 2;
  poly([pt(mid, b.gy + b.d, 0), pt(mid, b.gy + b.d, zTop)], null, 'rgba(255,255,255,.28)', 1.2);
  onSW(b, a, bb, zTop, zTop + 2.6, shade(b.roof, 0.82), 'rgba(15,23,42,.3)');
}
/* 仓库坡屋顶：屋脊沿 gy 方向 */
function gableRoof(b, rh) {
  const xm = b.gx + b.w / 2, y0 = b.gy, y1 = b.gy + b.d, h = b.h;
  poly([pt(b.gx + b.w, y0, h), pt(b.gx + b.w, y1, h), pt(xm, y1, h + rh), pt(xm, y0, h + rh)],
       shade(b.roof, 1.06), 'rgba(15,23,42,.25)');
  poly([pt(b.gx, y1, h), pt(b.gx + b.w, y1, h), pt(xm, y1, h + rh)], shade(b.roof, 0.8), 'rgba(15,23,42,.25)');
  poly([pt(xm, y0, h + rh), pt(xm, y1, h + rh)], null, 'rgba(255,255,255,.45)', 2);
}
/* 车间锯齿屋顶：一排斜屋面 + 天窗 + 端头锯齿剖面 */
function sawRoof(b, n, rh) {
  const step = b.d / n, h = b.h;
  for (let i = 0; i < n; i++) {
    const yA = b.gy + i * step, yB = yA + step;
    poly([pt(b.gx, yA, h + rh), pt(b.gx + b.w, yA, h + rh), pt(b.gx + b.w, yB, h), pt(b.gx, yB, h)],
         i % 2 ? shade(b.roof, 1.09) : shade(b.roof, 0.97), 'rgba(15,23,42,.22)');
    poly([pt(b.gx, yA, h + rh), pt(b.gx + b.w, yA, h + rh), pt(b.gx + b.w, yA, h + rh - 4), pt(b.gx, yA, h + rh - 4)],
         'rgba(186,222,248,.95)');
  }
  const zig = [pt(b.gx + b.w, b.gy, h)];
  for (let i = 0; i < n; i++) {
    zig.push(pt(b.gx + b.w, b.gy + i * step, h + rh));
    zig.push(pt(b.gx + b.w, b.gy + (i + 1) * step, h));
  }
  poly(zig, shade(b.roof, 0.66), 'rgba(15,23,42,.25)');
}
/* 办公楼平顶 + 女儿墙 */
function flatRoof(b, para) {
  const h = b.h, p = para || 3.5;
  poly([pt(b.gx, b.gy, h), pt(b.gx + b.w, b.gy, h), pt(b.gx + b.w, b.gy + b.d, h), pt(b.gx, b.gy + b.d, h)],
       shade(b.roof, 1.05), 'rgba(15,23,42,.2)');
  poly([pt(b.gx, b.gy, h), pt(b.gx + b.w, b.gy, h), pt(b.gx + b.w, b.gy, h + p), pt(b.gx, b.gy, h + p)], shade(b.roof, .92));
  poly([pt(b.gx, b.gy + b.d, h), pt(b.gx + b.w, b.gy + b.d, h), pt(b.gx + b.w, b.gy + b.d, h + p), pt(b.gx, b.gy + b.d, h + p)], shade(b.roof, .78));
  poly([pt(b.gx + b.w, b.gy, h), pt(b.gx + b.w, b.gy + b.d, h), pt(b.gx + b.w, b.gy + b.d, h + p), pt(b.gx + b.w, b.gy, h + p)], shade(b.roof, .84));
}
/* 烟囱 */
function chimney(gx, gy, hh, c) {
  const s = 0.55;
  poly([pt(gx + s, gy, 0), pt(gx + s, gy + s, 0), pt(gx + s, gy + s, hh), pt(gx + s, gy, hh)], shade(c, .68));
  poly([pt(gx, gy + s, 0), pt(gx + s, gy + s, 0), pt(gx + s, gy + s, hh), pt(gx, gy + s, hh)], shade(c, .86));
  poly([pt(gx, gy, hh), pt(gx + s, gy, hh), pt(gx + s, gy + s, hh), pt(gx, gy + s, hh)], shade(c, 1.08));
  /* 冒烟：三团不同相位的烟，边升边散边淡 */
  for (let i = 0; i < 3; i++) {
    const ph = (T * 0.3 + i * 0.34) % 1;
    const r = 2.6 + ph * 7.5;
    const sway = Math.sin((T * 0.9 + i * 1.7) * 1.7) * 5 * ph;
    const cp = pt(gx + s / 2, gy + s / 2, hh + 5 + ph * 32);
    ctx.beginPath();
    ctx.arc(cp.x + sway, cp.y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(228,234,242,' + (0.5 * (1 - ph)).toFixed(3) + ')';
    ctx.fill();
  }
}
/* 小方箱：托盘 / 料箱 / 集装箱 */
function crate(gx, gy, w, d, hh, c) {
  const b2 = { gx: gx, gy: gy, w: w, d: d, h: hh, c: c };
  walls(b2);
  poly([pt(gx, gy, hh), pt(gx + w, gy, hh), pt(gx + w, gy + d, hh), pt(gx, gy + d, hh)], shade(c, 1.06), 'rgba(15,23,42,.2)');
}
/* 油罐 */
function tank(gx, gy, r, hh, c) {
  const p = pt(gx, gy, 0);
  ctx.beginPath();
  ctx.moveTo(p.x - r, p.y - hh); ctx.lineTo(p.x + r, p.y - hh);
  ctx.lineTo(p.x + r, p.y); ctx.lineTo(p.x - r, p.y);
  ctx.closePath(); ctx.fillStyle = shade(c, .88); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x, p.y - hh, r, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = shade(c, 1.12); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = shade(c, .74); ctx.fill();
}
/* 货车 */
function truck(gx, gy) {
  crate(gx + 1.4, gy + 0.2, 2.6, 1.5, 26, '#eef2f7');
  crate(gx, gy + 0.2, 1.5, 1.5, 18, '#cfd8e3');
  [[gx + 0.35, gy + 1.72], [gx + 2.1, gy + 1.72], [gx + 3.15, gy + 1.72]].forEach(function (wp) {
    const p = pt(wp[0], wp[1], 1);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 4.6, 2.7, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1f2937'; ctx.fill();
  });
}
/* 名称牌 */
function namePlate(b, hot, extra) {
  const c = iso(b.gx + b.w / 2, b.gy + b.d / 2);
  const s = iso(b.gx + b.w, b.gy + b.d);
  ctx.font = '700 15px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
  const tw = ctx.measureText(b.name).width;
  const ly = s.y - b.h - 26;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(c.x - tw / 2 - 11, ly - 17, tw + 22, 25, 8);
  else ctx.rect(c.x - tw / 2 - 11, ly - 17, tw + 22, 25);
  ctx.fillStyle = hot ? '#fff7e6' : 'rgba(255,255,255,.93)';
  ctx.fill();
  ctx.strokeStyle = hot ? '#f59e0b' : 'rgba(15,23,42,.16)';
  ctx.lineWidth = hot ? 2 : 1; ctx.stroke();
  ctx.fillStyle = '#1f2937'; ctx.textAlign = 'center';
  ctx.fillText(b.name, c.x, ly + 1);
  if (extra) {
    ctx.font = '700 12.5px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#b45309';
    ctx.fillText(extra, c.x, ly + 28);
  }
}

function drawGround() {
  /* 草地棋盘 */
  for (let gx = 0; gx < GRID_W; gx++) {
    for (let gy = 0; gy < GRID_H; gy++) {
      const p = iso(gx, gy);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + TW / 2, p.y + TH / 2);
      ctx.lineTo(p.x, p.y + TH);
      ctx.lineTo(p.x - TW / 2, p.y + TH / 2);
      ctx.closePath();
      ctx.fillStyle = ((gx + gy) % 2 === 0) ? '#cfe0d4' : '#c7d9cd';
      ctx.fill();
    }
  }
  /* 厂区道路：两条横向（沿 gx）+ 三条纵向（沿 gy），自动避开建筑占地 */
  const road = function (gx0, gy0, len, dir) {
    for (let i = 0; i < len; i++) {
      const gx = gx0 + (dir === 'h' ? i : 0), gy = gy0 + (dir === 'h' ? 0 : i);
      if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) continue;
      if (BLOCK[gx + ',' + gy]) continue;
      const p = iso(gx, gy);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + TW / 2, p.y + TH / 2);
      ctx.lineTo(p.x, p.y + TH); ctx.lineTo(p.x - TW / 2, p.y + TH / 2);
      ctx.closePath();
      ctx.fillStyle = (i % 2 === 0) ? '#c6c2b7' : '#bfbbb0';
      ctx.fill();
      /* 路中虚线 */
      if (i % 3 === 0) {
        ctx.beginPath();
        ctx.moveTo(p.x - 3, p.y + TH / 2 - 1.5); ctx.lineTo(p.x + 3, p.y + TH / 2 + 1.5);
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  };
  road(0, 6, 28, 'h');  road(0, 7, 28, 'h');     /* 上排（采购部 / 委外商）与三仓之间的横向厂道 */
  road(0, 12, 28, 'h'); road(0, 13, 28, 'h');    /* 三仓门前 / 下排（生产车间 · 发货口）的横向厂道 */
  road(0, 0, 20, 'v');  road(1, 0, 20, 'v');
  road(6, 0, 20, 'v');  road(14, 0, 20, 'v');    /* 01｜02 仓之间、委外商｜03 仓之间的纵向厂道 */
  road(21, 0, 20, 'v'); road(22, 0, 20, 'v');    /* 生产车间右侧，通到发货口 */
  road(0, 19, 28, 'h');                       /* 最前排的出厂道路（发货口的货车从这里驶出） */
  /* 各建筑脚下铺装 */
  BUILD.forEach(function (b) {
    const s = b.style;
    const col = s === 'vendor' ? '#c9bda4' : s === 'dock' ? '#a9aeb4' : s === 'office' ? '#c8ccd2' : '#c9cdc6';
    paving(b.gx, b.gy, b.w, b.d, col);
  });
  /* 委外商在厂外，再铺一层土黄（位置随 BUILD 里的 vendor 走） */
  const vb = BUILD.filter(function (b) { return b.style === 'vendor'; })[0];
  if (vb) paving(vb.gx - 0.6, vb.gy - 0.6, vb.w + 1.2, vb.d + 1.2, '#cdc0a6');
}
/* ===== 4b. 建筑细节件（都在既有墙面上叠画，不动原来的结构） ===== */
/* 墙裙：贴地一圈深色 + 一道压光，让建筑"坐"在地上而不是浮着 */
function plinth(b, z) {
  onSW(b, b.gx, b.gx + b.w, 0, z, 'rgba(15,23,42,.17)');
  onSE(b, b.gy, b.gy + b.d, 0, z, 'rgba(15,23,42,.23)');
  poly([pt(b.gx, b.gy + b.d, z), pt(b.gx + b.w, b.gy + b.d, z),
        pt(b.gx + b.w, b.gy + b.d, z + 0.9), pt(b.gx, b.gy + b.d, z + 0.9)], 'rgba(255,255,255,.17)');
  poly([pt(b.gx + b.w, b.gy, z), pt(b.gx + b.w, b.gy + b.d, z),
        pt(b.gx + b.w, b.gy + b.d, z + 0.9), pt(b.gx + b.w, b.gy, z + 0.9)], 'rgba(255,255,255,.10)');

/* 檐口：墙顶一圈压线，交代墙和屋顶的交接 */
function cornice(b, z0, z1) {

  poly([pt(b.gx, b.gy + b.d, z1), pt(b.gx + b.w, b.gy + b.d, z1),
        pt(b.gx + b.w, b.gy + b.d, z1 + 1.1), pt(b.gx, b.gy + b.d, z1 + 1.1)], 'rgba(15,23,42,.17)');

/* 带框窗：外框 + 玻璃 + 中梃 + 上沿高光 + 窗台（原来是一块光板玻璃） */
function winSW(b, a, bb, z0, z1, glass, frame) {

function winSE(b, a, bb, z0, z1, glass, frame) {
  const fr = frame || 'rgba(203,213,225,.95)';
  onSE(b, a - 0.07, bb + 0.07, z0 - 0.5, z1 + 0.5, fr, 'rgba(15,23,42,.3)');
  onSE(b, a, bb, z0, z1, glass || '#bcd9f7');
  const mid = (z0 + z1) / 2;
  poly([pt(b.gx + b.w, a, mid - 0.22), pt(b.gx + b.w, bb, mid - 0.22),

        pt(b.gx + b.w, bb, z1), pt(b.gx + b.w, a, z1)], 'rgba(255,255,255,.17)');

/* 坡屋顶：屋脊压顶 + 屋面斜向分格 */
function ridgeCap(b, rh) {
  const xm = b.gx + b.w / 2, h = b.h;
  for (let k = 1; k <= 4; k++) {
    const u = k / 9;
    const x = b.gx + b.w * (1 - u), hh = h + rh * 2 * u;
    poly([pt(x, b.gy, hh), pt(x + 0.05, b.gy, hh),
          pt(x + 0.05, b.gy + b.d, hh), pt(x, b.gy + b.d, hh)], 'rgba(15,23,42,.10)');
  }

        pt(xm + 0.3, b.gy + b.d, h + rh), pt(xm - 0.3, b.gy + b.d, h + rh)], shade(b.roof, 1.26));

/* 屋顶小方箱（水箱 / 空调外机）：坐在 z0 高度上 */
function roofBox(gx, gy, w, d, z0, hh, c) {
  const t = z0 + hh;
  poly([pt(gx + w, gy, z0), pt(gx + w, gy + d, z0), pt(gx + w, gy + d, t), pt(gx + w, gy, t)],
       shade(c, .72), 'rgba(15,23,42,.25)');

       shade(c, .92), 'rgba(15,23,42,.25)');

/* 平屋顶上一小簇设备，别让屋顶空着 */
function roofKit(b) {

/* ===== 5. 角色与寻路 ===== */
const SPEED = 6.4;                      // 格 / 秒（走快一点，课堂不磨蹭）
/* 负责人出生点：厂道交叉口，任何一版厂区布局下都站得住（新布局下不能落在生产车间里） */
const HERO_HOME = { fx: 4, fy: 6 };
let hero = { fx: HERO_HOME.fx, fy: HERO_HOME.fy, tx: HERO_HOME.fx, ty: HERO_HOME.fy, path: [], bob: 0, wait: null };
let facing = 1;

function bfs(from, to) {
  const key = p => p.gx + ',' + p.gy;
  const start = { gx: Math.round(from.gx), gy: Math.round(from.gy) };
  const goal = { gx: Math.round(to.gx), gy: Math.round(to.gy) };
  if (!walkable(goal.gx, goal.gy)) return null;
  const q = [start], prev = {}; prev[key(start)] = null;
  const D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (q.length) {
    const cur = q.shift();
    if (cur.gx === goal.gx && cur.gy === goal.gy) {
      const out = []; let c = cur;
      while (c) { out.unshift(c); c = prev[key(c)]; }
      return out;
    }
    for (const d of D) {
      const nx = cur.gx + d[0], ny = cur.gy + d[1];
      if (!walkable(nx, ny)) continue;
      const k = nx + ',' + ny;
      if (k in prev) continue;
      prev[k] = cur; q.push({ gx: nx, gy: ny });
    }
  }
  return null;
}
function goTo(gx, gy, onArrive) {
  const p = bfs({ gx: hero.fx, gy: hero.fy }, { gx: gx, gy: gy });
  if (!p) return false;
  hero.path = p.slice(1);
  hero.onArrive = onArrive || null;
  return true;
}
function stepHero(dt) {
  if (!hero.path.length) {
    if (hero.onArrive) { const f = hero.onArrive; hero.onArrive = null; f(); }
    return;
  }
  const n = hero.path[0];
  const dx = n.gx - hero.fx, dy = n.gy - hero.fy;
  const dist = Math.hypot(dx, dy);
  const step = SPEED * (typeof speedMul === 'number' ? speedMul : 1) * dt;
  if (dist <= step) { hero.fx = n.gx; hero.fy = n.gy; hero.path.shift(); hero.bob += 1.1; }
  else { hero.fx += dx / dist * step; hero.fy += dy / dist * step; hero.bob += 6 * dt; }
  hero.mv = T;                                   /* 记下「这一帧真的动了」 */
  if (Math.abs(dx) > 1e-6) facing = dx > 0 ? 1 : -1;
}

/* ---------- 连续方向键移动 ----------
   方向键 / WASD 是「屏幕方向」，按 iso 投影换算成网格方向，按住就一直走，不再一格一格跳。
   上＝(gx-1, gy-1)、下＝(+1,+1)、左＝(-1,+1)、右＝(+1,-1)；两个键同时按会自动合成斜向。 */
const KEYDIR = {
  arrowup: [-1, -1], arrowdown: [1, 1], arrowleft: [-1, 1], arrowright: [1, -1],
  w: [-1, -1], s: [1, 1], a: [-1, 1], d: [1, -1]
};
const held = {};
/* 角色有体积，四角都要能站 */
function canStand(fx, fy) {
  const r = 0.36;
  const pts = [[0, 0], [-r, -r], [r, -r], [-r, r], [r, r], [-r, 0], [r, 0], [0, -r], [0, r]];
  for (let i = 0; i < pts.length; i++) {
    if (!walkable(Math.floor(fx + pts[i][0]), Math.floor(fy + pts[i][1]))) return false;
  }
  return true;
}
function stepInput(dt) {
  let vx = 0, vy = 0;
  Object.keys(held).forEach(function (k) {
    if (!held[k]) return;
    const v = KEYDIR[k];
    if (v) { vx += v[0]; vy += v[1]; }
  });
  if (!vx && !vy) return false;
  const len = Math.hypot(vx, vy);
  vx /= len; vy /= len;
  const step = SPEED * (typeof speedMul === 'number' ? speedMul : 1) * dt;
  const nx = hero.fx + vx * step, ny = hero.fy + vy * step;
  /* 点建筑寻路会把角色正好停在门口那一格（整数坐标），而门口格正上方就是建筑，
     于是 canStand(自己) 已经是 false —— 四个方向全判不过，键盘就被卡死，
     只能靠鼠标再点一下地图、由寻路（stepHero 不查 canStand）把人带出来。
     这里补一条兜底：人已经卡住时，只要落点格子本身可走就放行，让他能自己走出来。 */
  const wedged = !canStand(hero.fx, hero.fy);
  if (wedged && walkable(Math.floor(nx), Math.floor(ny))) { hero.fx = nx; hero.fy = ny; }
  else if (canStand(nx, ny)) { hero.fx = nx; hero.fy = ny; }
  else if (canStand(nx, hero.fy)) { hero.fx = nx; }        /* 贴着墙滑 */
  else if (canStand(hero.fx, ny)) { hero.fy = ny; }
  else return true;                                        /* 顶死了，但输入确实存在 */
  hero.bob += 6 * dt;
  hero.mv = T;                                             /* 键盘移动同样要记，否则只有鼠标点的时候才有走路动画 */
  const sx = vx - vy;                                      /* 屏幕左右 = gx - gy 方向 */
  if (sx > 0.05) facing = 1; else if (sx < -0.05) facing = -1;
  hero.path = []; hero.onArrive = null;                    /* 手动接管，取消点击寻路 */
  return true;
}
/* 走到建筑附近才能进去 */
function distToBuild(b, gx, gy) {
  const cx = Math.max(b.gx, Math.min(gx, b.gx + b.w));
  const cy = Math.max(b.gy, Math.min(gy, b.gy + b.d));
  return Math.hypot(gx - cx, gy - cy);
}
function nearbyBuilding() {
  let best = null, bd = 1.7;
  BUILD.forEach(function (b) {
    const d = distToBuild(b, hero.fx, hero.fy);
    if (d < bd) { bd = d; best = b; }
  });
  return best;
}
function tryEnter() {
  if (document.getElementById('modal').classList.contains('show')) return;
  if (document.getElementById('planModal').classList.contains('show')) return;
  const b = nearbyBuilding();
  if (!b) { logLine('附近没有建筑 —— 走近一点再按 Enter / Z'); return; }
  openSite(b);
}
/* 负责人：工装 + 反光条 + 安全帽 + 手脚摆动，站定时有轻微呼吸起伏 */
function drawHero() {
  const p = iso(hero.fx, hero.fy);
  /* 走路动画看「最近有没有真的移动过」，不能看 hero.path ——
     键盘移动时 stepInput 会主动清空 path，用 path 判断就永远不动 */
  const walking = (T - (hero.mv === undefined ? -9 : hero.mv)) < 0.12;
  const sw = walking ? Math.sin(hero.bob * 1.9) : 0;          /* 手脚摆动相位 */
  const bob = walking ? Math.abs(Math.sin(hero.bob * 1.9)) * 2.6
                      : Math.sin(T * 1.5) * 0.8;              /* 站着也在轻轻起伏 */
  const by = p.y + 13 - bob;                                   /* 脚底 */
  const f = facing >= 0 ? 1 : -1;                              /* 朝向：整体镜像 */

  /* 落地阴影：外圈淡、内圈实 */
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 13, 13.5, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15,23,42,.15)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 13, 8.4, 3.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15,23,42,.20)'; ctx.fill();

  /* 腿（深色工装裤）+ 鞋 */
  const hipY = by - 16, legSw = sw * 3.4;
  [[-3.5, legSw], [3.5, -legSw]].forEach(function (L) {
    const x0 = p.x + L[0], x1 = x0 + L[1] * f;
    ctx.beginPath();
    ctx.moveTo(x0 - 2.7, hipY); ctx.lineTo(x0 + 2.7, hipY);
    ctx.lineTo(x1 + 2.4, by - 1.6); ctx.lineTo(x1 - 2.4, by - 1.6);
    ctx.closePath();
    ctx.fillStyle = '#374151'; ctx.fill();
    ctx.strokeStyle = 'rgba(15,23,42,.34)'; ctx.lineWidth = .8; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x1, by - 1.2, 3.5, 1.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#111827'; ctx.fill();
  });

  /* 手臂（工装袖 + 手），先画，让肩部被身子压住 */
  const shY = by - 33, armSw = -sw * 3.0;
  [[-7.4, armSw], [7.4, -armSw]].forEach(function (A) {
    const x0 = p.x + A[0], x1 = x0 + A[1] * f;
    ctx.beginPath();
    ctx.moveTo(x0 - 2.3, shY); ctx.lineTo(x0 + 2.3, shY);
    ctx.lineTo(x1 + 1.9, shY + 15); ctx.lineTo(x1 - 1.9, shY + 15);
    ctx.closePath();
    ctx.fillStyle = '#1d4ed8'; ctx.fill();
    ctx.strokeStyle = 'rgba(15,23,42,.3)'; ctx.lineWidth = .8; ctx.stroke();
    ctx.beginPath(); ctx.arc(x1, shY + 16, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = '#f5d0a9'; ctx.fill();
  });

  /* 身子：工装外套（竖向渐变）+ 黄色反光条 + 腰带 + 中缝 */
  ctx.beginPath();
  ctx.moveTo(p.x - 8.3, by - 15);
  ctx.lineTo(p.x + 8.3, by - 15);
  ctx.lineTo(p.x + 7.2, by - 34);
  ctx.quadraticCurveTo(p.x, by - 37.5, p.x - 7.2, by - 34);
  ctx.closePath();
  const grad = ctx.createLinearGradient(p.x - 8, 0, p.x + 8, 0);
  grad.addColorStop(0, '#3b82f6'); grad.addColorStop(.55, '#2563eb'); grad.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(15,23,42,.34)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p.x - 7.7, by - 22.4); ctx.lineTo(p.x + 7.7, by - 22.4);
  ctx.lineTo(p.x + 7.75, by - 25.2); ctx.lineTo(p.x - 7.75, by - 25.2);
  ctx.closePath(); ctx.fillStyle = 'rgba(253,224,71,.9)'; ctx.fill();

  ctx.beginPath(); ctx.moveTo(p.x, by - 34); ctx.lineTo(p.x, by - 15);
  ctx.strokeStyle = 'rgba(15,23,42,.20)'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p.x - 8.1, by - 15); ctx.lineTo(p.x + 8.1, by - 15);
  ctx.lineTo(p.x + 8.1, by - 12.4); ctx.lineTo(p.x - 8.1, by - 12.4);
  ctx.closePath(); ctx.fillStyle = '#1e293b'; ctx.fill();

  /* 头 + 头发 + 眼睛 */
  const hy = by - 41;
  ctx.beginPath(); ctx.arc(p.x, hy, 8.2, 0, Math.PI * 2);
  ctx.fillStyle = '#f7d9b5'; ctx.fill();
  ctx.strokeStyle = '#d0a377'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(p.x, hy - 1.4, 8.2, Math.PI * 1.04, Math.PI * 1.96);
  ctx.fillStyle = '#3f3f46'; ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.beginPath(); ctx.arc(p.x + f * 1.4 - 2.7, hy + 1.5, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + f * 1.4 + 2.7, hy + 1.5, 1.1, 0, Math.PI * 2); ctx.fill();

  /* 安全帽：帽壳 + 帽檐 + 帽顶高光 + 帽箍 */
  ctx.beginPath(); ctx.arc(p.x, hy - 2.2, 9, Math.PI, Math.PI * 2);
  ctx.fillStyle = '#f59e0b'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x, hy - 2.2, 11.8, 3.1, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#d97706'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x, hy - 3.2, 6.6, 2.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.x - 8.6, hy - 2.4); ctx.lineTo(p.x + 8.6, hy - 2.4);
  ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 1; ctx.stroke();
}

/* ---------- 左上角「今日计划」浮牌 ----------
   数据全部取自倒排计划：OP_JIT[作业] 是最晚开工日，G.day 是今天。
     · 今天的计划单：OP_JIT === 今天且还没做的作业（就是课本答案）
     · 已经欠着的：今天已经过了倒排日、却还没做也没在做的作业 —— 红色顶格提示
   渲染很便宜，任何会改变进度的地方（开工 / 推进一天 / 重来）都调一次。 */
function renderPlanPanel() {
  const el = document.getElementById('planPanel');
  if (!el) return;
  const hd = '<div class="pp-h"><b>' + fmtDate(G.day) + '</b>今日计划<em>倒排 · 共 ' +
    OPS.length + ' 项作业</em></div>';
  if (G.finished) {
    el.innerHTML = hd + '<div class="pp-empty">' +
      (G.fail ? '已到交期，这一局没能按时交货 —— 按「重来」再排一次。'
              : '400 台已经交出去了，这一局完成 ✓　按「重来」可以再排一次。') + '</div>';
    return;
  }
  const late = [], today = [];
  OPS.forEach(function (o) {
    if (OP_JIT[o.id] > G.day) return;
    if (g_isDone(G, o.id)) return;
    if (g_isRunning(G, o.id)) return;
    (OP_JIT[o.id] < G.day ? late : today).push(o);
  });
  late.sort(function (a, b) { return OP_JIT[a.id] - OP_JIT[b.id]; });
  today.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
  let left = 0;
  OPS.forEach(function (o) { if (!g_isDone(G, o.id)) left++; });
  const rows = late.map(function (o) {
    return rowHTML(o, '晚 ' + (G.day - OP_JIT[o.id]) + ' 天', 'late');
  }).concat(today.map(function (o) {
    return rowHTML(o, g_can(G, o.id) ? '可开工' : '等前置', 'today');
  }));
  const MAX = 6;
  el.innerHTML = hd + rows.slice(0, MAX).join('') +
    (rows.length > MAX ? '<div class="pp-more">… 还有 ' + (rows.length - MAX) + ' 项要在今天开工</div>' : '') +
    '<div class="pp-more">今天该开工 <b>' + rows.length + '</b> 项　·　到交期还剩 ' +
      Math.max(0, DUE_IDX - G.day) + ' 天　·　未完成共 ' + left + ' 项</div>';
}

/* ---------- 作业面板 ---------- */
let curSite = null;
/* ---------- 作业面板的键盘选择 ----------
   面板打开时，↑ ↓（W / S 同义）在「当前可开工」的作业之间移动高亮并自动折返，
   Enter / Z 执行选中的那一条；已禁用条目（已完成 / 进行中 / 前置未齐）自动跳过。
   ← → （A / D）在面板打开时不再移动角色，避免一边看面板一边把负责人走开。 */
let shSelOp = null;              /* 当前高亮的作业 id —— 重新渲染后尽量还原 */
function shBtns() { return Array.prototype.slice.call(document.querySelectorAll('#shOps .op[data-op]')); }
function shUsable() { return shBtns().filter(function (b) { return !b.disabled; }); }
function shPaint() {
  shBtns().forEach(function (b) { b.classList.toggle('sel', b.dataset.op === shSelOp); });
  const sheet = document.getElementById('sheet');
  const cur = shBtns().filter(function (b) { return b.dataset.op === shSelOp; })[0];
  if (!cur || !sheet) return;
  const top = cur.offsetTop, h = cur.offsetHeight;     /* offsetParent 就是 .sheet，可直接比 scrollTop */
  if (top < sheet.scrollTop) sheet.scrollTop = top - 4;
  else if (top + h > sheet.scrollTop + sheet.clientHeight) sheet.scrollTop = top + h - sheet.clientHeight + 4;
}
function shMove(step) {
  const ids = shUsable().map(function (b) { return b.dataset.op; });
  if (!ids.length) { shSelOp = null; shPaint(); return; }
  const i = ids.indexOf(shSelOp);
  shSelOp = ids[i < 0 ? 0 : (i + step + ids.length) % ids.length];
  shPaint();
}
function shConfirm() {
  const cur = shUsable().filter(function (b) { return b.dataset.op === shSelOp; })[0];
  if (!cur) { logLine('这里现在没有能开工的作业 —— 看看前置件到齐没，或者这条作业是不是已经在做了'); return; }
  doOp(shSelOp);
}

function openSite(b) {
  curSite = b;
  const ops = siteOps(b.id);
  const sh = document.getElementById('sheet');
  document.getElementById('shTitle').textContent = b.name;
  const shSub = document.getElementById('shSub');
  if (!ops.length) {
    shSub.textContent = '这里没有可执行的作业 —— 点它旁边的仓或车间看看。';
    document.getElementById('shOps').innerHTML = '<div class="empty">（纯信息建筑）</div>';
  } else {
    shSub.innerHTML = showJit
      ? '已开启标注：每个作业都标出了<b>倒排最晚开工日</b>和「还有几天」。'
      : '在今天（<b>' + fmtDate(G.day) + '</b>）可以开工的作业。忘了某个料该哪天开工？点顶部的 <b>📋 计划查询</b> 查 ERP 里排好的计划。';
    document.getElementById('shOps').innerHTML = ops.map(function (o) {
      const can = g_can(G, o.id);
      const done = g_isDone(G, o.id);
      const run = g_isRunning(G, o.id);
      const miss = g_missing(G, o);
      const jit = OP_JIT[o.id];
      const onTime = jit === G.day;
      const late = G.day > jit;
      const days = (o.days !== undefined) ? o.days : MAT[o.mat].lead;
      const cal = o.cal || MAT[o.mat].cal;
      let cls = 'op', tag = '';
      if (done) { cls += ' ok'; tag = '<span class="tag on">已完成</span>'; }
      else if (run) { cls += ' ok'; tag = '<span class="tag on">进行中</span>'; }
      else if (!can) { cls += ' locked'; tag = '<span class="tag off">前置未齐</span>'; }
      else if (showJit) {
        if (onTime) { cls += ' jit'; tag = '<span class="tag jit">● 就是今天</span>'; }
        else if (late) { cls += ' late'; tag = '<span class="tag off">已晚 ' + (G.day - jit) + ' 天</span>'; }
        else tag = '<span class="tag jit">还有 ' + (jit - G.day) + ' 天</span>';
      }
      const info = done || run ? '' :
        (days === 0 ? '即时完成（领料 / 发料 / 发货）'
                    : '提前期 ' + days + ' ' + cal + '　→　今天开工，' + fmtShort(forward(G.day, days, cal)) + ' 到位');
      const jitLine = showJit ? '倒排最晚开工 <b>' + fmtShort(jit) + '</b>（' + fmtDate(jit).slice(-2) + '）　' : '';
      const missTxt = (!can && !done && !run) ? miss.map(function (x) {
        return '缺 ' + MAT[x.code].name + '（需 ' + fq(x.code, x.need) + '，现有 ' + fq(x.code, x.have) + '）';
      }).join('；') : '';
      return '<button class="' + cls + '" data-op="' + o.id + '"' + ((!can || done || run) ? ' disabled' : '') + '>' +
        '<span class="r1"><span class="n">' + o.name + '</span>' + tag + '</span>' +
        '<span class="r2">' + jitLine + (info || missTxt || '') + '</span></button>';
    }).join('');
  }
  sh.classList.add('show');
  /* 把面板放到建筑旁边，并夹在画布内，避免跑到画面外或被裁切 */
  const dp = iso(b.gx + b.w / 2, b.gy + b.d / 2);
  let left = dp.x + 34, top = dp.y - 190;
  if (left + 452 > cvs.width) left = dp.x - 486;
  left = Math.max(10, Math.min(left, cvs.width - 450));
  top = Math.max(72, Math.min(top, cvs.height - 340));
  sh.style.left = left + 'px';
  sh.style.top = top + 'px';
  document.querySelectorAll('#shOps .op[data-op]').forEach(function (b2) {
    b2.addEventListener('click', function () { doOp(b2.dataset.op); });
    /* 鼠标划过也更新高亮，键鼠混用不会出现两处高亮 */
    if (!b2.disabled) b2.addEventListener('mouseenter', function () { shSelOp = b2.dataset.op; shPaint(); });
  });
  /* 键盘高亮：优先还原上一次选中的作业，否则落在第一条可开工的作业上 */
  const usable = shUsable();
  if (!usable.some(function (b2) { return b2.dataset.op === shSelOp; })) {
    shSelOp = usable.length ? usable[0].dataset.op : null;
  }
  /* 面板一开就让负责人停下，免得他还按着方向键继续走 */
  Object.keys(held).forEach(function (k2) { held[k2] = 0; });
  shPaint();
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  curSite = null;
  /* 面板可能是用鼠标点 ✕ 关掉的，那个按钮还留着焦点 —— 顺手交还给 document，
     这样关完面板立刻就能用方向键走路，不用先拿鼠标点一下。 */
  const a = document.activeElement;
  if (a && a !== document.body && typeof a.blur === 'function') a.blur();
}

function doOp(opId) {
  const op = OP_BY_ID[opId];
  const jit = OP_JIT[opId];
  const res = g_start(G, opId);
  if (!res.ok) { logLine('✗ ' + op.name + ' 开不了工：' + res.why, 'no'); return; }
  const late = G.day > jit;
  const early = Math.max(0, jit - G.day - 1);
  let msg = op.name + ' 已开工';
  if (res.rec.end === G.day) msg += '（当场完成）';
  else msg += '，预计 ' + fmtShort(res.rec.end) + ' 完成';
  if (late) msg += '　⚠ 比倒排日晚 ' + (G.day - jit) + ' 天，会拖交期';
  else if (early > 0) msg += '　（比倒排日早 ' + early + ' 天，占库存）';
  else if (G.day === jit) msg += '　✓ 正好踩在倒排日';
  logLine(msg, late ? 'no' : '');
  /* 小动画：即时作业当场冒浮字；发货则让月台的货车开走 */
  const siteB = BUILD.filter(function (b) { return b.id === op.site; })[0];
  if (siteB && res.rec.end === G.day) {
    fxFloat(op.name.split('·')[0].trim() + ' 完成',
      siteB.gx + siteB.w / 2, siteB.gy + siteB.d / 2, late ? '#b45309' : '#2563eb');
  }
  if (opId === 'ship' && siteB) {
    fxShip();
    fxFloat('已发货 400 台 → 客户', siteB.gx + siteB.w / 2, siteB.gy + siteB.d / 2, '#15803d');
  }
  renderAll();
  if (autoState === 'off') openSite(curSite || siteB);   /* 自动演示时不弹面板，免得挡住厂区 */
  /* 发货一完成，本局即达成目标，等一下让货车开出去再弹结算 */
  if (G.finished) setTimeout(showModal, opId === 'ship' ? 1600 : 450);
}

/* ===== 7. 主循环与输入 ===== */
let lastT = 0, T = 0;                    // T = 全局动画时钟（秒）
/* ---------- 小动画 ---------- */
const FX = {
  truck: { phase: 'parked', t: 0 },      // parked 停在月台 → leaving 驶出厂门 → arriving 空车驶回
  floats: [],                            // 完工浮字：{text,gx,gy,z,life,color}
  day: { t: 0 }                          // 1 → 0：推进一天时的日夜过渡
};
function fxShip() { FX.truck.phase = 'leaving'; FX.truck.t = 0; }
function fxFloat(text, gx, gy, color) {
  FX.floats.push({ text: text, gx: gx, gy: gy, z: 0, life: 1.9, color: color || '#15803d' });
}
function stepFx(dt) {
  const tr = FX.truck;
  if (tr.phase === 'leaving') { tr.t += dt * 0.55; if (tr.t >= 1) { tr.phase = 'arriving'; tr.t = 0; } }
  else if (tr.phase === 'arriving') { tr.t += dt * 0.55; if (tr.t >= 1) { tr.phase = 'parked'; tr.t = 0; } }
  FX.floats.forEach(function (f) { f.life -= dt; f.z += dt * 26; });
  FX.floats = FX.floats.filter(function (f) { return f.life > 0; });
  if (FX.day.t > 0) FX.day.t = Math.max(0, FX.day.t - dt / 1.5);
}
/* 日夜过渡：推进一天时压一层暮色再亮回来，中间打出新日期 —— 让"过了一天"看得见 */
function drawDayNight() {
  if (FX.day.t <= 0) return;
  const p = 1 - FX.day.t;                        // 0 → 1
  const a = Math.sin(p * Math.PI);               // 两端 0、中间最暗
  ctx.fillStyle = 'rgba(15,23,42,' + (a * 0.56).toFixed(3) + ')';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  /* 一轮日月走过的弧线 */
  const arcR = 150, cx = cvs.width / 2, cy = cvs.height * 0.62;
  ctx.beginPath();
  ctx.arc(cx, cy, arcR, Math.PI * 1.15, Math.PI * 1.85);
  ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.22).toFixed(3) + ')';
  ctx.lineWidth = 2; ctx.stroke();
  const ang = Math.PI * (1.15 + 0.7 * p);
  ctx.beginPath();
  ctx.arc(cx + Math.cos(ang) * arcR, cy + Math.sin(ang) * arcR, 15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(253,224,71,' + (a * 0.95).toFixed(3) + ')';
  ctx.fill();
  /* 新日期 */
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '800 62px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(fmtDate(G.day), cvs.width / 2, cvs.height / 2 - 6);
  ctx.font = '700 22px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#cbd5e1';
  ctx.fillText(isWeekend(dayToDate(G.day)) ? '周末 · 自制件不推进，采购 / 委外照走' : '新的一天', cvs.width / 2, cvs.height / 2 + 38);
  ctx.globalAlpha = 1;
}
/* 「按 Enter 进入」提示 */
function drawEnterHint() {
  if (curSite || G.finished || autoState === 'running') return;
  const nb = nearbyBuilding();
  if (!nb) return;
  const p = iso(nb.gx + nb.w / 2, nb.gy + nb.d / 2);
  const y = p.y - nb.h - 36;

  if (ctx.roundRect) ctx.roundRect(p.x - w / 2 - 12, y - 16, w + 24, 26, 8);
  else ctx.rect(p.x - w / 2 - 12, y - 16, w + 24, 26);
  ctx.fillStyle = 'rgba(245,158,11,.96)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,53,15,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#1f2937'; ctx.textAlign = 'center';
  ctx.fillText(txt, p.x, y + 3);
}
function truckOffset() {
  const tr = FX.truck;
  if (tr.phase === 'leaving') return tr.t * 32;
  if (tr.phase === 'arriving') return (tr.t - 1) * 32;
  return 0;
}
/* 完工浮字 */
function drawFloats() {
  FX.floats.forEach(function (f) {
    const p = pt(f.gx, f.gy, 18 + f.z);
    ctx.font = '800 15px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    const w = ctx.measureText(f.text).width;
    ctx.globalAlpha = Math.min(1, f.life / 0.7);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x - w / 2 - 11, p.y - 16, w + 22, 24, 8);
    else ctx.rect(p.x - w / 2 - 11, p.y - 16, w + 22, 24);
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    ctx.strokeStyle = f.color; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, p.x, p.y + 1);
    ctx.globalAlpha = 1;
  });
}
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  T += dt;
  /* 自动演示时不让方向键抢控制权 */
  if (autoState === 'running') stepHero(dt);
  else if (!stepInput(dt)) stepHero(dt);
  stepFx(dt);
  draw();
  requestAnimationFrame(loop);
}
function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  drawGround();
  /* 建筑按 gx+gy 深度排序 */
  const list = BUILD.slice().sort(function (a, b) {
    return (a.gx + a.gy) - (b.gx + b.gy) || a.gx - b.gx;
  });
  /* 角色 / 货车 / 建筑一起按深度排序，保证遮挡关系正确 */
  const items = list.map(function (b) { return { depth: (b.gx + b.gy) + 1.4, kind: 'b', b: b }; });
  items.push({ depth: hero.fx + hero.fy, kind: 'h' });
  const dockB = BUILD.filter(function (b) { return b.id === 'dock'; })[0];
  const toff = truckOffset();
  if (dockB && Math.abs(toff) < 26) {
    const tgx = dockB.gx + 0.6 + toff, tgy = dockB.gy + dockB.d + 0.7;
    items.push({ depth: tgx + tgy + 5.6, kind: 't', gx: tgx, gy: tgy });
  }
  items.sort(function (a, b) { return a.depth - b.depth; });
  items.forEach(function (it) {
    if (it.kind === 'b') drawBuilding(it.b, it.b === hotBuild);
    else if (it.kind === 'h') drawHero();
    else truck(it.gx, it.gy);
  });
  /* 在制气泡：同一建筑上有多个作业时依次往上排，避免叠在一起看不见 */
  const bySite = {};
  G.running.forEach(function (r) {
    const op = OP_BY_ID[r.id];
    (bySite[op.site] = bySite[op.site] || []).push(r);
  });
  Object.keys(bySite).forEach(function (sid) {
    const b = BUILD.filter(function (x) { return x.id === sid; })[0];
    if (!b) return;
    const dp = iso(b.gx + b.w / 2, b.gy + b.d / 2);
    bySite[sid].forEach(function (r, i) {
      const op = OP_BY_ID[r.id];
      const y = dp.y - b.h - 34 - i * 28;
      const total = Math.max(1, r.end - r.start);
      const pct = Math.min(1, Math.max(0, (G.day - r.start) / total));
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(dp.x - 44, y - 11, 88, 21, 9); else ctx.rect(dp.x - 44, y - 11, 88, 21);
      ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
      ctx.strokeStyle = 'rgba(37,99,235,.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(dp.x - 40, y - 7, 80 * pct, 13, 6); else ctx.rect(dp.x - 40, y - 7, 80 * pct, 13);
      ctx.fillStyle = '#2563eb'; ctx.fill();
      ctx.font = '700 13px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#1f2937'; ctx.textAlign = 'center';
      const short = op.name.replace(/^[^·]*·\s*/, '');
      ctx.fillText(short + ' 余' + Math.max(0, r.end - G.day) + '天', dp.x, y - 16);
    });
  });
  drawFloats();
  drawEnterHint();
  drawDayNight();
}
function pickBuild(x, y) {
  /* 从近到远命中测试：先看名字牌与屋顶区域，再看占地格 */
  const u = unIso(x, y);
  const b = buildAt(u.gx, u.gy);
  if (b) return b;
  /* 屋顶抬高的部分：把点往下平移建筑高度再试 */
  for (const bb of BUILD) {
    const u2 = unIso(x, y + bb.h);
    if (Math.floor(u2.gx) >= bb.gx && Math.floor(u2.gx) < bb.gx + bb.w &&
        Math.floor(u2.gy) >= bb.gy && Math.floor(u2.gy) < bb.gy + bb.d) return bb;
  }
  return null;
}
cvs.addEventListener('mousemove', function (e) {

  const y = (e.clientY - r.top) * (cvs.height / r.height);
  mouse = { x: x, y: y };
  const b = pickBuild(x, y);

});
cvs.addEventListener('click', function (e) {

    if (!goTo(d.gx, d.gy, function () { openSite(b); })) {

      goTo(b.gx + 1, b.gy + b.d + 1, function () { openSite(b); });

});
document.addEventListener('keydown', function (e) {
  const planOpen = document.getElementById('planModal').classList.contains('show');
  const resOpen = document.getElementById('modal').classList.contains('show');
  const k = (e.key || '').toLowerCase();
  /* X / Shift / Esc：退出作业界面 */
  if (k === 'escape' || k === 'x' || e.key === 'Shift') {
    if (resOpen) {                                   /* 结算页：Esc / X 可关，Shift 不关（防误触） */
      if (k !== 'shift') document.getElementById('modal').classList.remove('show');
      return;
    }
    if (planOpen) { document.getElementById('planModal').classList.remove('show'); return; }
    if (curSite) { closeSheet(); return; }
    return;
  }
  if (resOpen || planOpen) return;
  /* 作业面板打开时：↑↓（W/S）选作业，Enter / Z 执行，←→（A/D）不移动角色 */
  if (curSite) {
    if (k === 'arrowup' || k === 'w') { e.preventDefault(); shMove(-1); return; }
    if (k === 'arrowdown' || k === 's') { e.preventDefault(); shMove(1); return; }
    if (k === 'arrowleft' || k === 'arrowright' || k === 'a' || k === 'd') { e.preventDefault(); return; }
    if (k === 'enter' || k === 'z') { e.preventDefault(); shConfirm(); return; }
  }
  /* 空格：推进一天 */
  if (k === ' ' || k === 'spacebar') { e.preventDefault(); nextDay(); return; }
  /* Enter / Z：进入附近的建筑 */
  if (k === 'enter' || k === 'z') { e.preventDefault(); tryEnter(); return; }
  /* P：计划查询 */
  if (k === 'p') { e.preventDefault(); document.getElementById('bPlan').click(); return; }
  /* 方向键 / WASD：连续移动 */
  if (KEYDIR[k]) { e.preventDefault(); held[k] = 1; }
});

const AUTO_SPEED = 0.7;      // 比手动慢：6.4 × 0.7 ≈ 4.5 格/秒，投影上也看得清
const AUTO_GAP = 1300;       // 两个作业之间停顿
const AUTO_DAY = 1600;       // 推进一天之前的停顿
let autoState = 'off';       // off | running | paused
let autoTimer = null, speedMul = 1;
function updAutoBtn() {
  const b = document.getElementById('bAuto');
  b.classList.remove('playing', 'paused');
  if (autoState === 'running') { b.textContent = '⏸ 暂停演示'; b.classList.add('playing'); }

function resumeAuto() {

function autoTick() {
  if (autoState !== 'running') return;
  if (G.finished) { stopAuto(); showModal(); return; }
  /* 已到倒排日、前置齐备的作业：按倒排日先后做，领料/发料优先（先解锁后续） */
  const ready = OPS.filter(function (o) { return OP_JIT[o.id] <= G.day && g_can(G, o.id); });
  if (ready.length) {
    ready.sort(function (a, b) {
      const d = OP_JIT[a.id] - OP_JIT[b.id];
      if (d) return d;
      return (a.mat === null ? 0 : 1) - (b.mat === null ? 0 : 1);
    });
    const op = ready[0];
    const b = BUILD.filter(function (x) { return x.id === op.site; })[0];
    const days = (op.days !== undefined) ? op.days : MAT[op.mat].lead;
    const cal = op.cal || MAT[op.mat].cal;
    autoBar(fmtShort(G.day) + '　负责人走到 <em>' + b.name + '</em>，执行 <em>' + op.name + '</em>' +
      (days === 0 ? '（即时完成）' : '　→　' + fmtShort(forward(G.day, days, cal)) + ' 完工'));
    const dr = doorOf(b);
    const go = function () {
      if (autoState !== 'running') return;
      doOp(op.id);
      autoBar(fmtShort(G.day) + '　已完成 <em>' + op.name + '</em>' +
        (days === 0 ? '' : '，' + fmtShort(forward(G.day, days, cal)) + ' 完工'));
      autoTimer = setTimeout(autoTick, AUTO_GAP);
    };
    if (!goTo(dr.gx, dr.gy, go)) { go(); }
    return;
  }
  /* 今天没有该开工的作业 → 推进一天 */
  if (G.day >= DUE_IDX) { stopAuto(); showModal(); return; }
  const nx = G.day + 1;
  autoBar(fmtShort(G.day) + '　今天没有该开工的作业，时间往后走');
  autoTimer = setTimeout(function () {
    if (autoState !== 'running') return;
    nextDay();
    if (G.finished || autoState !== 'running') { if (autoState === 'running') stopAuto(); return; }
    autoTimer = setTimeout(autoTick, 450);
  }, AUTO_DAY);
}

function renderPlanTable() {
  const rows = OPS.slice().sort(function (a, b) {

  rows.forEach(function (o, i) {
    const m = o.mat ? MAT[o.mat] : null;
    const days = (o.days !== undefined) ? o.days : (m ? m.lead : 0);
    const cal = o.cal || (m ? m.cal : '自然日');
    const jit = OP_JIT[o.id];
    const due = days === 0 ? jit : forward(jit, days, cal);
    const doneR = G.done.filter(function (r) { return r.id === o.id; })[0];
    const runR = G.running.filter(function (r) { return r.id === o.id; })[0];
    const rec = doneR || runR;
    const dd = dayToDate(jit);
    const wk = ['日', '一', '二', '三', '四', '五', '六'][dd.getDay()];
    const isWk = isWeekend(dd);
    let st = '<span class="st">未做</span>';
    if (doneR) st = '<span class="st ok">✓ 已完成</span>';

    if (rec && rec.start > jit) {
      st = '<span class="st lt">⚠ 晚 ' + (rec.start - jit) + ' 天' + (doneR ? '' : '（在制）') + '</span>';
    } else if (rec && rec.start < jit) {
      st += ' <span class="st er">早 ' + (jit - rec.start) + ' 天</span>';
    }
    let cls = doneR ? 'done' : ((!rec && jit === G.day) ? 'now' : '');
    const where = BUILD.filter(function (x) { return x.id === o.site; })[0];
    h += '<tr class="' + cls + '"><td>' + (i + 1) + '</td>' +
      '<td><b>' + o.name + '</b><br><span style="color:#94a3b8;font-size:11.5px">' + where.name + '</span></td>' +
      '<td>' + (days === 0 ? '即时' : days + ' 天') + '</td>' +
      '<td>' + cal + '</td>' +
      '<td class="d' + (isWk ? ' wk' : '') + '">' + fmtShort(jit) + ' 周' + wk + '</td>' +
      '<td>' + fmtShort(due) + '</td>' +
      '<td>' + (rec ? fmtShort(rec.start) : '—') + '</td>' +
      '<td>' + st + '</td></tr>';
  });
  document.getElementById('planTable').innerHTML = h + '</tbody>';
}

  .stage li.s .badge { background: var(--s-color); }

  .stage .arrow-next {
    position: absolute;
    top: 50%; right: -17px;
    width: 0; height: 0;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 13px solid #c7cdd8;
    transform: translateY(-50%);
    z-index: 2;
  }
  @media (max-width: 820px) { .stage .arrow-next { display: none; } }

  /* 组装方程式 */
  .assembly {
    margin-top: 12px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    font-size: 15px;
  }
  .assembly .eq { margin-bottom: 9px; }
  .assembly .arrow { color: var(--muted); margin: 0 5px; }
  .chip {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 6px;
    margin: 2px 2px;
    font-size: 14px;
    white-space: nowrap;
  }
  .chip.m { background: var(--m-bg); color: var(--m-color); }
  .chip.b { background: var(--b-bg); color: var(--b-color); }
  .chip.s { background: var(--s-bg); color: var(--s-color); }

  /* ===== BOM 树 ===== */
  .tree-scroll { overflow-x: auto; }
  .tree-wrap {
    position: relative;
    margin: 0 auto;
  }
  .tree-wrap svg { position: absolute; top: 0; left: 0; }
  .tnode {
    position: absolute;
    width: 120px;
    min-height: 76px;
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
    cursor: pointer;
    border: 2px solid;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tnode:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.15); }
  .tnode.m { border-color: var(--m-color); }
  .tnode.b { border-color: var(--b-color); }
  .tnode.s { border-color: var(--s-color); }
  .tnode .tname { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .tnode.m .tname { color: var(--m-color); }
  .tnode.b .tname { color: var(--b-color); }
  .tnode.s .tname { color: var(--s-color); }
  .tnode .tcode { font-size: 13px; color: var(--muted); }
  .tnode .tqty { font-size: 13px; color: var(--ink); }
  .cal { display: block; font-size: 12px; font-weight: 600; color: #475569; }
  .tnode .ttype {
    position: absolute; top: -10px; right: 8px;
    font-size: 12px; font-weight: 800; color: #fff;
    padding: 1px 8px; border-radius: 8px;
  }
  .tnode.m .ttype { background: var(--m-color); }
  .tnode.b .ttype { background: var(--b-color); }
  .tnode.s .ttype { background: var(--s-color); }

  /* 高亮路径 */
  .tnode.dim { opacity: .22; }
  .tnode.hl { z-index: 5; box-shadow: 0 0 0 4px rgba(37,99,235,.18); }
  .tree-wrap svg path { transition: opacity .12s ease; }
  .tree-wrap svg path.dim { opacity: .12; }
  .tree-wrap svg path.hl { opacity: 1; stroke-width: 2.6; }

  /* 详情面板 */
  #detail {
    margin-top: 16px;
    border-radius: 10px;
    background: #f8fafc;
    border: 1px solid var(--line);
    padding: 16px 20px;
    font-size: 16px;
    min-height: 46px;
    display: none;
  }
  #detail .d-title { font-weight: 700; font-size: 19px; }
  #detail .d-m { color: var(--m-color); }
  #detail .d-b { color: var(--b-color); }
  #detail .d-s { color: var(--s-color); }

  /* ===== 物料清单表 ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  th { background: #f3f4f6; color: var(--muted); font-weight: 600; font-size: 14px; }
  tr:hover td { background: #fafbfd; }
  .row-m { color: var(--m-color); font-weight: 600; }
  .row-b { color: var(--b-color); font-weight: 600; }
  .row-s { color: var(--s-color); font-weight: 600; }
  .tag { font-size: 13px; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 4px; }
  .tag.m { background: var(--m-color); }
  .tag.b { background: var(--b-color); }
  .tag.s { background: var(--s-color); }

  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 10px; }

  /* ===== 完整生产流程演示 ===== */
  .flow-demo .stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .flow-demo .step-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .flow-demo .step-module { font-size: 13px; color: var(--muted); margin-top: 0; }
  .flow-demo .btn {
    font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    font-weight: 600; transition: .12s ease; font-family: inherit;
  }
  .flow-demo .btn:hover:not(:disabled) { border-color: var(--m-color); color: var(--m-color); }
  .flow-demo .btn:disabled { opacity: .4; cursor: not-allowed; }
  .flow-demo .btn.primary { background: var(--m-color); color: #fff; border-color: var(--m-color); }
  .flow-demo .btn.primary:hover:not(:disabled) { background: #1d4ed8; color: #fff; }
  .flow-demo .btn.playing { background: #16a34a; border-color: #16a34a; color: #fff; }
  .flow-demo .btn.playing:hover:not(:disabled) { color: #fff; border-color: #16a34a; }
  /* 同屏演示生效时按钮变实心，避免老师分不清当前是不是同屏状态 */
  .flow-demo .btn.on { background: #0f172a; border-color: #0f172a; color: #fff; }
  .flow-demo .btn.on:hover:not(:disabled) { color: #fff; border-color: #0f172a; }
  .flow-demo select.btn { appearance: none; padding: 7px 12px; }

  .flow-progress { height: 5px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin-bottom: 5px; }
  .flow-progress i { display: block; height: 100%; width: 0; background: var(--m-color); transition: width .3s ease; }
  .flow-progress i.done { background: #16a34a; }

  /* 步骤导航点（可点击跳转） */
  .step-nav { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
  .step-nav b {
    font-weight: 600; font-size: 11px; padding: 1px 8px; border-radius: 20px; cursor: pointer;
    background: #f1f5f9; color: #64748b; border: 1px solid transparent;
    transition: .12s ease; white-space: nowrap;
  }
  .step-nav b:hover { border-color: #94a3b8; color: #334155; }
  .step-nav b.done { background: #dcfce7; color: #15803d; }
  .step-nav b.active { background: var(--m-color); color: #fff; box-shadow: 0 2px 7px rgba(37,99,235,.35); }
  /* 放不下时只显示当前步骤，避免占掉看板高度 */
  .step-nav.compact b:not(.active):not(:hover) { display: none; }
  .step-nav.compact { flex-wrap: nowrap; overflow-x: auto; }
  .step-nav.compact::before {
    content: '步骤'; flex: none; align-self: center; font-size: 13px; color: var(--muted); margin-right: 4px;
  }

  .flow-desc { font-size: 15px; line-height: 1.6; background: #f8fafc; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
  .flow-desc b { color: var(--m-color); }

  /* 看板 */
  .board-hint { font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1000 / 520;
    background: linear-gradient(180deg, #f8fbff, #eef3fb);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .board .flow-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  /* 连线仍走卡片下层（看起来是"从卡片背后穿过"），只有飞行的胶囊浮到最上层 */
  .board .tok-svg { z-index: 5; }

  /* 泳道 */
  .board .lane { position: absolute; top: 0; bottom: 0; z-index: 1; }
  .board .lane.alt { background: rgba(37,99,235,.05); }
  .board .ln-lbl {
    position: absolute; top: .8%; left: 50%; transform: translateX(-50%);
    font-size: calc(var(--bs, 18px) * 1.0); font-weight: 700; color: #5b6675;
    letter-spacing: 1px; white-space: nowrap; z-index: 2;
  }
  .board .ln-bg { position: absolute; top: 0; bottom: 0; width: 1px; background: repeating-linear-gradient(180deg, #dbe3ee 0 6px, transparent 6px 12px); z-index: 2; }

  /* 连线 */
  .board .edge { fill: none; stroke: #aab6c8; stroke-width: 2.2; stroke-linejoin: round; }
  .board .edge.flow { stroke-width: 2.8; stroke-dasharray: 10 8; animation: dashmove 1.15s linear infinite; }
  .board .edge.info { stroke: #8aa6e8; stroke-width: 2; stroke-dasharray: 5 6; }
  .board .edge.hot { stroke: var(--m-color); }
  .board .edge.hot.info { stroke: #3b6fe0; }
  .board .edge.hot.flow { animation-duration: .45s; }
  .board .edge-lbl {
    fill: #7c8698; font-size: calc(var(--bs, 18px) * .62); text-anchor: middle; font-weight: 700;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Heiti SC", SimHei, "黑体", "Microsoft JhengHei", "Segoe UI", Roboto, Arial, sans-serif;
  }
  .board .edge.hot + .edge-lbl { fill: var(--m-color); }
  /* 画幅极大时（如 2560 宽投影）标签会宽过节点空隙，自动隐藏文字、保留箭头 */
  .board.lbl-off .edge-lbl { display: none; }
  @keyframes dashmove { to { stroke-dashoffset: -32; } }

  /* 节点：主标题放大，副标题默认隐藏、悬停时以提示框显示 */
  .board .node {
    position: absolute; z-index: 4; background: #fff; border: 2px solid #c3cddb;
    border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 1px 3px; box-shadow: 0 1px 3px rgba(15,23,42,.07); transition: .2s ease;
    cursor: pointer;
  }
  .board .node .nd-t {
    font-size: calc(var(--bs, 18px) * 1.05); font-weight: 800; line-height: 1.0;
    color: #111827;
  }
  .board .node .nd-s { display: none; }   /* 副标题移到悬停提示，避免缩小字号 */
  .board .node.active { border-color: var(--m-color); background: #e8f1ff; box-shadow: 0 0 0 4px rgba(37,99,235,.22); }
  /* 节点可点击（跳转到对应演示步骤）。
     悬停只用描边 + 底色 + 细光环做提示，不做缩放：同列节点间隙只有几像素，
     一旦放大就会贴到相邻节点、把流向箭头挤住（之前的"偏移/遮挡"就是这个来源）。 */
  .board .node:hover {
    border-color: var(--m-color); background: #eaf2ff;
    box-shadow: 0 0 0 2px rgba(37,99,235,.30); z-index: 6;
  }
  .board .node.done { border-color: #6ee7a0; background: #f0fdf5; }
  .board .node.done::after {
    content: '✓'; position: absolute; top: -8px; right: -7px; width: 17px; height: 17px;
    background: #22c55e; color: #fff; border-radius: 50%; font-size: 11px; line-height: 17px;
    text-align: center; font-weight: 700;
  }

  /* 飞行的单据/物料 token */
  .board .token { stroke: #fff; stroke-width: 1.6; }
  .board .token.m { fill: var(--m-color); }
  .board .token.b { fill: var(--b-color); }
  .board .token.s { fill: var(--s-color); }
  .board .token.doc { fill: #64748b; }
  .board .token.fin { fill: #7c3aed; }
  .board .token-txt {
    fill: #fff; font-size: calc(var(--bs, 18px) * .84); font-weight: 800;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Heiti SC", SimHei, "黑体", "Microsoft JhengHei", "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* 看板图例 */
  .board-legend {
    display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
    font-size: 14px; color: var(--muted); margin: -6px 0 18px;
  }
  .board-legend .lg { display: flex; align-items: center; gap: 7px; }
  .board-legend .ln { display: inline-block; width: 34px; height: 0; border-top-width: 2.5px; border-top-style: solid; }
  .board-legend .ln.flow { border-color: #c2cad8; border-top-style: dashed; }
  .board-legend .ln.info { border-color: #8aa6e8; border-top-style: dashed; }

  /* ===== 同屏演示模式（点「⤢ 同屏演示」按钮或按 D 切换）：
     收起页头、图例与参考卡片，并收窄画幅，让两块看板同时落在一屏内 ===== */
  body.focus-mode .legend,
  body.focus-mode .card:not(.flow-demo) { display: none; }
  body.focus-mode .flow-demo { margin-top: 0; margin-bottom: 0; padding: 8px 10px; }
  /* 同屏模式把页面级留白也收掉，省下的每一像素都会变成看板尺寸（字号） */
  body.focus-mode .page#mainView { max-width: none; padding-top: 2px; padding-bottom: 2px; }
  body.focus-mode .page#mainView footer { display: none; }
  body.focus-mode .mv-board, body.focus-mode .board { margin-bottom: 6px; }
  /* 屏幕不高时收起步骤副标题，控制条保持单行，省下约 50px 给看板 */
  @media (max-height: 900px) {
    .flow-demo .step-module { display: none; }
    .flow-demo .step-title { font-size: 15px; }
    .flow-demo .btn { font-size: 12px; padding: 4px 9px; }
    .flow-demo .flow-desc { font-size: 13px; padding: 6px 10px; }
    .flow-demo .stepper { gap: 6px; margin-bottom: 4px; }
    .flow-demo { padding: 10px 12px; }
  }
  /* 同屏模式：只留两个动画和最小限度的控制条，其余全部收起，把空间让给看板 */
  body.focus-mode header,
  body.focus-mode .legend,
  body.focus-mode .card:not(.flow-demo),
  body.focus-mode .flow-body,
  body.focus-mode .flow-demo h2,
  body.focus-mode .flow-demo .sub,
  body.focus-mode .flow-demo .step-module,
  body.focus-mode .flow-demo .flow-progress,
  body.focus-mode .flow-demo .step-nav,
  body.focus-mode .flow-demo .flow-desc,
  body.focus-mode .flow-demo .board-hint,
  body.focus-mode .flow-demo .board-legend,
  body.focus-mode .flow-demo .mv-head,
  body.focus-mode .flow-demo footer { display: none; }
  .flow-demo { max-width: 1200px; max-width: min(1200px, calc(100vw - 32px)); margin-left: auto; margin-right: auto; }
  body.focus-mode .flow-demo { max-width: none; }
  .flow-demo .step-nav { flex-wrap: nowrap; overflow-x: auto; }
  .flow-demo .step-nav b:not(.active):not(:hover) { display: none; }
  .flow-demo .flow-desc { max-height: 42vh; overflow-y: auto; }



  /* ===== 物料流动看板（工厂 / 委外商 / 三仓） ===== */
  .mv-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 6px;
  }
  .mv-head b { font-size: 17px; }
  .mv-head span { font-size: 13px; color: var(--muted); }

  .mv-board {
    position: relative; width: 100%; aspect-ratio: 1000 / 440;
    background: linear-gradient(180deg, #f7fbff, #eef3fa);
    border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; margin-bottom: 8px;
  }
  /* 同屏演示：物料看板切换成「一行横向」紧凑版（1000 × 210）。
     两块看板的总高从 0.52+0.44=0.96 个画幅宽降到 0.52+0.21=0.73，
     同样一屏之内画幅可以宽出三分之一，字号随之放大约 40%。 */
  .mv-board.row { aspect-ratio: 1000 / 200; }
  .mv-board.row .mv-node { padding: 3px 5px 3px; border-radius: 8px; }
  .mv-board.row .mv-sub { font-size: calc(var(--mvs, 15px) * .64); }
  .mv-board.row .mv-chip { font-size: calc(var(--mvs, 15px) * .72); }
  /* 卡片缩小后连线通道变宽，这里把引导线画实一点，演示时看得清走哪条线 */
  .mv-board.row .mv-arc { stroke-width: 2.2; }
  .mv-board.row .mv-arc.demo { stroke: #adbdd2; stroke-dasharray: 5 6; }
  .mv-board.row .mv-arc.on { stroke-width: 3.4; }
  .mv-board.row .mv-tok-txt { font-size: calc(var(--mvs, 15px) * .74); }
  .mv-board .mv-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .mv-board .mv-arc { fill: none; stroke: #c8d3e2; stroke-width: 2; stroke-dasharray: 7 7; }
  .mv-board .mv-arc.demo { stroke: #b9c6d8; stroke-dasharray: 2 9; stroke-linecap: round; }
  .mv-board .mv-arc.on { stroke: var(--m-color); stroke-width: 3; animation: dashmove 1s linear infinite; }

  /* 厂区 / 仓库卡片 */
  .mv-node {
    position: absolute; transform: translate(-50%, -50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 5px 6px 6px; text-align: center;
    background: #fff; border: 2px solid #c3cddb; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(15,23,42,.07); transition: .2s ease;
  }
  .mv-node .mv-ic { line-height: 0; color: #64748b; }
  .mv-node .mv-ic svg { width: 100%; height: 100%; display: block; }
  .mv-node .mv-name { font-size: calc(var(--mvs, 15px) * 1.0); font-weight: 800; line-height: 1.05; color: #111827; }
  .mv-node .mv-sub { font-size: calc(var(--mvs, 15px) * .74); color: var(--muted); line-height: 1.05; white-space: nowrap; }
  .mv-node .mv-mat { font-size: calc(var(--mvs, 15px) * .74); color: #475569; line-height: 1.1; }
  .mv-node .mv-qty {
    font-size: calc(var(--mvs, 15px) * .86); font-weight: 800; color: #0f172a;
    font-variant-numeric: tabular-nums;
  }
  .mv-node .mv-qty i { font-style: normal; font-size: calc(var(--mvs, 15px) * .68); color: var(--muted); }

  .mv-node.raw  { border-color: #f2c98a; background: #fffdf7; }
  .mv-node.semi { border-color: #a9c3f5; background: #f8fbff; }
  .mv-node.fin  { border-color: #8fdcb4; background: #f7fefa; }
  .mv-node.raw  .mv-ic { color: var(--b-color); }
  .mv-node.semi .mv-ic { color: var(--m-color); }
  .mv-node.fin  .mv-ic { color: var(--s-color); }

  .mv-node.active { border-color: var(--m-color); box-shadow: 0 0 0 4px rgba(37,99,235,.20); z-index: 6; }
  .mv-node.working { border-color: #16a34a; box-shadow: 0 0 0 4px rgba(22,163,74,.20); z-index: 6; }
  .mv-node.working .mv-ic { animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .mv-node .mv-chips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 1px; }
  .mv-node .mv-chip {
    font-size: calc(var(--mvs, 15px) * .68); padding: 0 5px; border-radius: 5px; line-height: 1.3;
    background: #eef2f7; color: #475569; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .mv-node.raw  .mv-chip { background: var(--b-bg); color: var(--b-color); }
  .mv-node.semi .mv-chip { background: var(--m-bg); color: var(--m-color); }
  .mv-node.fin  .mv-chip { background: var(--s-bg); color: var(--s-color); }
  .mv-node .mv-chip.up { background: #d1fae5; color: #047857; font-weight: 700; }

  .mv-node.ghost { border-style: dashed; border-color: #cbd5e1; background: #f8fafc; }
  .mv-node.ghost .mv-name { color: #475569; }
  .mv-board .mv-tok { stroke: #fff; stroke-width: 1.8; }
  .mv-board .mv-tok.m { fill: var(--m-color); }
  .mv-board .mv-tok.b { fill: var(--b-color); }
  .mv-board .mv-tok.s { fill: var(--s-color); }
  .mv-board .mv-tok.doc { fill: #64748b; }
  .mv-board .mv-tok-txt {
    fill: #fff; font-size: calc(var(--mvs, 15px) * .8); font-weight: 800;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Heiti SC", SimHei, "黑体", "Microsoft JhengHei", "Segoe UI", Roboto, Arial, sans-serif;
  }
  /* 演示时收起标题 / 副标题 / 提示 / 图例，把纵向空间全部留给两个动画 */
  .flow-demo .board-hint,
  .flow-demo .board-legend,
  .flow-demo .flow-body { display: none; }
  .flow-demo { padding-top: 12px; }
  .flow-body { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

<script>

/* ============ 1. BOM 数据（多级树） ============ */
/* 物料编码 / 名称 / 类型 / 单位 / 单位用量 / 提前期 与《ERP物料图_提前期与完成期》完全一致：
   铝材只有 12310 一个编码，源数据给的是「长针 + 短针 + 秒针合计 20 g/台」，故标 shared 只计一次；
   塑料只有 12411 一个编码（盘体 0.5 kg/台 + 钟框 0.5 kg/台，合计 1 kg/台）。
   lead = 提前期（天）；cal = 倒排口径：自制件按工作日、采购件/委外件按自然日。 */
const BOM = {
  code: "10000", name: "电子挂钟", type: "M", unit: "个", qty: 1, lead: 3, cal: "工作日",
  children: [
    { code: "11000", name: "机芯", type: "B", unit: "个", qty: 1, lead: 3, cal: "自然日" },
    { code: "12000", name: "钟盘", type: "M", unit: "个", qty: 1, lead: 2, cal: "工作日", children: [
      { code: "12100", name: "长针", type: "M", unit: "根", qty: 1, lead: 1, cal: "工作日", children: [
        { code: "12310", name: "铝材", type: "B", unit: "g", qty: 20, lead: 4, cal: "自然日", shared: true } ] },
      { code: "12200", name: "短针", type: "M", unit: "根", qty: 1, lead: 1, cal: "工作日", children: [
        { code: "12310", name: "铝材", type: "B", unit: "g", qty: 20, lead: 4, cal: "自然日", shared: true } ] },
      { code: "12300", name: "秒针", type: "M", unit: "根", qty: 1, lead: 1, cal: "工作日", children: [
        { code: "12310", name: "铝材", type: "B", unit: "g", qty: 20, lead: 4, cal: "自然日", shared: true } ] },
      { code: "12400", name: "盘面", type: "M", unit: "个", qty: 1, lead: 1, cal: "工作日", children: [
        { code: "12410", name: "盘体", type: "S", unit: "个", qty: 1, lead: 2, cal: "自然日", children: [
          { code: "12411", name: "塑料", label: "塑料①", type: "B", unit: "kg", qty: 0.5, lead: 1, cal: "自然日" } ] },
        { code: "12420", name: "字膜", type: "M", unit: "个", qty: 4, lead: 2, cal: "工作日", children: [
          { code: "12421", name: "薄膜", type: "B", unit: "m", qty: 0.05, lead: 1, cal: "自然日" } ] }
      ]}
    ]},
    { code: "13000", name: "钟框", type: "S", unit: "个", qty: 1, lead: 2, cal: "自然日", children: [
      { code: "12411", name: "塑料", label: "塑料②", type: "B", unit: "kg", qty: 0.5, lead: 1, cal: "自然日" } ] },
    { code: "14000", name: "电池", type: "B", unit: "节", qty: 2, lead: 1, cal: "自然日" }
  ]
};

/* ============ 2. 展平 + 布局计算 ============ */
const nodes = {};          // code -> BOM 节点（同一物料只留一份，供查询名称/类型/单位）
const flatList = [];       // 唯一物料清单（物料表 + 小游戏题库）
const parentsOf = {};      // code -> [父件编码]：共用件（铝材、塑料）会有两个父件
const useQty = {};         // "父件|子件" -> 单位用量：同一物料在不同父件下用量不同
let leafCounter = 0;
let maxDepthSeen = 0;      // 整棵树的最大层级（共用件按最深的一次出现算）

function build(node, depth, parentCode) {
  node.depth = depth;
  node.parent = parentCode;
  if (depth > maxDepthSeen) maxDepthSeen = depth;
  let info = flatList.filter(x => x.code === node.code)[0];
  if (info) {
    /* 共用件：塑料 12411（盘体 0.5 kg + 钟框 0.5 kg）要累加成 1 kg/台；
       铝材 12310 在 ERP 源数据里本就是「长针 + 短针合计 20 g/台」，
       所以标了 shared 的节点只计一次，避免重复算成 40 g。 */
    if (!node.shared) info.qty += node.qty;
  } else {
    info = { code: node.code, name: node.name, label: node.label, type: node.type,
             unit: node.unit, qty: node.qty, lead: node.lead, cal: node.cal,
             depth, parent: parentCode,
             children: (node.children || []).map(c => c.code) };
    nodes[node.code] = node;
    flatList.push(info);
  }
  if (parentCode) {
    useQty[parentCode + '|' + node.code] = node.qty;
    if (!parentsOf[node.code]) parentsOf[node.code] = [];
    if (parentsOf[node.code].indexOf(parentCode) < 0) parentsOf[node.code].push(parentCode);
  }

  const kids = node.children || [];
  if (kids.length === 0) {
    node.x = leafCounter++;          // 叶子按顺序编号（共用件按出现次数各占一格）
  } else {
    kids.forEach(c => build(c, depth + 1, node.code));
    node.x = kids.reduce((s, c) => s + c.x, 0) / kids.length;  // 父件取子件平均
  }
}
build(BOM, 0, null);

const maxDepth = maxDepthSeen;

/* 页头统计由数据算出来 —— 以前是写死的数字，改了 BOM 就会过期（已经发生过两次） */

  set('statB', byType.B);
  set('statEnd', flatList.filter(function (n) { return n.depth === 0; }).length);
